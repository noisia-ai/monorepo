<!-- slide: channels · Dónde vive la conversación, y qué hace cada plataforma · variants: light
     Repeat the .role block per channel, widest bar first. The role is the point: it must be
     demonstrable with verbatims from that channel (DATA.md §18), never a platform stereotype.
     Frame it as where people talk and what each platform is for. NEVER as "share of voice de la
     categoría" (COPY_RULES.md §0). Brand marks: Simple Icons, white on the brand color (ICONS.md). -->
<section class="slide" data-label="Canales">
  <div class="frame">
    <div class="slide-header">
      <div class="left"><img class="logo" src="logo_norm.svg" alt="Noisia"></div>
      <div class="right"><span>{{HEADER_RIGHT}}</span></div>
    </div>
    <div class="mid">
      <span class="eb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><!-- iconoir inner paths, see ICONS.md --></svg>{{EYEBROW}}</span>
      <h2 class="hl">{{TITLE}}</h2>
      <div class="roles" style="margin-top:22px;">
        <div class="role">
          <div class="rl">
            <span class="cc" style="background:{{CH1_COLOR}}"><svg viewBox="0 0 24 24" fill="#fff"><!-- simple-icons path --></svg></span>
            <div><div class="rn">{{CH1_NAME}}</div><div class="rp">{{CH1_SHARE}}</div></div>
          </div>
          <div><span class="rbar" style="width:{{CH1_BAR}}%"></span><div class="rd"><b>{{CH1_ROLE}}</b> {{CH1_DETAIL}}</div></div>
        </div>
        <div class="role">
          <div class="rl">
            <span class="cc" style="background:{{CH2_COLOR}}"><svg viewBox="0 0 24 24" fill="#fff"><!-- simple-icons path --></svg></span>
            <div><div class="rn">{{CH2_NAME}}</div><div class="rp">{{CH2_SHARE}}</div></div>
          </div>
          <div><span class="rbar" style="width:{{CH2_BAR}}%"></span><div class="rd"><b>{{CH2_ROLE}}</b> {{CH2_DETAIL}}</div></div>
        </div>
        <div class="role">
          <div class="rl">
            <span class="cc" style="background:{{CH3_COLOR}}"><svg viewBox="0 0 24 24" fill="#fff"><!-- simple-icons path --></svg></span>
            <div><div class="rn">{{CH3_NAME}}</div><div class="rp">{{CH3_SHARE}}</div></div>
          </div>
          <div><span class="rbar" style="width:{{CH3_BAR}}%"></span><div class="rd"><b>{{CH3_ROLE}}</b> {{CH3_DETAIL}}</div></div>
        </div>
      </div>
      <div class="note" style="margin-top:22px;">
        <div class="icobox"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><!-- iconoir inner paths --></svg></div>
        <p>{{NOTE}}</p>
      </div>
    </div>
    <div class="slide-footer"><span>noisia · social intelligence architects</span><span>{{FOOTER_NN}} / {{FOOTER_TOTAL}}</span></div>
  </div>
</section>
