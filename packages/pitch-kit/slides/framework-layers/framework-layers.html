<!-- slide: framework-layers · Explica un marco antes de que cualquier slide lo use · variants: light
     Neutral by design: the two fields per card are free. For Triggers & Barriers they are the
     trigger and the barrier; for another framework they are whatever that framework opposes, or a
     single line if it opposes nothing. For the T&B version WITH the concentric map behind it, use
     `tb-layers` instead.
     The rule this slide exists to enforce: a framework gets explained on its own slide, in plain
     language, BEFORE any slide uses it. Never introduce a frame and use it in the same breath.
     Repeat the .fwc block per dimension. Two columns holds four comfortably. -->
<section class="slide" data-label="El marco">
  <div class="frame">
    <div class="slide-header">
      <div class="left"><img class="logo" src="logo_norm.svg" alt="Noisia"></div>
      <div class="right"><span>{{HEADER_RIGHT}}</span></div>
    </div>
    <div class="mid">
      <span class="eb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><!-- iconoir inner paths, see ICONS.md --></svg>{{EYEBROW}}</span>
      <h2 class="hl" style="margin-bottom:6px;">{{TITLE}}</h2>
      <p class="sub" style="margin-bottom:22px;">{{SUBHEAD}}</p>
      <div class="fwg">
        <div class="fwc">
          <div class="icobox t-teal"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><!-- iconoir --></svg></div>
          <div><div class="tag">{{D1_LABEL}}</div><h4>{{D1_TITLE}}</h4><p>{{D1_BODY}}</p></div>
        </div>
        <div class="fwc">
          <div class="icobox t-coral"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><!-- iconoir --></svg></div>
          <div><div class="tag">{{D2_LABEL}}</div><h4>{{D2_TITLE}}</h4><p>{{D2_BODY}}</p></div>
        </div>
        <div class="fwc">
          <div class="icobox t-teal"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><!-- iconoir --></svg></div>
          <div><div class="tag">{{D3_LABEL}}</div><h4>{{D3_TITLE}}</h4><p>{{D3_BODY}}</p></div>
        </div>
        <div class="fwc">
          <div class="icobox t-coral"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><!-- iconoir --></svg></div>
          <div><div class="tag">{{D4_LABEL}}</div><h4>{{D4_TITLE}}</h4><p>{{D4_BODY}}</p></div>
        </div>
      </div>
    </div>
    <div class="slide-footer"><span>noisia · social intelligence architects</span><span>{{FOOTER_NN}} / {{FOOTER_TOTAL}}</span></div>
  </div>
</section>
