      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Node workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck database package on the remote runner
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @noisia/db typecheck
      - name: Typecheck workers package on the remote runner
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @noisia/workers typecheck
      - name: Run pure Listening write-function observation contracts
        env:
          NOISIA_R16_LISTENING_WRITE_FUNCTIONS_PURE: 'true'
          NOISIA_R16_LISTENING_PARTIAL_ADMISSION_PURE: 'true'
        run: |
          set -euo pipefail
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-write-functions.test.ts \
            infrastructure/db/migrations/signal-listening-partial-admission.postgres.test.ts \
            | tee listening-partial-admission-pure.tap
          if ! grep -qx '# tests 20' listening-partial-admission-pure.tap \
            || ! grep -qx '# pass 19' listening-partial-admission-pure.tap \
            || ! grep -qx '# fail 0' listening-partial-admission-pure.tap \
            || ! grep -qx '# cancelled 0' listening-partial-admission-pure.tap \
            || ! grep -qx '# skipped 1' listening-partial-admission-pure.tap; then
            echo '::error::Pure Listening observation contracts did not run the exact 20-test, 19-pass, 1-skip census'
            exit 1
          fi
      - name: Require the owned partial admission lab and private files to be absent
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named R16 partial admission PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named R16 partial admission PostgreSQL volume already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          evidence_dir=.data/piloto-masivo/r16/partial-admission-native-evidence
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" || -e "$evidence_dir" ]]; then
            echo '::error::Private files for the named R16 partial admission lab already exist'
            exit 1
          fi
      - name: Start the owned official PostgreSQL 17 and Redis partial admission lab
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_LISTENING_PARTIAL_ADMISSION_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh partial admission lab
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          pnpm --filter @noisia/db db:smoke:migrations
      - name: Run the native Listening partial admission profile
        id: profile
        env:
          NOISIA_R16_LISTENING_PARTIAL_ADMISSION_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
        run: |
          set -o pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-partial-admission.postgres.test.ts \
            2>&1 | tee listening-partial-admission.tap
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]] \
            || ! grep -qx '# tests 1' listening-partial-admission.tap \
            || ! grep -qx '# pass 1' listening-partial-admission.tap \
            || ! grep -qx '# fail 0' listening-partial-admission.tap \
            || ! grep -qx '# cancelled 0' listening-partial-admission.tap \
            || ! grep -qx '# skipped 0' listening-partial-admission.tap \
            || ! grep -qx '# Subtest: native Listening partial admission preserves committed money and terminal idempotency' listening-partial-admission.tap; then
            echo '::error::The native partial admission diagnostic failed, was skipped, or did not execute the exact test'
            exit 1
          fi
      - name: Stop and remove only the owned partial admission lab
        id: cleanup
        if: ${{ always() && env.R16_LISTENING_PARTIAL_ADMISSION_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 partial admission PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 partial admission PostgreSQL volume survived cleanup'
            exit 1
          fi
      - name: Validate native partial admission evidence
        if: always()
        env:
          PROFILE_CONCLUSION: ${{ steps.profile.conclusion }}
          CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          set -euo pipefail
          # Financial acceptance is independent of whether Postgres exposes all counters.
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          evidence = Path(os.environ['R16_LISTENING_PARTIAL_ADMISSION_EVIDENCE_DIR']) / 'listening-partial-admission.json'
          tap = Path('listening-partial-admission.tap')
          profile_succeeded = os.environ.get('PROFILE_CONCLUSION') == 'success'
          cleanup_succeeded = os.environ.get('CLEANUP_CONCLUSION') == 'success'
          for path, cap in ((evidence, 2 * 1024 * 1024), (tap, 1024 * 1024)):
              if not path.is_file() or path.is_symlink() or path.stat().st_size <= 0 or path.stat().st_size > cap:
                  raise SystemExit('Partial admission evidence file is missing, unsafe, empty, or over its cap')
          with evidence.open(encoding='utf-8') as stream:
              report = json.load(stream)
          if type(report) is not dict:
              raise SystemExit('Partial admission receipt must be one JSON object')
          expected = {'contract': 'r16-listening-partial-admission-v1',
              'diagnostic_only': True, 'h1_accepted': False, 'scope': 'functional240_not_H1_or_scale1024_4096',
              'cap_micro_usd': '50000', 'native_population_roots': 240, 'recovery_execution_claimed': False,
              'external_spend_micro_usd': '0'}
          if any(type(report.get(key)) is not type(value) or report.get(key) != value for key, value in expected.items()):
              raise SystemExit('Partial admission receipt does not match its diagnostic-only contract')
          if report.get('status') not in ('observed', 'failed'):
              raise SystemExit('Partial admission receipt status is not recognized')
          if 'candidate_accepted' in report or 'speedup_claim' in report:
              raise SystemExit('Partial admission receipt must not claim candidate acceptance or speedup')
          gates = report.get('gates')
          required_gates = {'source_binding', 'native_cap_interval', 'committed_before_fetch', 'delivered_drain',
              'terminal_idempotency', 'closure_confirmed'}
          if type(gates) is not dict or set(gates) != required_gates \
              or any(type(value) is not bool for value in gates.values()):
              raise SystemExit('Partial admission gates must be exactly six booleans')
          if report['status'] == 'observed':
              if not profile_succeeded or not cleanup_succeeded or any(value is not True for value in gates.values()):
                  raise SystemExit('Observed partial admission requires a passing profile, cleanup and six true gates')
              terminal = report.get('terminal_restart')
              expected_terminal = {'claim_attempted': True, 'claimed': False, 'status': 'not_claimed',
                  'new_physical_fetches': 0, 'recovery_execution_claimed': False}
              if type(terminal) is not dict or set(terminal) != set(expected_terminal) \
                  or any(type(terminal.get(key)) is not type(value) or terminal.get(key) != value
                         for key, value in expected_terminal.items()):
                  raise SystemExit('Partial admission terminal idempotency witness is incomplete')
          elif profile_succeeded or not cleanup_succeeded:
              raise SystemExit('A failed receipt requires a failed native profile and successful owned-lab cleanup')
          source = report.get('source')
          if type(source) is not dict:
              raise SystemExit('Full immutable Git source binding is missing')
          expected_source, before_source, after_source = source.get('expected'), source.get('before'), source.get('after')
          def valid_manifest(value):
              if type(value) is not dict or set(value) != {'head_sha', 'source_tree_sha256', 'tree_status_sha256', 'file_count', 'file_manifest'}:
                  return False
              if value.get('head_sha') != os.environ.get('GITHUB_SHA'):
                  return False
              count, manifest = value.get('file_count'), value.get('file_manifest')
              if type(count) is not int or count <= 0 or type(manifest) is not list or len(manifest) != count:
                  return False
              paths, pairs = [], []
              for entry in manifest:
                  if type(entry) is not dict or set(entry) != {'path', 'sha256'} or type(entry.get('path')) is not str \
                      or type(entry.get('sha256')) is not str or len(entry['sha256']) != 71 \
                      or not entry['sha256'].startswith('sha256:') or any(ch not in '0123456789abcdef' for ch in entry['sha256'][7:]):
                      return False
                  paths.append(entry['path']); pairs.append([entry['path'], entry['sha256']])
              if paths != sorted(set(paths)):
                  return False
              tree = 'sha256:' + hashlib.sha256(json.dumps(pairs, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
              empty_status = 'sha256:' + hashlib.sha256(b'').hexdigest()
              return value.get('source_tree_sha256') == tree and value.get('tree_status_sha256') == empty_status
          if not all(valid_manifest(value) for value in (expected_source, before_source, after_source)) \
              or before_source != expected_source or after_source != expected_source:
              raise SystemExit('Expected Git and full runtime before/after manifests must match exactly')
          writes = report.get('write_functions')
          if type(writes) is not dict:
              raise SystemExit('Three-phase write-function observation is missing')
          write_expected = {'contract': 'r16-listening-write-functions-v1', 'diagnostic_only': True,
              'h1_accepted': False, 'cpu': 'UNKNOWN', 'closed': True,
              'function_coverage': 'TRACKED_PUBLIC_ROWS_ONLY_MISSING_UNKNOWN'}
          if any(type(writes.get(key)) is not type(value) or writes.get(key) != value
                 for key, value in write_expected.items()) or writes.get('status') not in ('observed', 'INCONCLUSIVE', 'failed'):
              raise SystemExit('Write-function observation does not match its diagnostic-only contract')
          write_json = json.dumps(writes, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          if len(write_json) > 2 * 1024 * 1024:
              raise SystemExit('Write-function observation exceeds its 2 MiB JSON cap')
          write_gates = writes.get('gates')
          write_gate_names = {'three_original_statements', 'native_commit_ack', 'identity_and_settings_restored',
              'counters_known', 'no_recording_loss'}
          sample_types = {'null', 'undefined', 'string', 'boolean', 'bigint', 'symbol', 'function', 'array', 'object',
              'number_safe_integer_nonnegative', 'number_unsafe_integer_nonnegative', 'number_fraction_nonnegative',
              'number_negative', 'number_nonfinite', 'UNKNOWN'}
          sample_stages = {'query', 'row_count', 'catalog_name', 'catalog_shape', 'counter_values', 'done'}
          if type(write_gates) is not dict or set(write_gates) != write_gate_names \
              or any(type(write_gates.get(name)) is not bool for name in write_gate_names):
              raise SystemExit('Write-function observation gates must be exactly five booleans')
          if report['status'] == 'failed':
              if writes.get('status') != 'failed':
                  raise SystemExit('A failed Native receipt must retain a failed write-function observation')
              captures = writes.get('captures')
              if type(captures) is not list or len(captures) > 3:
                  raise SystemExit('Failed write-function diagnostics exceed the three-phase cap')
              phases = {'reserve', 'mark', 'apply'}
              seen_phases = set()
              for capture in captures:
                  if type(capture) is not dict or capture.get('phase') not in phases or capture['phase'] in seen_phases:
                      raise SystemExit('Failed write-function diagnostic phase is malformed or repeated')
                  seen_phases.add(capture['phase'])
                  if 'failure_reason' in capture:
                      reason = capture.get('failure_reason')
                      if type(reason) is not str or reason != 'UNKNOWN' and not (reason.startswith('write_functions_') and reason.replace('_', '').isalnum()):
                          raise SystemExit('Write-function failure reason is not a safe code token')
                  sampling = capture.get('sampling')
                  if type(sampling) is not dict or set(sampling) != {'before', 'after'}:
                      raise SystemExit('Write-function sampling checkpoints are missing or malformed')
                  for checkpoint in sampling.values():
                      if checkpoint is None:
                          continue
                      required = {'stage', 'rows_seen', 'row_index'}
                      optional = {'oid_type', 'name_membership', 'unknown_catalog_name', 'catalog_types', 'counter_types'}
                      if type(checkpoint) is not dict or not required.issubset(checkpoint) or set(checkpoint) - required - optional:
                          raise SystemExit('Write-function sampling checkpoint contains unrecognized fields')
                      if checkpoint.get('stage') not in sample_stages:
                          raise SystemExit('Write-function sampling stage is unrecognized')
                      rows_seen = checkpoint.get('rows_seen')
                      if rows_seen != 'UNKNOWN' and (type(rows_seen) is not int or not 0 <= rows_seen <= 65):
                          raise SystemExit('Write-function sample row count is outside its diagnostic cap')
                      row_index = checkpoint.get('row_index')
                      if row_index is not None and (type(row_index) is not int or not 1 <= row_index <= 64):
                          raise SystemExit('Write-function sample row index is outside its diagnostic cap')
                      if 'oid_type' in checkpoint and checkpoint['oid_type'] not in sample_types:
                          raise SystemExit('Write-function OID type is not in its closed enum')
                      if 'name_membership' in checkpoint and checkpoint['name_membership'] not in ('known', 'unknown', 'not_string', 'UNKNOWN'):
                          raise SystemExit('Write-function name membership is not in its closed enum')
                      if 'unknown_catalog_name' in checkpoint:
                          item = checkpoint['unknown_catalog_name']
                          if type(item) is not dict or set(item) != {'sha256', 'value_type'} or item.get('value_type') not in sample_types:
                              raise SystemExit('Unknown catalog-name diagnostic is malformed')
                          digest = item.get('sha256')
                          if digest is not None and (type(digest) is not str or len(digest) != 64 or any(ch not in '0123456789abcdef' for ch in digest)):
                              raise SystemExit('Unknown catalog-name digest is malformed')
                      for key, fields in (('catalog_types', {'language', 'volatility', 'security_definer', 'prosrc', 'signature', 'proconfig'}),
                                          ('counter_types', {'calls', 'total_time', 'self_time'})):
                          if key in checkpoint and (type(checkpoint[key]) is not dict or set(checkpoint[key]) != fields
                              or any(value not in sample_types for value in checkpoint[key].values())):
                              raise SystemExit('Write-function sampled type tags are malformed')
                  for sample_name in ('before', 'after', 'deltas'):
                      if sample_name in capture and (type(capture[sample_name]) is not list or len(capture[sample_name]) > 64):
                          raise SystemExit('Failed write-function row samples exceed their 64-row cap')
              if not profile_succeeded and cleanup_succeeded:
                  print('Partial admission safe failure diagnostics validated; the Native profile remains failed')
                  raise SystemExit('Native partial admission profile failed; safe diagnostic evidence retained')
              raise SystemExit('A failed write-function receipt cannot pass Native validation')
          if not cleanup_succeeded or not profile_succeeded:
              raise SystemExit('Observed partial admission requires a passing native profile and owned-lab cleanup')
          if any(write_gates[name] is not True for name in write_gate_names - {'counters_known'}):
              raise SystemExit('All three original writes, commit acknowledgements, restoration and recording must be observed')
          captures = writes.get('captures')
          if type(captures) is not list or len(captures) != 3:
              raise SystemExit('Exactly three original write-phase captures are required')
          phases = {'reserve', 'mark', 'apply'}
          if {capture.get('phase') for capture in captures if type(capture) is dict} != phases \
              or any(type(capture) is not dict for capture in captures):
              raise SystemExit('Write-function phases must be reserve, mark and apply exactly once')
          all_known = True
          for capture in captures:
              encoded_capture = json.dumps(capture, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              if len(encoded_capture) > 128 * 1024:
                  raise SystemExit('A write-function capture exceeds its 128 KiB cap')
              phase = capture['phase']
              expected_binds = {'reserve': 8, 'mark': 2, 'apply': 4}[phase]
              if type(capture.get('original_executions')) is not int or capture['original_executions'] != 1 \
                  or capture.get('original_succeeded') is not True or capture.get('stage') != 'committed' \
                  or capture.get('native_commit_ack') is not True or capture.get('identity_same') is not True \
                  or capture.get('settings_restored') is not True or capture.get('result_reference_preserved') is not True:
                  raise SystemExit('A native write was missing, repeated, uncommitted or not restored')
              proposed, roots, row_count = capture.get('proposed_rows'), capture.get('batch_roots'), capture.get('row_count')
              elapsed, binds = capture.get('elapsed_dml_ms'), capture.get('bind_count')
              if type(proposed) is not int or not 1 <= proposed <= 512 or type(roots) is not int \
                  or not 1 <= roots <= proposed or type(row_count) is not int or row_count < 0 \
                  or type(binds) is not int or binds != expected_binds or type(elapsed) not in (int, float) \
                  or not math.isfinite(elapsed) or elapsed < 0:
                  raise SystemExit('Write-function proposal, row or timing summary is malformed')
              if any(key in capture for key in ('safe_error_tree', 'failure_stage', 'transaction_rolled_back',
                    'capture_payload_rejected_over_bytes', 'capture_bytes_observed')):
                  raise SystemExit('A write-function capture records a failed or truncated observation')
              sampling = capture.get('sampling')
              if type(sampling) is not dict or set(sampling) != {'before', 'after'}:
                  raise SystemExit('Successful write-function sampling checkpoints are missing')
              for checkpoint in sampling.values():
                  if type(checkpoint) is not dict or set(checkpoint) - {'stage', 'rows_seen', 'row_index', 'oid_type',
                          'name_membership', 'unknown_catalog_name', 'catalog_types', 'counter_types'} \
                      or not {'stage', 'rows_seen', 'row_index'}.issubset(checkpoint) or checkpoint.get('stage') != 'done':
                      raise SystemExit('Successful write-function sampling checkpoint is malformed or incomplete')
                  rows_seen, row_index = checkpoint.get('rows_seen'), checkpoint.get('row_index')
                  if type(rows_seen) is not int or not 0 <= rows_seen <= 64 \
                      or row_index is not None and (type(row_index) is not int or not 1 <= row_index <= 64):
                      raise SystemExit('Successful write-function sample counters exceed their closed bounds')
                  if 'oid_type' in checkpoint and checkpoint['oid_type'] not in sample_types:
                      raise SystemExit('Successful write-function OID type is not in its closed enum')
                  if 'name_membership' in checkpoint and checkpoint['name_membership'] not in ('known', 'unknown', 'not_string', 'UNKNOWN'):
                      raise SystemExit('Successful write-function name membership is not in its closed enum')
                  for key, fields in (('catalog_types', {'language', 'volatility', 'security_definer', 'prosrc', 'signature', 'proconfig'}),
                                      ('counter_types', {'calls', 'total_time', 'self_time'})):
                      if key in checkpoint and (type(checkpoint[key]) is not dict or set(checkpoint[key]) != fields
                          or any(value not in sample_types for value in checkpoint[key].values())):
                          raise SystemExit('Successful write-function sampled type tags are malformed')
              for samples_name in ('before', 'after'):
                  samples = capture.get(samples_name)
                  if type(samples) is not list or len(samples) > 64:
                      raise SystemExit('Function counter samples are missing or exceed their cap')
              deltas = capture.get('deltas')
              if type(deltas) is not list or len(deltas) > 64:
                  raise SystemExit('Function counter deltas are missing or exceed their cap')
              if not deltas:
                  if capture['before'] or capture['after']:
                      raise SystemExit('Empty function deltas require both public counter samples to be empty')
                  all_known = False
              for delta in deltas:
                  if type(delta) is not dict:
                      raise SystemExit('Function counter delta is malformed')
                  if delta.get('status') == 'UNKNOWN':
                      all_known = False
                      if delta.get('reason') not in ('baseline_absent', 'after_absent') \
                          or any(delta.get(key) != 'UNKNOWN' for key in ('calls', 'total_time', 'self_time')):
                          raise SystemExit('Unknown counters require an explicit absent sample and UNKNOWN values')
                  elif delta.get('status') == 'known':
                      for key in ('calls', 'total_time', 'self_time'):
                          value = delta.get(key)
                          if type(value) not in (int, float) or not math.isfinite(value) or value < 0:
                              raise SystemExit('Known function counter delta is invalid')
                  else:
                      raise SystemExit('Function counter delta has an unrecognized status')
          if write_gates['counters_known'] is not all_known \
              or writes.get('status') != ('observed' if all_known else 'INCONCLUSIVE'):
              raise SystemExit('INCONCLUSIVE is allowed only when a counter baseline or after sample is absent')
          print('Partial admission evidence: six gates and immutable full-source binding verified')
          PY
      - name: Upload native partial admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-partial-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            listening-partial-admission.tap
            .data/piloto-masivo/r16/partial-admission-native-evidence/listening-partial-admission.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  listening-input-plan-probe-experimental:
    name: R16 Listening original input-plan observer (isolated lab)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'input-plan-only' && inputs.listening_input_plan_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
      R16_LISTENING_INPUT_PLAN_EVIDENCE_DIR: .data/piloto-masivo/r16/input-plan-native-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Initialize input-plan observer TAP receipt
        run: printf '%s\n' '# native Listening input-plan observer did not start' > input-plan-observer.tap
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Node workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck database package on the remote runner
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @noisia/db typecheck
      - name: Typecheck workers package on the remote runner
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @noisia/workers typecheck
      - name: Run pure input-plan observation contracts
        env:
          NOISIA_R16_LISTENING_INPUT_PLAN_PURE: 'true'
        run: |
          set -euo pipefail
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-input-plan.synthetic.fixture.test.ts \
            infrastructure/db/migrations/signal-listening-input-plan.postgres.test.ts \
            | tee input-plan-observer-pure.tap
          if ! grep -qx '# tests 11' input-plan-observer-pure.tap \
            || ! grep -qx '# pass 10' input-plan-observer-pure.tap \
            || ! grep -qx '# fail 0' input-plan-observer-pure.tap \
            || ! grep -qx '# skipped 1' input-plan-observer-pure.tap \
            || ! grep -qx '# cancelled 0' input-plan-observer-pure.tap; then
            echo '::error::Input-plan observer pure contracts did not run the exact eleven-test, ten-pass, one-skip census'
            exit 1
          fi
      - name: Require the owned input-plan lab and private evidence to be absent
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named R16 input-plan PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named R16 input-plan PostgreSQL volume already exists'
            exit 1
          fi
          remaining_containers="$(docker ps -aq --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          remaining_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          if [[ -n "$remaining_containers" || -n "$remaining_volumes" ]]; then
            echo '::error::An R16 input-plan PostgreSQL or Redis lab resource already exists for this exact compose project'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          evidence_dir=.data/piloto-masivo/r16/input-plan-native-evidence
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" || -e "$evidence_dir" ]]; then
            echo '::error::Private files for the named R16 input-plan lab already exist'
            exit 1
          fi
      - name: Start the owned official PostgreSQL 17 and Redis input-plan lab
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_LISTENING_INPUT_PLAN_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh input-plan lab
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          pnpm --filter @noisia/db db:smoke:migrations
      - name: Run the original Listening input-plan observer
        id: profile
        env:
          NOISIA_R16_LISTENING_INPUT_PLAN_PG: 'true'
          NOISIA_R16_LISTENING_INPUT_PLAN_PURE: 'false'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
        run: |
          set -o pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-input-plan.postgres.test.ts \
            2>&1 | tee input-plan-observer.tap
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]] \
            || ! grep -qx '# tests 1' input-plan-observer.tap \
            || ! grep -qx '# pass 1' input-plan-observer.tap \
            || ! grep -qx '# fail 0' input-plan-observer.tap \
            || ! grep -qx '# cancelled 0' input-plan-observer.tap \
            || ! grep -qx '# skipped 0' input-plan-observer.tap \
            || ! grep -qx '# Subtest: native Listening input plan observes the original RR read without replay' input-plan-observer.tap; then
            echo '::error::The native input-plan observer failed, was skipped, or did not execute exactly once'
            exit 1
          fi
      - name: Stop and remove only the owned input-plan lab
        id: cleanup
        if: ${{ always() && env.R16_LISTENING_INPUT_PLAN_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 input-plan PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 input-plan PostgreSQL volume survived cleanup'
            exit 1
          fi
          remaining_containers="$(docker ps -aq --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          remaining_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          if [[ -n "$remaining_containers" || -n "$remaining_volumes" ]]; then
            echo '::error::An owned R16 input-plan PostgreSQL or Redis lab resource survived cleanup'
            exit 1
          fi
      - name: Validate the input-plan receipt and original workload evidence
        if: always()
        env:
          PROFILE_CONCLUSION: ${{ steps.profile.conclusion }}
          CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          evidence = Path(os.environ['R16_LISTENING_INPUT_PLAN_EVIDENCE_DIR'])
          observer_path = evidence / 'input-plan-observer.json'
          measurement_path = evidence / 'input-plan-measurement.json'
          tap = Path('input-plan-observer.tap')
          profile_succeeded = os.environ.get('PROFILE_CONCLUSION') == 'success'
          cleanup_succeeded = os.environ.get('CLEANUP_CONCLUSION') == 'success'
          for path, cap in ((observer_path, 4 * 1024 * 1024), (measurement_path, 4 * 1024 * 1024), (tap, 1024 * 1024)):
              if not path.is_file() or path.is_symlink() or path.stat().st_size <= 0 or path.stat().st_size > cap:
                  raise SystemExit('Input-plan evidence file is missing, unsafe, empty, or exceeds its individual cap')
          if observer_path.stat().st_size + measurement_path.stat().st_size > 4 * 1024 * 1024:
              raise SystemExit('Combined sanitized input-plan JSON exceeds 4 MiB')
          observer = json.loads(observer_path.read_text(encoding='utf-8'))
          measured = json.loads(measurement_path.read_text(encoding='utf-8'))
          if type(observer) is not dict or type(measured) is not dict:
              raise SystemExit('Input-plan evidence must contain two JSON objects')
          for value in (observer, measured):
              expected = {'diagnostic_only': True, 'h1_accepted': False, 'cpu': 'UNKNOWN',
                  'provider_mode': 'unmodified_driver_synthetic_transport',
                  'external_provider_spend_micro_usd': 0, 'external_provider_requests': 0}
              if any(type(value.get(key)) is not type(expected_value) or value.get(key) != expected_value
                     for key, expected_value in expected.items()):
                  raise SystemExit('Input-plan evidence does not match its non-paid diagnostic contract')
              if type(value.get('evidence_basis')) is not str or not value['evidence_basis']:
                  raise SystemExit('Synthetic transport evidence basis is missing')
          if observer.get('contract') != 'r16-listening-input-plan-v1' \
              or observer.get('findings') != 'INCONCLUSIVE' \
              or observer.get('owned_scope') != 'accredited_ci_lab_database' \
              or measured.get('contract') != 'r16-listening-input-plan-measurement-v1':
              raise SystemExit('Input-plan evidence contract or database scope is invalid')
          if 'candidate_accepted' in observer or 'own_database_absent' in observer.get('closure', {}):
              raise SystemExit('Input-plan evidence must not claim adoption or disposable-clone absence')
          status = observer.get('status')
          if status not in ('observed', 'failed', 'INCONCLUSIVE') or measured.get('status') != status:
              raise SystemExit('Observer and measurement statuses are invalid or inconsistent')
          source = observer.get('source')
          def valid_source(value):
              if type(value) is not dict or set(value) != {'head_sha', 'source_tree_sha256', 'tree_status_sha256', 'file_count', 'file_manifest'}:
                  return False
              if value.get('head_sha') != os.environ.get('GITHUB_SHA'):
                  return False
              count, manifest = value.get('file_count'), value.get('file_manifest')
              if type(count) is not int or count <= 0 or type(manifest) is not list or len(manifest) != count:
                  return False
              paths, pairs = [], []
              for entry in manifest:
                  if type(entry) is not dict or set(entry) != {'path', 'sha256'} or type(entry.get('path')) is not str \
                      or type(entry.get('sha256')) is not str or len(entry['sha256']) != 71 \
                      or not entry['sha256'].startswith('sha256:') \
                      or any(ch not in '0123456789abcdef' for ch in entry['sha256'][7:]):
                      return False
                  paths.append(entry['path']); pairs.append([entry['path'], entry['sha256']])
              if paths != sorted(set(paths)):
                  return False
              tree = 'sha256:' + hashlib.sha256(json.dumps(pairs, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
              empty_status = 'sha256:' + hashlib.sha256(b'').hexdigest()
              return value.get('source_tree_sha256') == tree and value.get('tree_status_sha256') == empty_status
          if type(source) is not dict or not all(valid_source(source.get(key)) for key in ('expected_git', 'before', 'after')) \
              or source['before'] != source['expected_git'] or source['after'] != source['expected_git']:
              raise SystemExit('Full expected Git and before/after source manifests must match exactly')
          if status != 'observed' or not profile_succeeded or not cleanup_succeeded:
              raise SystemExit('The original input-plan observation did not complete with owned-lab cleanup')
          gates = observer.get('gates')
          expected_gates = {'original_query', 'parent_and_nested', 'rr_identity', 'controls_closed',
              'source_binding', 'factory_closed', 'recording_complete'}
          if type(gates) is not dict or set(gates) != expected_gates or any(type(v) is not bool or v is not True for v in gates.values()):
              raise SystemExit('All seven input-plan observation gates must be explicitly true')
          observation = observer.get('observation')
          if type(observation) is not dict or observation.get('status') != 'observed' \
              or type(observation.get('ordinal_seen')) is not int or observation['ordinal_seen'] < 65 \
              or observation.get('selected_count') != 1 \
              or observation.get('original_executions') != 1 or observation.get('original_succeeded') is not True \
              or observation.get('result_reference_preserved') is not True or observation.get('query_raw_match') is not True \
              or observation.get('bind_count') != 9 or type(observation.get('root_argument_count')) is not int \
              or observation['root_argument_count'] <= 0 or type(observation.get('returned_rows')) is not int \
              or observation['returned_rows'] < 0 or observation.get('rr_read_only') is not True \
              or observation.get('context_stable') is not True or observation.get('settings_restored') is not True \
              or observation.get('loss') is not False or observation.get('parent_present') is not True \
              or observation.get('nested_present') is not True or observation.get('library_loaded') is not True \
              or observation.get('library_unloaded') is not False:
              raise SystemExit('The original read, RR context, plan parent/nested capture, or controls are incomplete')
          closure = observer.get('closure')
          required_closure = {'callback_entered': True, 'callback_complete': True, 'factory_returned_normally': True,
              'observed_backends_absent': True, 'admin_closed': True, 'database_identity_matched': True,
              'active_borrowed': 0, 'release_failures': 0}
          if type(closure) is not dict or any(type(closure.get(key)) is not type(expected) or closure.get(key) != expected
                                             for key, expected in required_closure.items()) \
              or type(closure.get('observed_backends')) is not int or closure['observed_backends'] <= 0:
              raise SystemExit('Accredited CI database/backend post-check and closure are incomplete')
          storage = observer.get('storage')
          if type(storage) is not dict or storage != {'storage_owned': True, 'storage_closed': True, 'storage_absent': True}:
              raise SystemExit('Input-plan synthetic storage ownership or cleanup is incomplete')
          plans = observation.get('plans')
          if type(plans) is not list or not 2 <= len(plans) <= 128 \
              or not any(type(p) is dict and p.get('query_template_sha256') == 'sha256:b4e38b2486fca6e4025b361b9c47ba4ad79edd91294b2554ff8b93edd3ba2150' for p in plans) \
              or not any(type(p) is dict and p.get('query_template_sha256') != 'sha256:b4e38b2486fca6e4025b361b9c47ba4ad79edd91294b2554ff8b93edd3ba2150' for p in plans):
              raise SystemExit('Input-plan parent and nested query templates were not both observed')
          for item in plans:
              if type(item) is not dict or item.get('variants') != 'NOT_COLLECTED' \
                  or type(item.get('occurrences')) is not int or item['occurrences'] <= 0:
                  raise SystemExit('Deduplicated plan occurrence metadata is malformed')
              first = item.get('first')
              if type(first) is not dict or type(first.get('plan')) is not dict or type(first.get('nodes')) is not int \
                  or not 1 <= first['nodes'] <= 512 or type(first.get('bytes')) is not int or not 1 <= first['bytes'] <= 4 * 1024 * 1024:
                  raise SystemExit('Sanitized plan exceeds the closed node or byte bounds')
          measurement = measured.get('measurement')
          if type(measurement) is not dict or measurement.get('roots') != 32768 or measurement.get('requests') != 65536 \
              or measurement.get('unresolved_roots') != 0:
              raise SystemExit('The original synthetic population and request census are incomplete')
          capacity = measurement.get('unmodified_driver_capacity_gates_not_acceptance')
          if type(capacity) is not dict or any(capacity.get(key) is not True for key in ('native_processing_complete', 'serving', 'expected_primary_request_count')):
              raise SystemExit('Original native processing, serving, or request-count verification is incomplete')
          print('Input-plan diagnostic: seven observation gates, full source binding and workload completion verified; findings remain INCONCLUSIVE')
          PY
      - name: Upload native input-plan observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-input-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            input-plan-observer.tap
            .data/piloto-masivo/r16/input-plan-native-evidence/input-plan-observer.json
            .data/piloto-masivo/r16/input-plan-native-evidence/input-plan-measurement.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  listening-native-dml-plan-diagnostic:
    name: R16 Native DML plan diagnostic (isolated lab)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || (inputs.scope == 'native-dml-plan-only' && github.ref == 'refs/heads/codex/r16-native-dml-profile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
      R16_NATIVE_DML_PLAN_EVIDENCE_DIR: .data/piloto-masivo/r16/native-dml-plan-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Node workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck database package before fixture setup
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @noisia/db typecheck
      - name: Typecheck workers package before fixture setup
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @noisia/workers typecheck
      - name: Require the owned benchmark lab and evidence path to be absent
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named R16 benchmark PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named R16 benchmark PostgreSQL volume already exists'
            exit 1
          fi
          remaining_containers="$(docker ps -aq --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          remaining_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          if [[ -n "$remaining_containers" || -n "$remaining_volumes" ]]; then
            echo '::error::An R16 benchmark PostgreSQL or Redis lab resource already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          evidence_dir=.data/piloto-masivo/r16/native-dml-plan-evidence
          archive_file=.data/piloto-masivo/r16/native-dml-plan-evidence.zip
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" || -e "$evidence_dir" || -e "$archive_file" ]]; then
            echo '::error::Private files for the named R16 benchmark lab or DML-plan evidence already exist'
            exit 1
          fi
      - name: Initialize private native DML-plan TAP receipt
        run: |
          set -euo pipefail
          evidence_dir=.data/piloto-masivo/r16/native-dml-plan-evidence
          mkdir -m 700 -p "$evidence_dir"
          (umask 077; printf '%s\n' '# native Listening DML-plan diagnostic did not start' > "$evidence_dir/native-dml-plan.tap")
          chmod 600 "$evidence_dir/native-dml-plan.tap"
      - name: Capture workflow and clean-source control before the diagnostic
        run: |
          set -euo pipefail
          workflow_sha="$(shasum -a 256 .github/workflows/mfp-postgres.yml | awk '{print $1}')"
          status_sha="$(git status --porcelain=v1 -z | shasum -a 256 | awk '{print $1}')"
          printf 'R16_NATIVE_DML_WORKFLOW_SHA_BEFORE=%s\n' "$workflow_sha" >> "$GITHUB_ENV"
          printf 'R16_NATIVE_DML_STATUS_SHA_BEFORE=%s\n' "$status_sha" >> "$GITHUB_ENV"
      - name: Start the owned official PostgreSQL 17 and Redis lab
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_NATIVE_DML_PLAN_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh native DML-plan lab
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          pnpm --filter @noisia/db db:smoke:migrations
      - name: Run native INSERT, MARK, and APPLY plans against real guards
        id: profile
        env:
          NOISIA_R16_NATIVE_DML_PLAN_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --max-old-space-size=1024 --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-native-dml-plan.postgres.test.ts \
            2>&1 | tee .data/piloto-masivo/r16/native-dml-plan-evidence/native-dml-plan.tap
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]] \
            || ! grep -qx '# tests 1' .data/piloto-masivo/r16/native-dml-plan-evidence/native-dml-plan.tap \
            || ! grep -qx '# pass 1' .data/piloto-masivo/r16/native-dml-plan-evidence/native-dml-plan.tap \
            || ! grep -qx '# fail 0' .data/piloto-masivo/r16/native-dml-plan-evidence/native-dml-plan.tap \
            || ! grep -qx '# cancelled 0' .data/piloto-masivo/r16/native-dml-plan-evidence/native-dml-plan.tap \
            || ! grep -qx '# skipped 0' .data/piloto-masivo/r16/native-dml-plan-evidence/native-dml-plan.tap \
            || ! grep -qx '# Subtest: native Listening32768 INSERT MARK APPLY plans preserve real guards in base and consumer cohorts' .data/piloto-masivo/r16/native-dml-plan-evidence/native-dml-plan.tap; then
            echo '::error::The native DML-plan diagnostic failed, was skipped, or did not execute exactly once'
            exit 1
          fi
      - name: Stop and remove only the owned benchmark lab
        id: cleanup
        if: ${{ always() && env.R16_NATIVE_DML_PLAN_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 benchmark PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 benchmark PostgreSQL volume survived cleanup'
            exit 1
          fi
          remaining_containers="$(docker ps -aq --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          remaining_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          if [[ -n "$remaining_containers" || -n "$remaining_volumes" ]]; then
            echo '::error::An owned R16 benchmark PostgreSQL or Redis resource survived cleanup'
            exit 1
          fi
      - name: Validate and package bounded native DML-plan evidence
        id: evidence
        if: always()
        env:
          PROFILE_CONCLUSION: ${{ steps.profile.conclusion }}
          CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, stat, subprocess, zipfile
          from pathlib import Path

          root=Path(os.environ['GITHUB_WORKSPACE'])
          evidence=root / os.environ['R16_NATIVE_DML_PLAN_EVIDENCE_DIR']
          tap=evidence / 'native-dml-plan.tap'
          archive=root / '.data/piloto-masivo/r16/native-dml-plan-evidence.zip'
          plan_names=[f'plan-{phase}-{op}.json' for phase in ('base','consumer') for op in ('insert','mark','apply')]
          manifest_name='native-dml-plans.json';control_name='workflow-control.json'
          max_plan=4*1024*1024;max_manifest=1024*1024;max_control=16*1024;max_tap=1024*1024;max_nested=4*1024*1024;max_expanded=32*1024*1024;max_zip=16*1024*1024-65536
          profile_ok=os.environ.get('PROFILE_CONCLUSION')=='success';cleanup_ok=os.environ.get('CLEANUP_CONCLUSION')=='success'
          actual_workflow=hashlib.sha256((root/'.github/workflows/mfp-postgres.yml').read_bytes()).hexdigest()
          status=subprocess.run(['git','status','--porcelain=v1','-z'],cwd=root,stdout=subprocess.PIPE,check=True).stdout
          status_after=hashlib.sha256(status).hexdigest()
          before_workflow=os.environ.get('R16_NATIVE_DML_WORKFLOW_SHA_BEFORE','')
          before_status=os.environ.get('R16_NATIVE_DML_STATUS_SHA_BEFORE','')
          control={'contract':'r16-native-dml-plan-workflow-control-v1','github':{'GITHUB_SHA':os.environ.get('GITHUB_SHA'),
            'GITHUB_REF':os.environ.get('GITHUB_REF'),'GITHUB_EVENT_NAME':os.environ.get('GITHUB_EVENT_NAME'),
            'GITHUB_RUN_ID':os.environ.get('GITHUB_RUN_ID'),'GITHUB_RUN_ATTEMPT':os.environ.get('GITHUB_RUN_ATTEMPT')},
            'GITHUB_WORKFLOW_SHA':{'path':'.github/workflows/mfp-postgres.yml','sha256_before':before_workflow,'sha256_after':actual_workflow},
            'git_status':{'sha256_before':before_status,'sha256_after':status_after,'clean_before':before_status==hashlib.sha256(b'').hexdigest(),
              'clean_after':status_after==hashlib.sha256(b'').hexdigest()},
            'source_provenance_note':'The independently derived full runtime source binding excludes mfp-postgres.yml; this separate receipt binds the actual workflow bytes and event/ref.'}
          if not evidence.exists(): evidence.mkdir(parents=True,mode=0o700)
          if evidence.is_symlink() or not evidence.is_dir(): raise SystemExit('native DML-plan evidence path is unsafe')
          if stat.S_IMODE(evidence.stat().st_mode)!=0o700: raise SystemExit('native DML-plan evidence directory must be private mode 0700')
          control_path=evidence/control_name
          raw_control=(json.dumps(control,sort_keys=True,separators=(',',':'))+'\n').encode()
          fd=os.open(control_path,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)
          try: os.write(fd,raw_control);os.fsync(fd)
          finally: os.close(fd)
          nested_name='native-dml-nested-plans.json'
          allow=set(plan_names+[manifest_name,control_name,nested_name,'native-dml-plan.tap']);available=[]
          for path in evidence.iterdir():
            if path.name not in allow or path.is_symlink() or not path.is_file(): raise SystemExit('native DML-plan evidence contains unsafe/unexpected entry')
            cap=max_manifest if path.name==manifest_name else max_control if path.name==control_name else max_tap if path.name=='native-dml-plan.tap' else max_nested if path.name==nested_name else max_plan
            if path.stat().st_size<=0 or path.stat().st_size>cap or stat.S_IMODE(path.stat().st_mode)!=0o600:
              raise SystemExit('native DML-plan JSON is empty, over cap, or not mode 0600')
            available.append(path)
          if len(raw_control)>max_control: raise SystemExit('workflow-control JSON exceeds 16 KiB')
          expanded=sum(p.stat().st_size for p in available)
          if expanded>max_expanded: raise SystemExit('native DML-plan expanded evidence exceeds 32 MiB')
          if archive.exists(): raise SystemExit('native DML-plan ZIP already exists')
          archive_fd=os.open(archive,os.O_CREAT|os.O_EXCL|os.O_RDWR,0o600)
          with os.fdopen(archive_fd,'w+b') as archive_file:
            with zipfile.ZipFile(archive_file,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for path in sorted(available,key=lambda p:p.name): z.write(path,arcname=path.name)
            archive_file.flush();os.fsync(archive_file.fileno())
          if stat.S_IMODE(archive.stat().st_mode)!=0o600: raise SystemExit('native DML-plan ZIP must be private mode 0600')
          if archive.stat().st_size>max_zip: raise SystemExit('native DML-plan ZIP exceeds conservative 16 MiB artifact bound')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output: output.write('artifact_eligible=true\n')
          manifest_path=evidence/manifest_name
          if not manifest_path.is_file(): raise SystemExit('native DML-plan manifest is missing')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          if type(manifest) is not dict or manifest.get('contract')!='r16-listening-native-dml-plan-v1':
            raise SystemExit('native DML-plan receipt contract is invalid')
          if profile_ok:
            title='native Listening32768 INSERT MARK APPLY plans preserve real guards in base and consumer cohorts'
            for key,value in {'status':'observed','diagnostic_only':True,'h1_accepted':False,'cpu':'UNKNOWN',
              'external_provider_requests':0,'external_provider_spend_micro_usd':0}.items():
              if type(manifest.get(key)) is not type(value) or manifest.get(key)!=value: raise SystemExit('native DML-plan metadata is invalid')
            if len(available)!=10 or {p.name for p in available}!={manifest_name,control_name,nested_name,'native-dml-plan.tap',*plan_names}:
              raise SystemExit('successful Native DML receipt must contain manifest, control, TAP, six plans, and nested plans')
            source=manifest.get('source');expected=source.get('expected_git') if type(source) is dict else None
            if type(source) is not dict or type(expected) is not dict or source.get('before')!=expected or source.get('after')!=expected or expected.get('head_sha')!=os.environ.get('GITHUB_SHA'):
              raise SystemExit('native DML source binding must be actual clean Git source before and after')
            workflow=source.get('workflow')
            if type(workflow) is not dict or workflow.get('path')!='.github/workflows/mfp-postgres.yml' or workflow.get('sha256')!=actual_workflow:
              raise SystemExit('test source workflow binding differs from actual workflow bytes')
            if before_workflow!=actual_workflow or before_status!=hashlib.sha256(b'').hexdigest() or status_after!=hashlib.sha256(b'').hexdigest():
              raise SystemExit('workflow or Git source changed during the diagnostic')
            witness=manifest.get('runtime_witness');groups=('main_money','compact','answer_guard')
            if type(witness) is not dict or witness.get('contract')!='r16-listening-runtime-witness-v1' or witness.get('before') is None or witness.get('after') is None or any(type(witness.get(g)) is not dict or witness[g].get('before') is None or witness[g].get('after') is None for g in groups):
              raise SystemExit('all four MAIN runtime witness groups must have before/after receipts')
            if witness['before']!=witness['after'] or any(witness[g]['before']!=witness[g]['after'] for g in groups):
              raise SystemExit('MAIN runtime witness values changed across diagnostic')
            triggers=manifest.get('answer_triggers')
            if type(triggers) is not dict or triggers.get('before') is None or triggers.get('after')!=triggers.get('before'):
              raise SystemExit('answer trigger witness changed across diagnostic')
            if manifest.get('connection_uncertainty')!=[]:
              raise SystemExit('successful native DML receipt must contain no connection uncertainty')
            fixture=manifest.get('fixture');expected_fixture={'population':32768,'bootstrap_calls':64,'native_calls':1440,'total_calls':1504,'resolved_roots':752,'unresolved_roots':32016}
            if type(fixture) is not dict or any(fixture.get(k)!=v for k,v in expected_fixture.items()): raise SystemExit('fixture census is invalid')
            phases=fixture.get('phases')
            if type(phases) is not list or [x.get('phase') for x in phases if type(x) is dict]!=['base','consumer'] or any(type(x) is not dict or x.get('bootstrap_calls')!=32 or x.get('native_calls')!=720 for x in phases):
              raise SystemExit('base/consumer phase census is invalid')
            phase_rosters={}
            for phase_receipt in phases:
              digest=phase_receipt.get('native_call_ids_sha256')
              if not re.fullmatch(r'[0-9a-f]{64}',str(digest)): raise SystemExit('actual returned native call roster digest is missing')
              phase_rosters[phase_receipt['phase']]=digest
            plans=manifest.get('plans');expected_rows=[(phase,op) for phase in ('base','consumer') for op in ('insert','mark','apply')]
            if type(plans) is not list or len(plans)!=6 or [(p.get('phase'),p.get('operation')) for p in plans if type(p) is dict]!=expected_rows:
              raise SystemExit('six-plan phase/operation matrix is invalid')
            count_keys={'calls','links','answers','failures','raw_pages','raw_members','mutation_fences','run','admission'}
            true_keys=('savepoint_ack','rollback_sent','rollback_ack','release_ack','snapshot_equal','normal_original_sent','normal_original_succeeded')
            for row in plans:
              phase,op=row['phase'],row['operation'];name=f'plan-{phase}-{op}.json';plan=evidence/name
              if row.get('file')!=name or row.get('calls')!=720 or row.get('answers')!=(1440 if op=='apply' else None): raise SystemExit('plan call/answer census is invalid')
              expected_roster=phase_rosters[phase] if op=='apply' else None
              if row.get('apply_roster_sha256')!=expected_roster: raise SystemExit('APPLY roster digest differs from returned Native call IDs')
              if any(row.get(k) is not True for k in true_keys) or row.get('unknown_ack') is not False: raise SystemExit('plan rollback/normal-commit acknowledgements are invalid')
              if not re.fullmatch(r'[0-9a-f]{64}',str(row.get('plan_sha256'))) or row.get('plan_bytes')!=plan.stat().st_size or hashlib.sha256(plan.read_bytes()).hexdigest()!=row.get('plan_sha256'):
                raise SystemExit('plan file bytes/SHA differ from receipt')
              for k in ('query_raw_sha256','query_normalized_sha256','snapshot_before_sha256','snapshot_after_sha256'):
                if not re.fullmatch(r'[0-9a-f]{64}',str(row.get(k))): raise SystemExit('plan observation digest is malformed')
              if row.get('snapshot_before_sha256')!=row.get('snapshot_after_sha256') or type(row.get('snapshot_counts')) is not dict or set(row['snapshot_counts'])!=count_keys:
                raise SystemExit('full transactional snapshot did not restore exactly')
            nested_path=evidence/nested_name
            raw_nested=nested_path.read_bytes()
            nested=json.loads(raw_nested.decode('utf-8'))
            nested_contract='r16-native-dml-nested-plans-v2'
            nested_keys=['contract','status','diagnostic_only','h1_accepted','cpu','baseline_head','source_binding_digest','limits','preflight_receipt','probes','failure','limitations']
            limits={'event_bytes':1024*1024,'sample_bytes':256*1024,'retained_bytes':3*1024*1024,'file_bytes':4*1024*1024,
              'unique_types':512,'context_bytes':8*1024,'depth':128,'nodes':16384,'preflight_sample_bytes':16*1024}
            if type(nested) is not dict or set(nested.keys())!=set(nested_keys):
              raise SystemExit('nested DML receipt has an invalid top-level shape or key order')
            fixed={'contract':nested_contract,'status':'observed','diagnostic_only':True,'h1_accepted':False,'cpu':'UNKNOWN',
              'baseline_head':'b34a7e24073bf1f32420a9c97736700fd74b7c71'}
            if any(type(nested.get(k)) is not type(v) or nested.get(k)!=v for k,v in fixed.items()):
              raise SystemExit('nested DML receipt metadata is invalid or not diagnostic-only')
            if nested.get('failure') is not None or nested.get('limits')!=limits:
              raise SystemExit('successful nested DML receipt has failure or changed limits')
            source_digest=expected.get('source_tree_sha256')
            if not re.fullmatch(r'sha256:[0-9a-f]{64}',str(source_digest)) or nested.get('source_binding_digest')!=source_digest:
              raise SystemExit('nested DML source binding differs from the original native source tree')
            descriptor=manifest.get('nested')
            if type(descriptor) is not dict or set(descriptor)!={'file','bytes','sha256'}:
              raise SystemExit('native manifest nested descriptor is missing or malformed')
            if descriptor.get('file')!=nested_name or descriptor.get('bytes')!=len(raw_nested) or not re.fullmatch(r'[0-9a-f]{64}',str(descriptor.get('sha256'))) or hashlib.sha256(raw_nested).hexdigest()!=descriptor.get('sha256'):
              raise SystemExit('native manifest nested bytes/SHA do not match the private nested receipt')
            if len(raw_nested)>max_nested:
              raise SystemExit('nested DML receipt exceeds 4 MiB')
            settings_keys=['auto_explain.log_min_duration','auto_explain.log_nested_statements','auto_explain.log_format',
              'auto_explain.log_level','auto_explain.log_analyze','auto_explain.log_buffers','auto_explain.log_timing',
              'auto_explain.log_parameter_max_length','auto_explain.sample_rate','client_min_messages']
