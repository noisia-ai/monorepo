name: MFP PostgreSQL

on:
  pull_request:
    branches: [develop, feat/mfp-ws1-pg-ci]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: mfp-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numeric-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: noisia_mfp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d noisia_mfp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noisia_mfp_ci
      DATABASE_SSL: 'false'
      NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
      NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
      NOISIA_MFP_PG_CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/workers/requirements-workspace-engine.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Node workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated CPU BERTopic runtime and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r services/workers/requirements-workspace-engine.txt
          python -m pip install pytest==8.3.5
      - name: Run real BERTopic numerical regression loops without model downloads or providers
        env:
          PYTHONPATH: tools/signal-semantic-lab/src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          NUMBA_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -o pipefail
          python -m pytest -q -ra tools/signal-semantic-lab/tests/test_workspace_engine.py tools/signal-semantic-lab/tests/test_workspace_incremental_engine.py | tee r16-numeric-python.tap
          if grep -Eq '[1-9][0-9]* skipped' r16-numeric-python.tap; then
            echo '::error::R16 numerical Python tests were skipped'
            exit 1
          fi
      - name: Run Node-to-Python cached-source spool integration
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          NUMBA_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          export NOISIA_WORKSPACE_ENGINE_TEST_PYTHON="$(command -v python)"
          set -o pipefail
          pnpm exec node --test --test-concurrency=1 --import tsx \
            services/workers/src/workers/signal-listening-orphan-regroup.test.ts | tee r16-orphan-regroup.tap
          if ! grep -qx '# skipped 0' r16-orphan-regroup.tap; then
            echo '::error::R16 orphan regroup integration skipped Python-backed tests'
            exit 1
          fi
      - name: Run initial listening through native PostgreSQL and the cached-vector numerical runtime
        env:
          NOISIA_R16_DISCOVERY_INITIAL_NUMERIC_PG: 'true'
          NOISIA_WORKSPACE_ENGINE_MODULE_ROOT: ${{ github.workspace }}/tools/signal-semantic-lab/src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          NUMBA_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          export NOISIA_WORKSPACE_ENGINE_PYTHON="$(command -v python)"
          pnpm --filter @noisia/db db:smoke:migrations
          set -o pipefail
          pnpm exec node --test --test-concurrency=1 --import tsx \
            services/workers/src/workers/signal-listening-discovery-initial-numeric.postgres.test.ts | tee r16-initial-numeric-pg.tap
          if ! grep -qx '# skipped 0' r16-initial-numeric-pg.tap; then
            echo '::error::R16 native initial numerical flow was skipped'
            exit 1
          fi

      - name: Verify bounded Study source custody at the real-cut scale
        env:
          NOISIA_R16_STUDY_SOURCE_SCALE: 'true'
        run: |
          set -o pipefail
          pnpm exec node --max-old-space-size=256 --test --test-concurrency=1 --import tsx \
            services/workers/src/workers/signal-study-source-pages.test.ts | tee r16-study-source-scale.tap
          if ! grep -qx '# skipped 0' r16-study-source-scale.tap; then
            echo '::error::R16 source scale cases were skipped'
            exit 1
          fi
      - name: Run native Study pipeline, frozen human bindings and registered worker
        env:
          NOISIA_R16_STUDY_PG: 'true'
          NOISIA_R16_STUDY_SOURCE_PAGED_PG: 'true'
          NOISIA_R16_NATIVE_AUDIT_EXPORT_PG: 'true'
          NOISIA_R16_STUDY_WORKER_PG: 'true'
          NOISIA_R16_HUMAN_EDITS_PG: 'true'
          NOISIA_R16_LISTENING_CENSUS_PG: 'true'
          R16BENCH_REDIS_URL: redis://127.0.0.1:6379/0
          NOISIA_WORKSPACE_ENGINE_MODULE_ROOT: ${{ github.workspace }}/tools/signal-semantic-lab/src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          NUMBA_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          export NOISIA_WORKSPACE_ENGINE_PYTHON="$(command -v python)"
          set -o pipefail
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-human-edits.postgres.test.ts \
            infrastructure/db/migrations/signal-study.postgres.test.ts \
            infrastructure/db/migrations/signal-study-editorial-replay.postgres.test.ts \
            infrastructure/db/migrations/signal-study-author-privacy.postgres.test.ts \
            infrastructure/db/migrations/signal-study-source-paged.postgres.test.ts \
            infrastructure/db/migrations/signal-study-effective-listening.postgres.test.ts \
            services/workers/src/workers/signal-study-worker.postgres.test.ts \
            scripts/r16/native-audit-export.postgres.test.ts \
            scripts/r16/listening-native-census.postgres.test.ts | tee r16-study-native-pg.tap
          if ! grep -qx '# skipped 0' r16-study-native-pg.tap; then
            echo '::error::R16 native Study or human binding tests were skipped'
            exit 1
          fi

  migrated-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: noisia_mfp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d noisia_mfp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noisia_mfp_ci
      DATABASE_SSL: 'false'
      NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
      NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
      NOISIA_MFP_PG_CI: 'true'
      NOISIA_MFP_POLICY_SUCCESSOR_PG_TEST: 'true'
      NOISIA_MFP_FOUNDER_ACCESS_PG_TEST: 'true'
      NOISIA_MFP_ADOPTED_SERVING_PG_TEST: 'true'
      NOISIA_MFP_POLICY_ACTION_SWITCH_PG_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply every numbered migration to disposable PostgreSQL 17
        run: pnpm --filter @noisia/db db:smoke:migrations
      - name: Run MFP integration tests on migrated schema
        run: |
          set -o pipefail
          shopt -s nullglob
          tests=(infrastructure/db/migrations/signal-mfp-*.integration.test.ts)
          if (( ${#tests[@]} == 0 )); then
            echo '::error::No MFP integration tests in this checkout'
            exit 1
          else
            pnpm exec node --test --test-concurrency=1 --import tsx "${tests[@]}" | tee mfp-pg-tests.tap
            if ! grep -qx '# skipped 0' mfp-pg-tests.tap; then
              echo '::error::MFP integration tests were skipped'
              exit 1
            fi
          fi
      - name: Run R16 listening contracts and runtime on real PostgreSQL
        env:
          NOISIA_R16_LISTENING_PG: 'true'
          NOISIA_R16_LISTENING_BOUNDED_PG: 'true'
          NOISIA_R16_LISTENING_CROSS_RUN_INDEX_PG: 'true'
          NOISIA_R16_LISTENING_POPULATION_PG: 'true'
          NOISIA_R16_LISTENING_POPULATION_PLANS_PG: 'true'
          NOISIA_R16_LISTENING_LEXICAL_PLAN_PG: 'true'
          NOISIA_R16_LISTENING_REVISION_PLAN_PG: 'true'
          NOISIA_R16_LISTENING_METRICS_BATCH_PG: 'true'
          NOISIA_R16_LISTENING_MONEY_BATCHES_PG: 'true'
          NOISIA_R16_LISTENING_PROTOTYPES_PG: 'true'
          NOISIA_R16_LISTENING_RUNTIME_PG: 'true'
          NOISIA_R16_LISTENING_RECOVERY_PG: 'true'
          NOISIA_R16_LISTENING_LEXICON_PG: 'true'
          NOISIA_R16_LISTENING_DISCOVERY_PG: 'true'
          NOISIA_R16_INPUT_BOUNDS_PG: 'true'
          NOISIA_R16_LISTENING_DISCOVERY_MONEY_PG: 'true'
          NOISIA_R16_DISCOVERY_HARDENING_PG: 'true'
          NOISIA_R16_DISCOVERY_ADVANCE_PG: 'true'
          NOISIA_R16_DISCOVERY_AUTOMATION_PG: 'true'
          NOISIA_R16_DISCOVERY_INITIAL_PG: 'true'
        run: |
          set -o pipefail
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-bounded.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-cross-run-index.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-population-batches.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-population-plans.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-population-lexical-plan.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-human-revision-plan.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-question-metrics-batch.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-money-batches.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-prototypes.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-lexicon.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-input-bounds.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-discovery.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-discovery-money.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-discovery-hardening.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-discovery-advance.postgres.test.ts \
            infrastructure/db/migrations/signal-listening-discovery-initial.postgres.test.ts \
            services/workers/src/workers/signal-listening-discovery-automation.postgres.test.ts \
            services/workers/src/workers/signal-listening-runtime.postgres.test.ts \
            services/workers/src/workers/signal-listening-recovery.postgres.test.ts | tee r16-listening-pg-tests.tap
          if ! grep -qx '# skipped 0' r16-listening-pg-tests.tap; then
            echo '::error::R16 listening PostgreSQL tests were skipped'
            exit 1
          fi
      - name: Run MFP PostgreSQL checks on migrated schema
        run: |
          shopt -s nullglob
          checks=(scripts/dev-corpus/*-postgres-check.ts)
          if (( ${#checks[@]} < 3 )); then
            echo '::error::Expected at least the critical, ledger and receipt PostgreSQL checks'
            exit 1
          fi
          for check in "${checks[@]}"; do
            pnpm exec node --import tsx "$check"
          done
