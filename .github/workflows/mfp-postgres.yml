          : > "$R16_PROJECTION_LINEAR_TAP"
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --test --test-concurrency=1 \
            --test-name-pattern='^(?:projection linear joins native preserves256keys, Unicode microseconds, byte sentinels, reservations and rights|projection linear joins native preserves awaiting/excluded, H5 precedence and a global byte prefix across pages|projection linear joins native4096 paired RRRO preserves rows and removes both materialized CTE rescans)$' \
            --import tsx infrastructure/db/migrations/signal-listening-projection-linear-joins.postgres.test.ts | tee "$R16_PROJECTION_LINEAR_TAP"
          test_status=${PIPESTATUS[0]}
          set -e
          node - "$R16_PROJECTION_LINEAR_TAP" "$test_status" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const status = Number(process.argv[3]);
          const expected = [
            'projection linear joins native preserves256keys, Unicode microseconds, byte sentinels, reservations and rights',
            'projection linear joins native preserves awaiting/excluded, H5 precedence and a global byte prefix across pages',
            'projection linear joins native4096 paired RRRO preserves rows and removes both materialized CTE rescans',
          ];
          const lines = tap.split(/\r?\n/u);
          const selected = expected.map(title => lines.filter(line => /^ok \d+ - /u.test(line) && line.endsWith(` - ${title}`)));
          if (status !== 0 || selected.some(rows => rows.length !== 1)
              || !/^# tests 3$/mu.test(tap) || !/^# pass 3$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('projection linear-joins TAP must report three exact selected titles, pass=3, fail=0, skipped=0');
          }
          process.stdout.write('projection linear-joins oracle: 3 exact selected cases passed\n');
          NODE
      - name: Ensure projection linear-joins TAP receipt exists
        if: always()
        env:
          R16_PROJECTION_LINEAR_TAP: ${{ runner.temp }}/r16-projection-linear-joins.tap
        run: |
          if [ ! -f "$R16_PROJECTION_LINEAR_TAP" ]; then
            printf '%s\n' 'projection linear-joins oracle gate was not reached' > "$R16_PROJECTION_LINEAR_TAP"
          fi
      - name: Verify projection linear-joins source remained unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R16_PROJECTION_LINEAR_SOURCE_SHA"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::projection linear-joins oracle changed the checked out source tree'
            exit 1
          fi
      - name: Upload projection linear-joins TAP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-projection-linear-joins-${{ github.run_id }}
          path: ${{ runner.temp }}/r16-projection-linear-joins.tap
          if-no-files-found: error
          retention-days: 14
      - name: Stop and remove only the owned projection linear-joins lab
        if: ${{ always() && env.R16_PROJECTION_LINEAR_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 projection linear-joins PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 projection linear-joins PostgreSQL volume survived cleanup'
            exit 1
          fi

  statement-shared-wire:
    name: R16 statement shared-wire acceptance (fresh isolated lab)
    needs: projection-linear-joins
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'listening-smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      selected_pass: ${{ steps.oracle.outputs.selected_pass || steps.noop.outputs.selected_pass || '0' }}
      source_sha: ${{ steps.seal.outputs.source_sha || '' }}
      source_kind: ${{ steps.seal.outputs.source_kind || 'none' }}
      default_runtime_kind: ${{ steps.oracle.outputs.default_runtime_kind || '' }}
      default_receipt_count: ${{ steps.oracle.outputs.default_receipt_count || '0' }}
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Seal the checked out source revision
        id: seal
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::statement shared-wire source checkout is not clean'
            exit 1
          fi
          for name in $(compgen -e); do
            case "$name" in
              *ANTHROPIC*API_KEY*|*ANTHROPIC*TOKEN*|*SONNET*API_KEY*|*SONNET*TOKEN*|*VOYAGE*API_KEY*|*VOYAGE*TOKEN*)
                echo '::error::provider credentials are forbidden in statement shared-wire acceptance'
                exit 1
                ;;
            esac
          done
          printf 'R16_STATEMENT_SHARED_WIRE_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          shared_wire_base_files=(
            infrastructure/db/migrations/0330_signal_listening_statement_shared_wire.sql
            infrastructure/db/migrations/signal-listening-statement-shared-wire.oracle.ts
            infrastructure/db/migrations/signal-listening-statement-shared-wire.fixture.ts
            infrastructure/db/migrations/signal-listening-statement-shared-wire.postgres.test.ts
            infrastructure/db/migrations/signal-listening-statement-shared-wire.test.ts
          )
          shared_wire_present=0
          for source_file in "${shared_wire_base_files[@]}"; do
            if [ -f "$source_file" ]; then
              shared_wire_present=$((shared_wire_present + 1))
            fi
          done
          payload_migration=infrastructure/db/migrations/0331_signal_listening_statement_payload.sql
          payload_present=false
          if [ -f "$payload_migration" ]; then payload_present=true; fi
          if [ "$shared_wire_present" -eq 0 ] && [ "$payload_present" = false ]; then
            printf 'source_present=false\n' >> "$GITHUB_OUTPUT"
            printf 'source_kind=none\n' >> "$GITHUB_OUTPUT"
          elif [ "$shared_wire_present" -eq "${#shared_wire_base_files[@]}" ] && [ "$payload_present" = false ]; then
            printf 'source_present=true\n' >> "$GITHUB_OUTPUT"
            printf 'source_kind=legacy-five\n' >> "$GITHUB_OUTPUT"
          elif [ "$shared_wire_present" -eq "${#shared_wire_base_files[@]}" ] && [ "$payload_present" = true ]; then
            printf 'source_present=true\n' >> "$GITHUB_OUTPUT"
            printf 'source_kind=six\n' >> "$GITHUB_OUTPUT"
          else
            echo '::error::statement shared-wire base files and optional 0331 migration must be a complete five-file legacy set or all six current blobs'
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        if: ${{ steps.seal.outputs.source_present == 'true' }}
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        if: ${{ steps.seal.outputs.source_present == 'true' }}
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Node workspace dependencies
        if: ${{ steps.seal.outputs.source_present == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Require the owned statement shared-wire container and volume to be absent
        if: ${{ steps.seal.outputs.source_present == 'true' }}
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named R16 statement shared-wire PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named R16 statement shared-wire PostgreSQL volume already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" ]]; then
            echo '::error::Private files for the named R16 statement shared-wire lab already exist'
            exit 1
          fi
      - name: Start the named official PostgreSQL 17 and Redis lab
        if: ${{ steps.seal.outputs.source_present == 'true' }}
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_STATEMENT_SHARED_WIRE_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh statement shared-wire lab
        if: ${{ steps.seal.outputs.source_present == 'true' }}
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          pnpm --filter @noisia/db db:smoke:migrations
      - name: Run the exact statement shared-wire oracle cases
        id: oracle
        if: ${{ steps.seal.outputs.source_present == 'true' }}
        env:
          NOISIA_R16_STATEMENT_SHARED_WIRE_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
          R16_STATEMENT_SHARED_WIRE_TAP: ${{ runner.temp }}/r16-statement-shared-wire.tap
          R16_STATEMENT_SHARED_WIRE_SOURCE_KIND: ${{ steps.seal.outputs.source_kind || 'none' }}
        run: |
          set -euo pipefail
          : > "$R16_STATEMENT_SHARED_WIRE_TAP"
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --test --test-concurrency=1 \
            --test-name-pattern='^(?:0330 native same-snapshot validators preserve32shapes256keys UTF8 precision and mixed-wire fallback|0330 native reserve Mark bad-mixed rollback and deferred pre-owner forged hash stay enforced|0330 native real prior unknown is true and target ownership never becomes a cached authority|0330 preserves answer BEFORE attempts including conflict-suppressed bad tuples and native source bytes|0330 native DML ABBA keeps full guards and fresh transactions and rejects expiry with atomic rollback)$' \
            --import tsx infrastructure/db/migrations/signal-listening-statement-shared-wire.postgres.test.ts | tee "$R16_STATEMENT_SHARED_WIRE_TAP"
          test_status=${PIPESTATUS[0]}
          set -e
          node - "$R16_STATEMENT_SHARED_WIRE_TAP" "$test_status" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const status = Number(process.argv[3]);
          const expected = [
            '0330 native same-snapshot validators preserve32shapes256keys UTF8 precision and mixed-wire fallback',
            '0330 native reserve Mark bad-mixed rollback and deferred pre-owner forged hash stay enforced',
            '0330 native real prior unknown is true and target ownership never becomes a cached authority',
            '0330 preserves answer BEFORE attempts including conflict-suppressed bad tuples and native source bytes',
            '0330 native DML ABBA keeps full guards and fresh transactions and rejects expiry with atomic rollback',
          ];
          const lines = tap.split(/\r?\n/u);
          const selected = expected.map(title => lines.filter(line => /^ok \d+ - /u.test(line) && line.endsWith(` - ${title}`)));
          if (status !== 0 || selected.some(rows => rows.length !== 1)
              || !/^# tests 5$/mu.test(tap) || !/^# pass 5$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('statement shared-wire TAP must report five exact selected titles, pass=5, fail=0, skipped=0');
          }
          process.stdout.write('statement shared-wire oracle: 5 exact selected cases passed\n');
          NODE
          if [ "$R16_STATEMENT_SHARED_WIRE_SOURCE_KIND" = six ]; then
            node scripts/r16-diagnostics/listening-small/statement-default-contract.mjs verify-tap "$R16_STATEMENT_SHARED_WIRE_TAP" C
          fi
          printf 'selected_pass=5\n' >> "$GITHUB_OUTPUT"
      - name: Ensure statement shared-wire TAP receipt exists
        if: always()
        env:
          R16_STATEMENT_SHARED_WIRE_TAP: ${{ runner.temp }}/r16-statement-shared-wire.tap
        run: |
          if [ ! -f "$R16_STATEMENT_SHARED_WIRE_TAP" ]; then
            printf '%s\n' 'statement shared-wire oracle gate was not reached' > "$R16_STATEMENT_SHARED_WIRE_TAP"
          fi
      - name: Publish empty selection when the source lacks 0330
        id: noop
        if: ${{ always() && steps.seal.outputs.source_present == 'false' }}
        env:
          R16_STATEMENT_SHARED_WIRE_TAP: ${{ runner.temp }}/r16-statement-shared-wire.tap
        run: |
          printf 'selected_pass=0\n' >> "$GITHUB_OUTPUT"
          printf '%s\n' 'statement shared-wire source set is absent; no native cases selected' > "$R16_STATEMENT_SHARED_WIRE_TAP"
      - name: Verify statement shared-wire source remained unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R16_STATEMENT_SHARED_WIRE_SOURCE_SHA"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::statement shared-wire oracle changed the checked out source tree'
            exit 1
          fi
      - name: Upload statement shared-wire TAP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-statement-shared-wire-${{ github.run_id }}
          path: ${{ runner.temp }}/r16-statement-shared-wire.tap
          if-no-files-found: error
          retention-days: 14
      - name: Stop and remove only the owned statement shared-wire lab
        if: ${{ always() && env.R16_STATEMENT_SHARED_WIRE_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 statement shared-wire PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 statement shared-wire PostgreSQL volume survived cleanup'
            exit 1
          fi

  listening-startup-prefix-experimental:
    name: R16 Listening startup prefix diagnostic (isolated lab)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'listening-smoke' && inputs.listening_startup_prefix }}
    runs-on: ubuntu-latest
    # Match the harness soft caps in seconds: setup 1,800, prefix 120, total 1,920.
    # The 40-minute job timeout is an external hard watchdog, not a benchmark budget.
    timeout-minutes: 40
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
      R16_LISTENING_STARTUP_PREFIX_EVIDENCE_DIR: .data/piloto-masivo/r16/listening-startup-prefix-native-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Initialize an empty Listening startup prefix TAP receipt
        run: printf '%s\n' '# native Listening startup prefix did not start' > listening-startup-prefix.tap
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Node workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Require the owned startup prefix lab and private files to be absent
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named R16 startup prefix PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named R16 startup prefix PostgreSQL volume already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" ]]; then
            echo '::error::Private files for the named R16 startup prefix lab already exist'
            exit 1
          fi
      - name: Start the owned official PostgreSQL 17 and Redis lab
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_LISTENING_STARTUP_PREFIX_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh startup prefix lab
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          pnpm --filter @noisia/db db:smoke:migrations
      - name: Run the exact native Listening startup prefix profile
        id: profile
        env:
          NOISIA_R16_LISTENING_STARTUP_PREFIX_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
        run: |
          set -o pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-startup-prefix.postgres.test.ts \
            2>&1 | tee listening-startup-prefix.tap
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]] \
            || ! grep -qx '# tests 1' listening-startup-prefix.tap \
            || ! grep -qx '# pass 1' listening-startup-prefix.tap \
            || ! grep -qx '# fail 0' listening-startup-prefix.tap \
            || ! grep -qx '# cancelled 0' listening-startup-prefix.tap \
            || ! grep -qx '# skipped 0' listening-startup-prefix.tap \
            || ! grep -qx '# Subtest: native Listening startup prefix preserves admission and initial census without provider calls' listening-startup-prefix.tap; then
            echo '::error::The native Listening startup prefix profile failed, was skipped, or did not execute the exact test'
            exit 1
          fi
      - name: Stop and remove only the owned startup prefix lab
        id: cleanup
        if: ${{ always() && env.R16_LISTENING_STARTUP_PREFIX_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 startup prefix PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 startup prefix PostgreSQL volume survived cleanup'
            exit 1
          fi
      - name: Validate the native Listening startup prefix evidence
        if: always()
        env:
          PROFILE_CONCLUSION: ${{ steps.profile.conclusion }}
          CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['R16_LISTENING_STARTUP_PREFIX_EVIDENCE_DIR']) / 'listening-startup-prefix.json'
          if os.environ.get('PROFILE_CONCLUSION') != 'success' or os.environ.get('CLEANUP_CONCLUSION') != 'success':
              raise SystemExit('startup prefix evidence is not accepted unless the native test and owned-lab cleanup both pass')
          if not path.is_file() or path.stat().st_size <= 0 or path.stat().st_size > 2 * 1024 * 1024:
              raise SystemExit('Listening startup prefix JSON is missing, empty, or exceeds 2 MiB')
          with path.open(encoding='utf-8') as stream:
              value = json.load(stream)
          if type(value) is not dict:
              raise SystemExit('Listening startup prefix JSON must be a single object')
          expected = {
              'contract': 'r16-listening-startup-prefix-v1',
              'status': 'observed',
              'diagnostic_only': True,
              'h1_accepted': False,
              'cpu': 'UNKNOWN',
          }
          if any(value.get(key) != expected_value for key, expected_value in expected.items()):
              raise SystemExit('Listening startup prefix JSON does not match its diagnostic contract')
          gates = value.get('gates')
          required_gates = {
              'source_binding',
              'initial_census',
              'zero_provider_calls',
              'zero_listening_calls',
              'no_recording_loss',
              'cleanup_confirmed',
          }
          if type(gates) is not dict or set(gates) != required_gates or any(gates.get(key) is not True for key in required_gates):
              raise SystemExit('Listening startup prefix JSON must explicitly pass every registered evidence gate')
          PY
      - name: Upload Listening startup prefix diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-startup-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            listening-startup-prefix.tap
            .data/piloto-masivo/r16/listening-startup-prefix-native-evidence/listening-startup-prefix.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

