          remaining_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          if [[ -n "$remaining_containers" || -n "$remaining_volumes" ]]; then
            echo '::error::An R16 bounded population PostgreSQL or Redis lab resource already exists for this exact compose project'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          population_evidence=.data/piloto-masivo/r16/bounded-population-plan-native-evidence
          mentions_evidence=.data/piloto-masivo/r16/bounded-mentions-compare-native-evidence
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" ]] \
            || [[ '${{ inputs.bounded_population_plan }}' == 'true' && -e "$population_evidence" ]] \
            || [[ '${{ inputs.bounded_mentions_compare }}' == 'true' && -e "$mentions_evidence" ]]; then
            echo '::error::Private files for the named R16 bounded population lab already exist'
