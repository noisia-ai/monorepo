            || ! grep -qx '# pass 1' bounded-population-plan.tap \
            || ! grep -qx '# fail 0' bounded-population-plan.tap \
            || ! grep -qx '# cancelled 0' bounded-population-plan.tap \
            || ! grep -qx '# skipped 0' bounded-population-plan.tap \
            || ! grep -qx '# Subtest: native bounded population exposes provenance work for 1000 consumer roots in a 32768-root corpus' bounded-population-plan.tap; then
