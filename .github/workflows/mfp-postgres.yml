          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" ]]; then
            echo '::error::Private files for the named R16 roster lab already exist'
            exit 1
          fi
      - name: Start the owned official PostgreSQL 17 and Redis roster lab
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_ROSTER_QUERY_PLAN_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh roster query-plan lab
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          pnpm --filter @noisia/db db:smoke:migrations
      - name: Run the exact native facet roster query-plan profile
        id: profile
        env:
          NOISIA_R16_ROSTER_QUERY_PLAN_PG: 'true'
          NOISIA_R16_ROSTER_QUERY_PLAN_PURE: 'false'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
        run: |
          set -o pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-roster-query-plan.postgres.test.ts \
            2>&1 | tee roster-exact-plan.tap
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]] \
            || ! grep -qx '# tests 1' roster-exact-plan.tap \
            || ! grep -qx '# pass 1' roster-exact-plan.tap \
            || ! grep -qx '# fail 0' roster-exact-plan.tap \
            || ! grep -qx '# cancelled 0' roster-exact-plan.tap \
            || ! grep -qx '# skipped 0' roster-exact-plan.tap \
            || ! grep -qx '# Subtest: native exact facet roster query exposes one expanded view plan and transaction-local counters' roster-exact-plan.tap; then
            echo '::error::The native roster query-plan profile failed, was skipped, or did not execute the exact test'
            exit 1
          fi
      - name: Stop and remove only the owned roster query-plan lab
        id: cleanup
        if: ${{ always() && env.R16_ROSTER_QUERY_PLAN_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 roster PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 roster PostgreSQL volume survived cleanup'
            exit 1
          fi
      - name: Validate the native roster query-plan evidence
        if: always()
        env:
          PROFILE_CONCLUSION: ${{ steps.profile.conclusion }}
          CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          path = Path(os.environ['R16_ROSTER_EXACT_PLAN_EVIDENCE_DIR']) / 'roster-exact-plan.json'
          tap = Path('roster-exact-plan.tap')
          if os.environ.get('PROFILE_CONCLUSION') != 'success' or os.environ.get('CLEANUP_CONCLUSION') != 'success':
              raise SystemExit('Roster query-plan evidence requires a passing profile and owned-lab cleanup')
          if not tap.is_file() or tap.stat().st_size <= 0 or tap.stat().st_size > 1024 * 1024:
              raise SystemExit('Roster query-plan TAP is missing, empty, or exceeds 1 MiB')
          if not path.is_file() or path.stat().st_size <= 0 or path.stat().st_size > 2 * 1024 * 1024:
              raise SystemExit('Roster query-plan JSON is missing, empty, or exceeds 2 MiB')
          with path.open(encoding='utf-8') as stream:
              value = json.load(stream)
          if type(value) is not dict:
              raise SystemExit('Roster query-plan JSON must be a single object')
          expected = {
              'contract': 'r16-roster-query-plan-v2',
              'status': 'observed',
              'diagnostic_only': True,
              'h1_accepted': False,
              'cpu': 'UNKNOWN',
              'speedup_claim': False,
          }
          if any(type(value.get(key)) is not type(expected_value) or value.get(key) != expected_value
                 for key, expected_value in expected.items()):
              raise SystemExit('Roster query-plan JSON does not match its diagnostic-only contract')
          if 'candidate_accepted' in value:
              raise SystemExit('Roster query-plan diagnostic must not claim candidate acceptance')
          preflight = value.get('format_preflight')
          if type(preflight) is not dict or preflight.get('status') != 'observed' \
              or preflight.get('format_only') is not True or preflight.get('analyze') is not False \
              or type(preflight.get('seeded_roots')) is not int or preflight.get('seeded_roots') != 0 \
              or preflight.get('placeholder_not_admitted') is not True \
              or type(preflight.get('explain_count')) is not int or preflight.get('explain_count') != 1 \
              or type(preflight.get('provider_http_calls')) is not int or preflight.get('provider_http_calls') != 0 \
              or preflight.get('sanitizer_rejection') is not None \
              or preflight.get('own_database_absent') is not True or preflight.get('admin_end_awaited') is not True:
              raise SystemExit('Roster format preflight must prove one schema-only query and owned-clone cleanup')
          preflight_catalog = preflight.get('catalog_binding')
          if type(preflight_catalog) is not dict or preflight_catalog.get('unchanged') is not True \
              or preflight_catalog.get('source_declared_bodies_and_attrs_match') is not True:
              raise SystemExit('Roster format preflight must preserve the source-bound catalog')
          preflight_source = preflight.get('source_binding')
          if type(preflight_source) is not dict or preflight_source.get('matches_before') is not True:
              raise SystemExit('Roster format preflight must bind to the captured immutable source')
          preflight_plan = preflight.get('plan')
          if type(preflight_plan) is not dict or preflight_plan.get('format_only') is not True \
              or preflight_plan.get('query_template_sha256') != 'sha256:0e4f7d9708942def156838e598672ee5302c8932e332c3378b42c70dff3bd4f2' \
              or type(preflight_plan.get('bind_count')) is not int or preflight_plan.get('bind_count') != 1 \
              or type(preflight_plan.get('explain_count')) is not int or preflight_plan.get('explain_count') != 1 \
              or type(preflight_plan.get('nodes')) is not int or preflight_plan.get('nodes') < 1 \
              or preflight_plan.get('nodes') > 512 or type(preflight_plan.get('bytes')) is not int \
              or preflight_plan.get('bytes') < 1 or preflight_plan.get('bytes') > 1024 * 1024 \
              or type(preflight_plan.get('sanitized_sha256')) is not str \
              or len(preflight_plan.get('sanitized_sha256')) != 71 \
              or not preflight_plan.get('sanitized_sha256').startswith('sha256:') \
              or any(character not in '0123456789abcdef' for character in preflight_plan.get('sanitized_sha256')[7:]):
              raise SystemExit('Roster format preflight must retain one bounded sanitized plan summary')
          for key in ('elapsed_ms', 'explain_elapsed_ms', 'format_read_elapsed_ms'):
              elapsed = preflight.get(key)
              if type(elapsed) not in (int, float) or not math.isfinite(elapsed) or elapsed < 0:
                  raise SystemExit('Roster format preflight timing is missing or invalid: '+key)
          if preflight.get('elapsed_ms') > 1800000:
              raise SystemExit('Roster format preflight exceeded the observed setup cap')
          gates = value.get('gates')
          required_gates = {
              'source_binding', 'exact_original_call_once', 'native_context_preserved',
              'one_complete_plan', 'original_flow_committed', 'closure_confirmed',
          }
          if type(gates) is not dict or set(gates) != required_gates \
              or any(type(gates.get(key)) is not bool or gates.get(key) is not True for key in required_gates):
              raise SystemExit('Roster query-plan JSON must explicitly pass all six exact method gates')
          source = value.get('source')
          if type(source) is not dict or source.get('expected_binding_status') != 'bound_to_immutable_ci_git_object' \
              or source.get('before_after_exact') is not True or source.get('matches_expected_static') is not True:
              raise SystemExit('Roster query-plan source must match the immutable CI object before and after')
          original = value.get('original')
          if type(original) is not dict or original.get('raw_sql_match') is not True \
              or original.get('one_bind_match') is not True or type(original.get('call_count')) is not int \
              or original.get('call_count') != 1 or original.get('success') is not True \
              or original.get('same_result_reference') is not True \
              or type(original.get('roster_count')) is not int or original.get('roster_count') != 32768:
              raise SystemExit('Roster query-plan receipt must preserve the one exact original roster call')
          plan = value.get('plan')
          if type(plan) is not dict or plan.get('status') != 'observed' \
              or type(plan.get('explain_count')) is not int or plan.get('explain_count') != 1 \
              or type(plan.get('nodes')) is not int or plan.get('nodes') < 1 or plan.get('nodes') > 512 \
              or type(plan.get('bytes')) is not int or plan.get('bytes') < 1 or plan.get('bytes') > 1024 * 1024:
              raise SystemExit('Roster query-plan JSON must retain one bounded complete sanitized plan')
          findings = value.get('findings')
          if type(findings) is not dict or findings.get('input_digest_callsite_attribution') != 'UNOBSERVABLE' \
              or findings.get('callsites_resolution') != 'unresolved' or findings.get('status') != 'INCONCLUSIVE':
              raise SystemExit('Roster query-plan findings must preserve unresolved callsite attribution')
          context = value.get('context')
          if type(context) is not dict or context.get('original_isolation') != 'read committed' \
              or context.get('track_functions_during') != 'all' or context.get('local_setting_restored') is not True \
              or context.get('track_functions_before') not in {'none', 'pl', 'all'} \
              or context.get('track_functions_after') != context.get('track_functions_before') \
              or context.get('snapshot_original') != 'UNOBSERVABLE':
              raise SystemExit('Roster query-plan context does not prove safe transaction-local restoration')
          clock = value.get('clock')
          if type(clock) is not dict:
              raise SystemExit('Roster query-plan clock evidence is missing')
          for key in ('runtime_started_at_ms', 'combined_setup_ms'):
              observed = clock.get(key)
              if type(observed) not in (int, float) or not math.isfinite(observed) or observed < 0 or observed > 1800000:
                  raise SystemExit('Roster query-plan combined setup cap failed: '+key)
          for key, limit in (('setup_ms', 1800000), ('prefix_instrumented_ms', 120000), ('total_ms', 1920000)):
              observed = clock.get(key)
              if type(observed) not in (int, float) or not math.isfinite(observed) or observed < 0 or observed > limit:
                  raise SystemExit('Roster query-plan observed elapsed cap failed: '+key)
          if clock.get('combined_setup_ms') != clock.get('runtime_started_at_ms') + clock.get('setup_ms'):
              raise SystemExit('Roster query-plan combined setup must join preflight offset and runtime setup')
          closure = value.get('closure')
          if type(closure) is not dict or closure.get('callback_complete') is not True \
              or closure.get('factory_returned_normally') is not True or closure.get('own_database_absent') is not True \
              or closure.get('admin_end_awaited') is not True:
              raise SystemExit('Roster query-plan owned clone closure is incomplete')
          PY
      - name: Upload native roster query-plan diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-roster-exact-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            roster-exact-plan.tap
            .data/piloto-masivo/r16/roster-exact-plan-native-evidence/roster-exact-plan.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

