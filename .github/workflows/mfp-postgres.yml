            || ! grep -qx '# pass 1' bounded-mentions-compare.tap \
            || ! grep -qx '# fail 0' bounded-mentions-compare.tap \
            || ! grep -qx '# cancelled 0' bounded-mentions-compare.tap \
            || ! grep -qx '# skipped 0' bounded-mentions-compare.tap \
            || ! grep -qx '# Subtest: native bounded mentions filter preserves output and limits the selected mention access' bounded-mentions-compare.tap; then
            echo '::error::The bounded mentions candidate comparison failed, was skipped, or did not execute the exact registered case'
            exit 1
          fi
      - name: Stop and remove only the owned bounded population lab
        id: cleanup
        if: ${{ always() && env.R16_BOUNDED_POPULATION_PLAN_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
