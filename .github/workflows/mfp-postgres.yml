            infrastructure/db/migrations/signal-listening-mark-validation-enr-profile.postgres.test.ts \
            2>&1 | tee mark-validation-enr-v2.tap
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]] \
            || ! grep -qx '# tests 1' mark-validation-enr-v2.tap \
            || ! grep -qx '# pass 1' mark-validation-enr-v2.tap \
            || ! grep -qx '# fail 0' mark-validation-enr-v2.tap \
            || ! grep -qx '# cancelled 0' mark-validation-enr-v2.tap \
            || ! grep -qx '# skipped 0' mark-validation-enr-v2.tap \
            || ! grep -qx '# Subtest: native Mark ENR v2 observes bounded scan geometry without per-alias identity' mark-validation-enr-v2.tap; then
            echo '::error::The native Mark ENR v2 profile failed, was skipped, or did not execute the exact test'
            exit 1
          fi
      - name: Stop and remove only the owned Mark ENR v2 lab
        id: cleanup
        if: ${{ always() && env.R16_MARK_VALIDATION_ENR_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 Mark ENR v2 PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 Mark ENR v2 PostgreSQL volume survived cleanup'
            exit 1
          fi
      - name: Validate the native Mark ENR v2 evidence
        if: always()
        env:
          PROFILE_CONCLUSION: ${{ steps.profile.conclusion }}
          CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          path = Path(os.environ['R16_MARK_VALIDATION_ENR_EVIDENCE_DIR']) / 'mark-validation-enr.json'
          tap = Path('mark-validation-enr-v2.tap')
          if os.environ.get('PROFILE_CONCLUSION') != 'success' or os.environ.get('CLEANUP_CONCLUSION') != 'success':
              raise SystemExit('Mark ENR v2 evidence is not accepted unless profile and owned-lab cleanup both pass')
          if not tap.is_file() or tap.stat().st_size <= 0 or tap.stat().st_size > 1024 * 1024:
              raise SystemExit('Mark ENR v2 TAP is missing, empty, or exceeds 1 MiB')
          if not path.is_file() or path.stat().st_size <= 0 or path.stat().st_size > 2 * 1024 * 1024:
              raise SystemExit('Mark ENR v2 JSON is missing, empty, or exceeds 2 MiB')
          with path.open(encoding='utf-8') as stream:
              value = json.load(stream)
          if type(value) is not dict:
              raise SystemExit('Mark ENR v2 JSON must be a single object')
          expected = {
              'contract': 'r16-listening-mark-validation-enr-v2',
              'status': 'observed',
              'diagnostic_only': True,
              'h1_accepted': False,
              'cpu': 'UNKNOWN',
              'speedup_claim': False,
              'synthetic_native_mark_executed': True,
              'actual_full_workload_cohort': False,
              'assert_raw_ready_original_preserved': True,
          }
          if any(type(value.get(key)) is not type(expected_value) or value.get(key) != expected_value
                 for key, expected_value in expected.items()):
              raise SystemExit('Mark ENR v2 JSON does not match its diagnostic contract')
          if 'candidate_accepted' in value:
              raise SystemExit('Mark ENR v2 JSON must not claim candidate acceptance')
          if value.get('actual_full_workload_cohort') is not False or value.get('synthetic_native_mark_executed') is not True:
              raise SystemExit('Mark ENR v2 JSON must distinguish its real native synthetic Mark from a full-workload cohort')
          if value.get('assert_raw_ready_original_preserved') is not True \
              or type(value.get('pool_connect_borrow_count')) is not int \
              or value.get('pool_connect_borrow_count') != 1:
              raise SystemExit('Mark ENR v2 JSON must preserve assertRawReady and pin exactly one original client borrow')
          ledger = {
              'selected_call_count': 1000,
              'open_reserved_micro_usd': 500000,
              'settled_micro_usd_synthetic': 6000,
              'unknown_exposure_micro_usd': 0,
              'provider_http_calls': 0,
          }
          if any(type(value.get(key)) is not int or value.get(key) != expected_value
                 for key, expected_value in ledger.items()):
              raise SystemExit('Mark ENR v2 JSON does not preserve the registered synthetic cohort and exposure ledger')
          probe = value.get('probe')
          expected_probe = {
              'target_count': 1,
              'batch_transition_count': 1000,
              'old_count': 1000,
              'new_count': 1000,
              'root_count': 1000,
              'old_status': 'reserved',
              'new_status': 'submitting',
              'explain_count': 1,
              'plain_warmups': 0,
              'enr_node_type': 'Named Tuplestore Scan',
              'enr_individual_identity': 'UNOBSERVABLE',
              'alias_exactness': 'NOT_ASSERTED_BY_V2',
              'enr_scan_count': 2,
          }
          if type(probe) is not dict or any(
              (type(probe.get(key)) is not int if type(expected_value) is int
               else type(probe.get(key)) is not type(expected_value))
              or probe.get(key) != expected_value
              for key, expected_value in expected_probe.items()
          ):
              raise SystemExit('Mark ENR v2 JSON does not match the exact transition-table probe contract')
          if 'probe_attempt' in value or 'enr_names_exactly_once' in probe:
              raise SystemExit('Mark ENR v2 must reject partial V1 receipts and must not claim per-alias identity')
          scans = probe.get('enr_scans')
          collection = probe.get('scan_collection')
          if type(scans) is not list or len(scans) != 2 or type(collection) is not dict:
              raise SystemExit('Mark ENR v2 must retain exactly two scan observations and their complete census')
          if collection.get('status') != 'complete' or collection.get('traversal_complete') is not True \
              or type(collection.get('visited_named_nodes')) is not int or collection.get('visited_named_nodes') != 2 \
              or type(collection.get('invalid_name_count')) is not int or collection.get('invalid_name_count') != 0 \
              or type(collection.get('old_count')) is not int or type(collection.get('new_count')) is not int \
              or type(collection.get('missing_name_count')) is not int:
              raise SystemExit('Mark ENR v2 scan census is incomplete or contains invalid names')
          named_old = named_new = missing = 0
          for scan in scans:
              if type(scan) is not dict or scan.get('name_status') not in {'allowed', 'missing'}:
                  raise SystemExit('Mark ENR v2 scan entry has an invalid closed name status')
              name = scan.get('name')
              if scan['name_status'] == 'missing':
                  if name is not None:
                      raise SystemExit('Mark ENR v2 must preserve an absent scan name as null')
                  missing += 1
              elif name == 'listening_old_calls':
                  named_old += 1
              elif name == 'listening_new_calls':
                  named_new += 1
              else:
                  raise SystemExit('Mark ENR v2 scan name is outside the closed ENR allowlist')
              for metric in ('actual_rows', 'actual_loops'):
                  observed = scan.get(metric)
                  if observed != 'UNKNOWN' and (type(observed) not in (int, float) or not math.isfinite(observed) or observed < 0):
                      raise SystemExit('Mark ENR v2 rows/loops must remain finite nonnegative measurements or UNKNOWN')
              if scan.get('execution') not in {'observed', 'not_executed', 'UNKNOWN'}:
                  raise SystemExit('Mark ENR v2 execution status is outside the closed enum')
          if collection.get('missing_name_count') != missing \
              or collection.get('old_count') != named_old or collection.get('new_count') != named_new \
              or missing + named_old + named_new != 2:
              raise SystemExit('Mark ENR v2 scan census disagrees with the retained per-node observations')
          gates = value.get('gates')
          required_gates = {
              'source_binding',
              'original_catalog_unchanged_on_install',
              'probe_catalog_order',
              'same_client_pin',
              'selector_once',
              'zero_target_control',
              'cohort_transition_exact',
              'probe_plan_once',
              'source_bound_enr_scan_geometry',
              'original_guard_commit_ack',
              'post_commit_state_exact',
              'catalog_restored',
              'requeue_open_exposure_preserved',
              'closure_confirmed',
          }
          if type(gates) is not dict or set(gates) != required_gates or any(gates.get(key) is not True for key in required_gates):
              raise SystemExit('Mark ENR v2 JSON must explicitly pass every registered evidence gate')
          PY
      - name: Upload native Mark ENR diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-mark-validation-enr-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mark-validation-enr-v2.tap
            .data/piloto-masivo/r16/mark-validation-enr-v2-native-evidence/mark-validation-enr.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  consumer-main-thread-cpu-probe-experimental:
    name: R16 Listening consumer main-thread CPU sample (isolated lab)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'listening-smoke' && inputs.consumer_main_thread_cpu_probe }}
    runs-on: ubuntu-latest
    # The profiler timer observes a sample window but cannot interrupt a blocked JS thread.
    # This outer timeout only bounds the isolated CI job; it is not a CPU or memory claim.
    timeout-minutes: 40
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
      R16_LISTENING_PIPELINE_PROFILE_EVIDENCE_DIR: .data/piloto-masivo/r16/consumer-main-thread-cpu-native-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Initialize an empty consumer CPU TAP receipt
        run: printf '%s\n' '# native Listening consumer CPU profile did not start' > listening-main-thread-cpu.tap
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Node workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Require the owned consumer CPU lab and evidence path to be absent
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named R16 consumer CPU PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named R16 consumer CPU PostgreSQL volume already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          evidence_dir=.data/piloto-masivo/r16/consumer-main-thread-cpu-native-evidence
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" || -e "$evidence_dir" ]]; then
            echo '::error::Private files for the named R16 consumer CPU lab already exist'
            exit 1
          fi
      - name: Start the owned official PostgreSQL 17 and Redis consumer CPU lab
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_CONSUMER_MAIN_THREAD_CPU_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh consumer CPU lab
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          pnpm --filter @noisia/db db:smoke:migrations
      - name: Run the native consumer pipeline and main-thread CPU profile
        id: profile
        env:
          NOISIA_R16_LISTENING_PIPELINE_PROFILE_PG: 'true'
          NOISIA_R16_LISTENING_PIPELINE_PROFILE_PURE: 'false'
          NOISIA_R16_CONSUMER_MAIN_THREAD_CPU_PG: 'true'
          NOISIA_R16_CONSUMER_MAIN_THREAD_CPU_PURE: 'false'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
        run: |
          set -o pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-consumer-main-thread-cpu.postgres.test.ts \
            2>&1 | tee listening-main-thread-cpu.tap
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]] \
            || ! grep -qx '# tests 1' listening-main-thread-cpu.tap \
            || ! grep -qx '# pass 1' listening-main-thread-cpu.tap \
            || ! grep -qx '# fail 0' listening-main-thread-cpu.tap \
            || ! grep -qx '# cancelled 0' listening-main-thread-cpu.tap \
            || ! grep -qx '# skipped 0' listening-main-thread-cpu.tap \
            || ! grep -qx '# Subtest: native Listening main-thread CPU profile brackets the drained synthetic consumer pipeline' listening-main-thread-cpu.tap; then
            echo '::error::The native consumer pipeline CPU profile failed, was skipped, or did not execute the exact test'
            exit 1
          fi
      - name: Stop and remove only the owned consumer CPU lab
        id: cleanup
        if: ${{ always() && env.R16_CONSUMER_MAIN_THREAD_CPU_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 consumer CPU PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 consumer CPU PostgreSQL volume survived cleanup'
            exit 1
          fi
      - name: Validate the native consumer CPU and pipeline evidence
        if: always()
        env:
          PROFILE_CONCLUSION: ${{ steps.profile.conclusion }}
          CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          directory = Path(os.environ['R16_LISTENING_PIPELINE_PROFILE_EVIDENCE_DIR'])
          cpu_path = directory / 'listening-main-thread-cpu.json'
          pipeline_path = directory / 'listening-pipeline-profile.json'
          tap = Path('listening-main-thread-cpu.tap')
          if os.environ.get('PROFILE_CONCLUSION') != 'success' or os.environ.get('CLEANUP_CONCLUSION') != 'success':
              raise SystemExit('Consumer CPU evidence requires a passing profile and owned-lab cleanup')
          for path, cap in ((cpu_path, 2 * 1024 * 1024), (pipeline_path, 2 * 1024 * 1024), (tap, 1024 * 1024)):
              if not path.is_file() or path.is_symlink() or path.stat().st_size <= 0 or path.stat().st_size > cap:
                  raise SystemExit('Consumer CPU evidence file is missing, unsafe, empty, or over its cap')
          if cpu_path.stat().st_size + pipeline_path.stat().st_size > 2 * 1024 * 1024:
              raise SystemExit('Combined consumer CPU and pipeline evidence exceeds 2 MiB')
          with cpu_path.open(encoding='utf-8') as stream:
              cpu = json.load(stream)
          with pipeline_path.open(encoding='utf-8') as stream:
              pipeline = json.load(stream)
          if type(cpu) is not dict or type(pipeline) is not dict:
              raise SystemExit('Consumer CPU and pipeline receipts must each be a single JSON object')
          expected = {'contract': 'r16-consumer-main-thread-cpu-v1', 'status': 'observed', 'diagnostic_only': True,
              'h1_accepted': False, 'cpu': 'SAMPLED_NOT_EXACT', 'hard_duration_bound': False,
              'internal_profiler_memory_bound': 'UNKNOWN'}
          if any(type(cpu.get(key)) is not type(expected_value) or cpu.get(key) != expected_value
                 for key, expected_value in expected.items()):
              raise SystemExit('Consumer CPU receipt does not match its diagnostic-only contract')
          if 'candidate_accepted' in cpu or 'speedup_claim' in cpu:
              raise SystemExit('Consumer CPU receipt must not add candidate or speedup claims')
          if pipeline.get('status') != 'observed' or pipeline.get('root_count') != 4096 \
              or pipeline.get('interpretation') != 'provider_store_query_correlated_http_spans_independent_no_causal_claim' \
              or pipeline.get('h1_accepted') is not False or pipeline.get('cpu') != 'UNKNOWN':
              raise SystemExit('Original synthetic pipeline oracles are incomplete or inconclusive')
          source_binding = pipeline.get('source_binding')
          if type(source_binding) is not dict or source_binding.get('status') != 'observed' \
              or source_binding.get('matches_expected_git') is not True or source_binding.get('capture_error_stages') != []:
              raise SystemExit('Full source provenance must be captured before and after the fixture')
          expected_source = source_binding.get('expected_git')
          before_source = source_binding.get('runtime_before')
          after_source = source_binding.get('runtime_after')
          def validate_source_manifest(value):
              if type(value) is not dict or set(value) != {'head_sha', 'source_tree_sha256', 'tree_status_sha256', 'file_count', 'file_manifest'}:
                  return False
              if value.get('head_sha') != os.environ.get('GITHUB_SHA'):
                  return False
              count, manifest = value.get('file_count'), value.get('file_manifest')
              if type(count) is not int or count <= 0 or type(manifest) is not list or len(manifest) != count:
                  return False
              paths, tuples = [], []
              for entry in manifest:
                  if type(entry) is not dict or set(entry) != {'path', 'sha256'} or type(entry.get('path')) is not str \
                      or type(entry.get('sha256')) is not str or len(entry['sha256']) != 71 \
                      or not entry['sha256'].startswith('sha256:') \
                      or any(ch not in '0123456789abcdef' for ch in entry['sha256'][7:]):
                      return False
                  paths.append(entry['path'])
                  tuples.append([entry['path'], entry['sha256']])
              if paths != sorted(set(paths)):
                  return False
              digest = 'sha256:' + __import__('hashlib').sha256(
                  json.dumps(tuples, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
              empty_status = 'sha256:' + __import__('hashlib').sha256(b'').hexdigest()
              return value.get('source_tree_sha256') == digest and value.get('tree_status_sha256') == empty_status
          if not all(validate_source_manifest(item) for item in (expected_source, before_source, after_source)) \
              or before_source != expected_source or after_source != expected_source:
              raise SystemExit('Full expected-Git and runtime before/after manifests must match exactly')
          events = pipeline.get('events')
          event_counts = events.get('event_counts') if type(events) is dict else None
          if type(event_counts) is not dict:
              raise SystemExit('Original pipeline event completeness counters are missing')
          for counter in event_counts.values():
              if type(counter) is not dict or type(counter.get('seen')) is not int \
                  or type(counter.get('recorded')) is not int or type(counter.get('dropped')) is not int \
                  or counter.get('dropped') != 0 or counter.get('recorded') != counter.get('seen'):
                  raise SystemExit('Original pipeline timeline contains dropped or unretained events')
          template_counts = events.get('query_template_counts')
          if type(template_counts) is not dict or type(template_counts.get('seen')) is not int \
              or type(template_counts.get('recorded')) is not int or type(template_counts.get('dropped')) is not int \
              or template_counts.get('dropped') != 0 or template_counts.get('recorded') != template_counts.get('seen'):
              raise SystemExit('Original pipeline query-template census is incomplete')
          correlation = pipeline.get('correlation')
          if type(correlation) is not dict or correlation.get('provider_events_unmatched') != 0 \
              or correlation.get('durability_events_unmatched') != 0:
              raise SystemExit('Original pipeline spans must remain fully correlated')
          if cpu.get('stop_reason') != 'job_drained' or type(cpu.get('stop_commands')) is not int \
              or cpu.get('stop_commands') != 1 or cpu.get('worker') != 'drained':
              raise SystemExit('Complete CPU acceptance requires one stop after the full worker drain, not a partial watchdog interval')
          cleanup = cpu.get('cleanup')
          if type(cleanup) is not dict or cleanup.get('disable_confirmed') is not True \
              or cleanup.get('disconnect_confirmed') is not True or cleanup.get('watchdog_cleared') is not True:
              raise SystemExit('Consumer CPU profiler/session cleanup is incomplete')
          capture = cpu.get('capture')
          if type(capture) is not dict or type(capture.get('profile')) is not dict or type(capture.get('summary')) is not dict:
              raise SystemExit('Sanitized CPU capture or summary is missing')
          profile, summary = capture['profile'], capture['summary']
          nodes, samples, deltas = profile.get('nodes'), profile.get('samples'), profile.get('time_deltas_us')
          if type(nodes) is not list or not 1 <= len(nodes) <= 8192 or type(samples) is not list \
              or not 1 <= len(samples) <= 65536 or type(deltas) is not list or len(deltas) != len(samples):
              raise SystemExit('CPU profile node/sample bounds are invalid')
          duration = profile.get('duration_us')
          if type(duration) not in (int, float) or not math.isfinite(duration) or duration < 0 or duration > 60_000_000:
              raise SystemExit('Observed CPU profile duration is invalid or exceeds 60 seconds')
          if summary.get('sample_count') != len(samples) or summary.get('positions') != 'GENERATED_NO_SOURCE_MAP' \
              or summary.get('attribution') != 'main_thread_samples_not_exact_cpu' \
              or summary.get('inclusive_samples') != 'NOT_COMPUTED':
              raise SystemExit('CPU summary semantics or counts are invalid')
          if capture.get('profile_bytes', 0) > 1_048_576 or capture.get('summary_bytes', 0) > 131_072:
              raise SystemExit('Sanitized CPU profile/summary retention limit exceeded')
          manifest = cpu.get('source_manifest')
          if type(manifest) is not list or len(manifest) != 15:
              raise SystemExit('CPU profile source manifest is incomplete')
          for item in manifest:
              if type(item) is not dict or set(item) != {'path', 'sha256'} or type(item.get('path')) is not str \
                  or type(item.get('sha256')) is not str or len(item['sha256']) != 64 \
                  or any(ch not in '0123456789abcdef' for ch in item['sha256']):
                  raise SystemExit('CPU profile source manifest entry is malformed')
          PY
      - name: Upload native consumer CPU profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-consumer-main-thread-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            listening-main-thread-cpu.tap
            .data/piloto-masivo/r16/consumer-main-thread-cpu-native-evidence/listening-pipeline-profile.json
            .data/piloto-masivo/r16/consumer-main-thread-cpu-native-evidence/listening-main-thread-cpu.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  listening-partial-admission-probe-experimental:
    name: R16 Listening partial admission cap (isolated lab)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'listening-smoke' || inputs.scope == 'partial-admission-only') && inputs.listening_partial_admission_probe }}
    runs-on: ubuntu-latest
    # Bounds the isolated PostgreSQL/Redis job; it is not a throughput claim.
    timeout-minutes: 40
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
      R16_LISTENING_PARTIAL_ADMISSION_EVIDENCE_DIR: .data/piloto-masivo/r16/partial-admission-native-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Initialize an empty partial admission TAP receipt
        run: printf '%s\n' '# native Listening partial admission diagnostic did not start' > listening-partial-admission.tap
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Node workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck database package on the remote runner
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @noisia/db typecheck
      - name: Run pure Listening write-function observation contracts
        env:
          NOISIA_R16_LISTENING_WRITE_FUNCTIONS_PURE: 'true'
          NOISIA_R16_LISTENING_PARTIAL_ADMISSION_PURE: 'true'
        run: |
          set -euo pipefail
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-write-functions.test.ts \
            infrastructure/db/migrations/signal-listening-partial-admission.postgres.test.ts \
            | tee listening-partial-admission-pure.tap
          if ! grep -qx '# tests 20' listening-partial-admission-pure.tap \
            || ! grep -qx '# pass 19' listening-partial-admission-pure.tap \
            || ! grep -qx '# fail 0' listening-partial-admission-pure.tap \
            || ! grep -qx '# cancelled 0' listening-partial-admission-pure.tap \
            || ! grep -qx '# skipped 1' listening-partial-admission-pure.tap; then
            echo '::error::Pure Listening observation contracts did not run the exact 20-test, 19-pass, 1-skip census'
            exit 1
          fi
      - name: Require the owned partial admission lab and private files to be absent
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named R16 partial admission PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named R16 partial admission PostgreSQL volume already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          evidence_dir=.data/piloto-masivo/r16/partial-admission-native-evidence
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" || -e "$evidence_dir" ]]; then
            echo '::error::Private files for the named R16 partial admission lab already exist'
            exit 1
          fi
      - name: Start the owned official PostgreSQL 17 and Redis partial admission lab
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_LISTENING_PARTIAL_ADMISSION_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh partial admission lab
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          pnpm --filter @noisia/db db:smoke:migrations
      - name: Run the native Listening partial admission profile
        id: profile
        env:
          NOISIA_R16_LISTENING_PARTIAL_ADMISSION_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
        run: |
          set -o pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          pnpm exec node --test --test-concurrency=1 --import tsx \
            infrastructure/db/migrations/signal-listening-partial-admission.postgres.test.ts \
            2>&1 | tee listening-partial-admission.tap
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]] \
            || ! grep -qx '# tests 1' listening-partial-admission.tap \
            || ! grep -qx '# pass 1' listening-partial-admission.tap \
            || ! grep -qx '# fail 0' listening-partial-admission.tap \
            || ! grep -qx '# cancelled 0' listening-partial-admission.tap \
            || ! grep -qx '# skipped 0' listening-partial-admission.tap \
            || ! grep -qx '# Subtest: native Listening partial admission preserves committed money and terminal idempotency' listening-partial-admission.tap; then
            echo '::error::The native partial admission diagnostic failed, was skipped, or did not execute the exact test'
            exit 1
          fi
      - name: Stop and remove only the owned partial admission lab
        id: cleanup
        if: ${{ always() && env.R16_LISTENING_PARTIAL_ADMISSION_LAB_OWNED == 'true' }}
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned R16 partial admission PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 partial admission PostgreSQL volume survived cleanup'
            exit 1
          fi
      - name: Validate native partial admission evidence
        if: always()
        env:
          PROFILE_CONCLUSION: ${{ steps.profile.conclusion }}
          CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          set -euo pipefail
          # Financial acceptance is independent of whether Postgres exposes all counters.
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          evidence = Path(os.environ['R16_LISTENING_PARTIAL_ADMISSION_EVIDENCE_DIR']) / 'listening-partial-admission.json'
          tap = Path('listening-partial-admission.tap')
          profile_succeeded = os.environ.get('PROFILE_CONCLUSION') == 'success'
          cleanup_succeeded = os.environ.get('CLEANUP_CONCLUSION') == 'success'
          for path, cap in ((evidence, 2 * 1024 * 1024), (tap, 1024 * 1024)):
              if not path.is_file() or path.is_symlink() or path.stat().st_size <= 0 or path.stat().st_size > cap:
                  raise SystemExit('Partial admission evidence file is missing, unsafe, empty, or over its cap')
          with evidence.open(encoding='utf-8') as stream:
              report = json.load(stream)
          if type(report) is not dict:
              raise SystemExit('Partial admission receipt must be one JSON object')
          expected = {'contract': 'r16-listening-partial-admission-v1',
              'diagnostic_only': True, 'h1_accepted': False, 'scope': 'functional240_not_H1_or_scale1024_4096',
              'cap_micro_usd': '50000', 'native_population_roots': 240, 'recovery_execution_claimed': False,
              'external_spend_micro_usd': '0'}
          if any(type(report.get(key)) is not type(value) or report.get(key) != value for key, value in expected.items()):
              raise SystemExit('Partial admission receipt does not match its diagnostic-only contract')
          if report.get('status') not in ('observed', 'failed'):
              raise SystemExit('Partial admission receipt status is not recognized')
          if 'candidate_accepted' in report or 'speedup_claim' in report:
              raise SystemExit('Partial admission receipt must not claim candidate acceptance or speedup')
          gates = report.get('gates')
          required_gates = {'source_binding', 'native_cap_interval', 'committed_before_fetch', 'delivered_drain',
              'terminal_idempotency', 'closure_confirmed'}
          if type(gates) is not dict or set(gates) != required_gates \
              or any(type(value) is not bool for value in gates.values()):
              raise SystemExit('Partial admission gates must be exactly six booleans')
          if report['status'] == 'observed':
              if not profile_succeeded or not cleanup_succeeded or any(value is not True for value in gates.values()):
                  raise SystemExit('Observed partial admission requires a passing profile, cleanup and six true gates')
              terminal = report.get('terminal_restart')
              expected_terminal = {'claim_attempted': True, 'claimed': False, 'status': 'not_claimed',
                  'new_physical_fetches': 0, 'recovery_execution_claimed': False}
              if type(terminal) is not dict or set(terminal) != set(expected_terminal) \
                  or any(type(terminal.get(key)) is not type(value) or terminal.get(key) != value
                         for key, value in expected_terminal.items()):
                  raise SystemExit('Partial admission terminal idempotency witness is incomplete')
          elif profile_succeeded or not cleanup_succeeded:
              raise SystemExit('A failed receipt requires a failed native profile and successful owned-lab cleanup')
          source = report.get('source')
          if type(source) is not dict:
              raise SystemExit('Full immutable Git source binding is missing')
          expected_source, before_source, after_source = source.get('expected'), source.get('before'), source.get('after')
          def valid_manifest(value):
              if type(value) is not dict or set(value) != {'head_sha', 'source_tree_sha256', 'tree_status_sha256', 'file_count', 'file_manifest'}:
                  return False
              if value.get('head_sha') != os.environ.get('GITHUB_SHA'):
                  return False
              count, manifest = value.get('file_count'), value.get('file_manifest')
              if type(count) is not int or count <= 0 or type(manifest) is not list or len(manifest) != count:
                  return False
              paths, pairs = [], []
              for entry in manifest:
                  if type(entry) is not dict or set(entry) != {'path', 'sha256'} or type(entry.get('path')) is not str \
                      or type(entry.get('sha256')) is not str or len(entry['sha256']) != 71 \
                      or not entry['sha256'].startswith('sha256:') or any(ch not in '0123456789abcdef' for ch in entry['sha256'][7:]):
                      return False
                  paths.append(entry['path']); pairs.append([entry['path'], entry['sha256']])
              if paths != sorted(set(paths)):
                  return False
              tree = 'sha256:' + hashlib.sha256(json.dumps(pairs, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
              empty_status = 'sha256:' + hashlib.sha256(b'').hexdigest()
              return value.get('source_tree_sha256') == tree and value.get('tree_status_sha256') == empty_status
          if not all(valid_manifest(value) for value in (expected_source, before_source, after_source)) \
              or before_source != expected_source or after_source != expected_source:
              raise SystemExit('Expected Git and full runtime before/after manifests must match exactly')
          writes = report.get('write_functions')
          if type(writes) is not dict:
              raise SystemExit('Three-phase write-function observation is missing')
          write_expected = {'contract': 'r16-listening-write-functions-v1', 'diagnostic_only': True,
              'h1_accepted': False, 'cpu': 'UNKNOWN', 'closed': True,
              'function_coverage': 'TRACKED_PUBLIC_ROWS_ONLY_MISSING_UNKNOWN'}
          if any(type(writes.get(key)) is not type(value) or writes.get(key) != value
                 for key, value in write_expected.items()) or writes.get('status') not in ('observed', 'INCONCLUSIVE', 'failed'):
              raise SystemExit('Write-function observation does not match its diagnostic-only contract')
          write_json = json.dumps(writes, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          if len(write_json) > 2 * 1024 * 1024:
              raise SystemExit('Write-function observation exceeds its 2 MiB JSON cap')
          write_gates = writes.get('gates')
          write_gate_names = {'three_original_statements', 'native_commit_ack', 'identity_and_settings_restored',
              'counters_known', 'no_recording_loss'}
          sample_types = {'null', 'undefined', 'string', 'boolean', 'bigint', 'symbol', 'function', 'array', 'object',
              'number_safe_integer_nonnegative', 'number_unsafe_integer_nonnegative', 'number_fraction_nonnegative',
              'number_negative', 'number_nonfinite', 'UNKNOWN'}
          sample_stages = {'query', 'row_count', 'catalog_name', 'catalog_shape', 'counter_values', 'done'}
          if type(write_gates) is not dict or set(write_gates) != write_gate_names \
              or any(type(write_gates.get(name)) is not bool for name in write_gate_names):
              raise SystemExit('Write-function observation gates must be exactly five booleans')
          if report['status'] == 'failed':
              if writes.get('status') != 'failed':
                  raise SystemExit('A failed Native receipt must retain a failed write-function observation')
              captures = writes.get('captures')
              if type(captures) is not list or len(captures) > 3:
                  raise SystemExit('Failed write-function diagnostics exceed the three-phase cap')
              phases = {'reserve', 'mark', 'apply'}
              seen_phases = set()
              for capture in captures:
                  if type(capture) is not dict or capture.get('phase') not in phases or capture['phase'] in seen_phases:
                      raise SystemExit('Failed write-function diagnostic phase is malformed or repeated')
                  seen_phases.add(capture['phase'])
                  if 'failure_reason' in capture:
                      reason = capture.get('failure_reason')
                      if type(reason) is not str or reason != 'UNKNOWN' and not (reason.startswith('write_functions_') and reason.replace('_', '').isalnum()):
                          raise SystemExit('Write-function failure reason is not a safe code token')
                  sampling = capture.get('sampling')
                  if type(sampling) is not dict or set(sampling) != {'before', 'after'}:
                      raise SystemExit('Write-function sampling checkpoints are missing or malformed')
                  for checkpoint in sampling.values():
                      if checkpoint is None:
                          continue
                      required = {'stage', 'rows_seen', 'row_index'}
                      optional = {'oid_type', 'name_membership', 'unknown_catalog_name', 'catalog_types', 'counter_types'}
                      if type(checkpoint) is not dict or not required.issubset(checkpoint) or set(checkpoint) - required - optional:
                          raise SystemExit('Write-function sampling checkpoint contains unrecognized fields')
                      if checkpoint.get('stage') not in sample_stages:
                          raise SystemExit('Write-function sampling stage is unrecognized')
                      rows_seen = checkpoint.get('rows_seen')
                      if rows_seen != 'UNKNOWN' and (type(rows_seen) is not int or not 0 <= rows_seen <= 65):
                          raise SystemExit('Write-function sample row count is outside its diagnostic cap')
                      row_index = checkpoint.get('row_index')
                      if row_index is not None and (type(row_index) is not int or not 1 <= row_index <= 64):
                          raise SystemExit('Write-function sample row index is outside its diagnostic cap')
                      if 'oid_type' in checkpoint and checkpoint['oid_type'] not in sample_types:
                          raise SystemExit('Write-function OID type is not in its closed enum')
                      if 'name_membership' in checkpoint and checkpoint['name_membership'] not in ('known', 'unknown', 'not_string', 'UNKNOWN'):
                          raise SystemExit('Write-function name membership is not in its closed enum')
                      if 'unknown_catalog_name' in checkpoint:
                          item = checkpoint['unknown_catalog_name']
                          if type(item) is not dict or set(item) != {'sha256', 'value_type'} or item.get('value_type') not in sample_types:
                              raise SystemExit('Unknown catalog-name diagnostic is malformed')
                          digest = item.get('sha256')
                          if digest is not None and (type(digest) is not str or len(digest) != 64 or any(ch not in '0123456789abcdef' for ch in digest)):
                              raise SystemExit('Unknown catalog-name digest is malformed')
                      for key, fields in (('catalog_types', {'language', 'volatility', 'security_definer', 'prosrc', 'signature', 'proconfig'}),
                                          ('counter_types', {'calls', 'total_time', 'self_time'})):
                          if key in checkpoint and (type(checkpoint[key]) is not dict or set(checkpoint[key]) != fields
                              or any(value not in sample_types for value in checkpoint[key].values())):
                              raise SystemExit('Write-function sampled type tags are malformed')
                  for sample_name in ('before', 'after', 'deltas'):
                      if sample_name in capture and (type(capture[sample_name]) is not list or len(capture[sample_name]) > 64):
                          raise SystemExit('Failed write-function row samples exceed their 64-row cap')
              if not profile_succeeded and cleanup_succeeded:
                  print('Partial admission safe failure diagnostics validated; the Native profile remains failed')
                  raise SystemExit('Native partial admission profile failed; safe diagnostic evidence retained')
              raise SystemExit('A failed write-function receipt cannot pass Native validation')
          if not cleanup_succeeded or not profile_succeeded:
              raise SystemExit('Observed partial admission requires a passing native profile and owned-lab cleanup')
          if any(write_gates[name] is not True for name in write_gate_names - {'counters_known'}):
              raise SystemExit('All three original writes, commit acknowledgements, restoration and recording must be observed')
          captures = writes.get('captures')
          if type(captures) is not list or len(captures) != 3:
              raise SystemExit('Exactly three original write-phase captures are required')
          phases = {'reserve', 'mark', 'apply'}
          if {capture.get('phase') for capture in captures if type(capture) is dict} != phases \
              or any(type(capture) is not dict for capture in captures):
              raise SystemExit('Write-function phases must be reserve, mark and apply exactly once')
          all_known = True
          for capture in captures:
              encoded_capture = json.dumps(capture, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              if len(encoded_capture) > 128 * 1024:
                  raise SystemExit('A write-function capture exceeds its 128 KiB cap')
              phase = capture['phase']
              expected_binds = {'reserve': 8, 'mark': 2, 'apply': 4}[phase]
              if type(capture.get('original_executions')) is not int or capture['original_executions'] != 1 \
                  or capture.get('original_succeeded') is not True or capture.get('stage') != 'committed' \
                  or capture.get('native_commit_ack') is not True or capture.get('identity_same') is not True \
                  or capture.get('settings_restored') is not True or capture.get('result_reference_preserved') is not True:
                  raise SystemExit('A native write was missing, repeated, uncommitted or not restored')
              proposed, roots, row_count = capture.get('proposed_rows'), capture.get('batch_roots'), capture.get('row_count')
              elapsed, binds = capture.get('elapsed_dml_ms'), capture.get('bind_count')
              if type(proposed) is not int or not 1 <= proposed <= 512 or type(roots) is not int \
                  or not 1 <= roots <= proposed or type(row_count) is not int or row_count < 0 \
                  or type(binds) is not int or binds != expected_binds or type(elapsed) not in (int, float) \
                  or not math.isfinite(elapsed) or elapsed < 0:
                  raise SystemExit('Write-function proposal, row or timing summary is malformed')
              if any(key in capture for key in ('safe_error_tree', 'failure_stage', 'transaction_rolled_back',
                    'capture_payload_rejected_over_bytes', 'capture_bytes_observed')):
                  raise SystemExit('A write-function capture records a failed or truncated observation')
              sampling = capture.get('sampling')
              if type(sampling) is not dict or set(sampling) != {'before', 'after'}:
                  raise SystemExit('Successful write-function sampling checkpoints are missing')
              for checkpoint in sampling.values():
                  if type(checkpoint) is not dict or set(checkpoint) - {'stage', 'rows_seen', 'row_index', 'oid_type',
                          'name_membership', 'unknown_catalog_name', 'catalog_types', 'counter_types'} \
                      or not {'stage', 'rows_seen', 'row_index'}.issubset(checkpoint) or checkpoint.get('stage') != 'done':
                      raise SystemExit('Successful write-function sampling checkpoint is malformed or incomplete')
                  rows_seen, row_index = checkpoint.get('rows_seen'), checkpoint.get('row_index')
                  if type(rows_seen) is not int or not 0 <= rows_seen <= 64 \
                      or row_index is not None and (type(row_index) is not int or not 1 <= row_index <= 64):
                      raise SystemExit('Successful write-function sample counters exceed their closed bounds')
                  if 'oid_type' in checkpoint and checkpoint['oid_type'] not in sample_types:
                      raise SystemExit('Successful write-function OID type is not in its closed enum')
                  if 'name_membership' in checkpoint and checkpoint['name_membership'] not in ('known', 'unknown', 'not_string', 'UNKNOWN'):
                      raise SystemExit('Successful write-function name membership is not in its closed enum')
                  for key, fields in (('catalog_types', {'language', 'volatility', 'security_definer', 'prosrc', 'signature', 'proconfig'}),
                                      ('counter_types', {'calls', 'total_time', 'self_time'})):
                      if key in checkpoint and (type(checkpoint[key]) is not dict or set(checkpoint[key]) != fields
                          or any(value not in sample_types for value in checkpoint[key].values())):
                          raise SystemExit('Successful write-function sampled type tags are malformed')
              for samples_name in ('before', 'after'):
                  samples = capture.get(samples_name)
                  if type(samples) is not list or len(samples) > 64:
                      raise SystemExit('Function counter samples are missing or exceed their cap')
              deltas = capture.get('deltas')
              if type(deltas) is not list or len(deltas) > 64:
                  raise SystemExit('Function counter deltas are missing or exceed their cap')
              if not deltas:
                  if capture['before'] or capture['after']:
                      raise SystemExit('Empty function deltas require both public counter samples to be empty')
                  all_known = False
              for delta in deltas:
                  if type(delta) is not dict:
                      raise SystemExit('Function counter delta is malformed')
                  if delta.get('status') == 'UNKNOWN':
                      all_known = False
                      if delta.get('reason') not in ('baseline_absent', 'after_absent') \
                          or any(delta.get(key) != 'UNKNOWN' for key in ('calls', 'total_time', 'self_time')):
                          raise SystemExit('Unknown counters require an explicit absent sample and UNKNOWN values')
                  elif delta.get('status') == 'known':
                      for key in ('calls', 'total_time', 'self_time'):
                          value = delta.get(key)
                          if type(value) not in (int, float) or not math.isfinite(value) or value < 0:
                              raise SystemExit('Known function counter delta is invalid')
                  else:
                      raise SystemExit('Function counter delta has an unrecognized status')
          if write_gates['counters_known'] is not all_known \
              or writes.get('status') != ('observed' if all_known else 'INCONCLUSIVE'):
              raise SystemExit('INCONCLUSIVE is allowed only when a counter baseline or after sample is absent')
          print('Partial admission evidence: six gates and immutable full-source binding verified')
          PY
      - name: Upload native partial admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-partial-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            listening-partial-admission.tap
            .data/piloto-masivo/r16/partial-admission-native-evidence/listening-partial-admission.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
