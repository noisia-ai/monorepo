          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned R16 bounded population PostgreSQL volume survived cleanup'
            exit 1
          fi
          remaining_containers="$(docker ps -aq --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          remaining_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=r16bench-benchmark-pg17)"
          if [[ -n "$remaining_containers" || -n "$remaining_volumes" ]]; then
