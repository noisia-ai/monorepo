name: R16 six-validator SELECT counterfactual
run-name: Synthetic six-validator correctness only; not H1 acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r16-shared-wire-validator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  shared-wire-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Pure diagnostic controls
        run: corepack pnpm exec node --test --test-concurrency=1 --import tsx scripts/r16-diagnostics/shared-wire/run.test.mts scripts/r16/ci-benchmark-guards.test.ts
      - name: Fresh owned PG17 and six-validator native SELECT counterfactual
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${GITHUB_ACTIONS:-}" != "true" || "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" \
            || "${GITHUB_REF:-}" != "refs/heads/codex/r16-shared-wire-validator" ]]; then
            echo "R16 CI benchmark may run only on a fresh GitHub Actions runner." >&2
            exit 2
          fi

          repo_root="$(git rev-parse --show-toplevel)"
          export R16BENCH_RUN_ID="benchmark-pg17"
          export R16BENCH_SERVICES="postgres,redis"
          lab_dir="$repo_root/.data/piloto-masivo/r16/labs/$R16BENCH_RUN_ID"
          if [[ -e "$lab_dir" || -L "$lab_dir" ]]; then
            echo "R16 CI benchmark metadata already exists; refusing to reuse it." >&2
            exit 2
          fi

          project="r16bench-$R16BENCH_RUN_ID"
          fixed_container="r16-benchmark-pg17"
          fixed_redis_container="${project}-redis-1"
          fixed_volume="r16bench-benchmark-pg17_postgres-data"
          fixed_network="${project}_default"

          # A query error is not evidence that a resource is absent. Keep all discovery
          # before lab-up and before registering cleanup, so pre-existing data is never
          # removed by this job.
          if ! docker info >/dev/null 2>&1; then
            echo "Docker daemon is unavailable; refusing to start the R16 CI benchmark." >&2
            exit 2
          fi

          if ! project_containers="$(docker ps --all --filter "label=com.docker.compose.project=$project" --format '{{.ID}}')" \
            || ! all_container_names="$(docker ps --all --format '{{.Names}}')" \
            || ! project_volumes="$(docker volume ls --filter "label=com.docker.compose.project=$project" --format '{{.Name}}')" \
            || ! all_volume_names="$(docker volume ls --format '{{.Name}}')" \
            || ! project_networks="$(docker network ls --filter "label=com.docker.compose.project=$project" --format '{{.Name}}')" \
            || ! all_network_names="$(docker network ls --format '{{.Name}}')"; then
            echo "Docker resource discovery failed; refusing to assume the R16 project is fresh." >&2
            exit 2
          fi

          if [[ -n "$project_containers" || -n "$project_volumes" || -n "$project_networks" ]] \
            || [[ $'\n'$all_container_names$'\n' == *$'\n'$fixed_container$'\n'* ]] \
            || [[ $'\n'$all_container_names$'\n' == *$'\n'$fixed_redis_container$'\n'* ]] \
            || [[ $'\n'$all_volume_names$'\n' == *$'\n'$fixed_volume$'\n'* ]] \
            || [[ $'\n'$all_network_names$'\n' == *$'\n'$fixed_network$'\n'* ]]; then
            echo "R16 CI benchmark resources already exist; refusing to reuse or remove them." >&2
            exit 2
          fi

          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -f "$lab_dir/private.env" ]]; then
              R16BENCH_RUN_ID="$R16BENCH_RUN_ID" "$repo_root/scripts/r16/lab-down.sh" || {
                local cleanup_status=$?
                if (( status == 0 )); then status=$cleanup_status; fi
              }
            fi
            exit "$status"
          }
          trap cleanup EXIT

          export R16BENCH_SERVICES=postgres
          scripts/r16/lab-up.sh
          set -a
          source .data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          set +a
          # Before migrations there must be no real public relations at all.
          test "$(docker exec r16-benchmark-pg17 psql -U postgres -d noisia_mfp_ci -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p')")" = 0
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17 DATABASE_SSL=false
          export NOISIA_DB_SMOKE_ALLOW_REMOTE=false NOISIA_DB_SMOKE_RESET_SCHEMA=true
          export NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES=true
          export NOISIA_R16_NATIVE_FIXTURE_PG=true NOISIA_R16_SHARED_WIRE_READONLY=true
          corepack pnpm --filter @noisia/db db:smoke:migrations
          corepack pnpm exec tsx scripts/r16-diagnostics/shared-wire/run.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r16-shared-wire-validator-synthetic-evidence
          path: .data/piloto-masivo/r16/shared-wire-validator/**/result.json
          include-hidden-files: true
          if-no-files-found: warn
