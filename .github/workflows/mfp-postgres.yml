name: R16 CANONICAL READONLY counterfactual
run-name: CANONICAL READONLY synthetic helper diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r16-canonical-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  canonical-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Pure diagnostic controls
        run: corepack pnpm exec tsx --test scripts/r16-diagnostics/canonical-json/run.test.mts
      - name: Fresh owned PG17 and SELECT-only counterfactual
        shell: bash
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then exit 1; fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then exit 1; fi
          export R16BENCH_RUN_ID=benchmark-pg17 R16BENCH_SERVICES=postgres
          scripts/r16/lab-up.sh
          cleanup() { scripts/r16/lab-down.sh; }
          trap cleanup EXIT
          set -a
          source .data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          set +a
          # Before migrations there must be no real public relations at all.
          test "$(docker exec r16-benchmark-pg17 psql -U postgres -d noisia_mfp_ci -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p')")" = 0
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17 DATABASE_SSL=false
          export NOISIA_DB_SMOKE_ALLOW_REMOTE=false NOISIA_DB_SMOKE_RESET_SCHEMA=true
          export NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES=true
          export NOISIA_R16_NATIVE_FIXTURE_PG=true NOISIA_R16_CANONICAL_READONLY=true
          corepack pnpm --filter @noisia/db db:smoke:migrations
          corepack pnpm exec tsx scripts/r16-diagnostics/canonical-json/run.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r16-canonical-readonly-synthetic-evidence
          path: .data/piloto-masivo/r16/canonical-json/**/result.json
          include-hidden-files: true
          if-no-files-found: warn
