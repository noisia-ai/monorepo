name: ci

# Required status check for merging into `main` (enforce via branch protection).
on:
  pull_request:
    branches: [main, develop, feat/mfp-phase-c-evaluation, feat/mfp-ws1-pg-ci]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # Hard gate: no secrets / committed .env files reach main.
        # Pinned binary instead of gitleaks-action@v2 (the action needs GITHUB_TOKEN
        # and an org license; the binary is dependency-free). --redact hides any match.
        # --log-opts=HEAD scans exactly what reaches main: on a pull_request HEAD is the
        # merge commit (main + the PR), on a push it is main. Without it, gitleaks walks
        # every ref that fetch-depth: 0 pulled in, so one unrelated branch with a false
        # positive fails every PR in the repo. A branch is still scanned in full the day
        # it opens its own PR against main.
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact --exit-code 1 --log-opts="HEAD"

      - name: Block committed env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::An .env file is tracked in git. Remove it and rotate the secrets."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm dev:corpus:check
      - run: node --test --import tsx scripts/eval/*.test.mjs
      - run: pnpm exec tsc --project scripts/eval/tsconfig.json
      - run: pnpm exec tsc --project scripts/dev-corpus/tsconfig.json
      - run: pnpm exec tsc --project scripts/providers/tsconfig.json
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Studio production build
        # Build-time placeholders exercise route collection without any live
        # service credential or database connection. Runtime secrets stay in Railway.
        env:
          DATABASE_URL: postgresql://test@127.0.0.1:1/noisia_test
          KINDE_ISSUER_URL: https://ci.example.invalid
          KINDE_CLIENT_ID: ci-placeholder
          KINDE_CLIENT_SECRET: ci-placeholder
          KINDE_SITE_URL: https://studio.example.invalid
          KINDE_POST_LOGOUT_REDIRECT_URL: https://studio.example.invalid
          KINDE_POST_LOGIN_REDIRECT_URL: https://studio.example.invalid/auth/continue
        run: pnpm --filter @noisia/studio build
      - name: Data OS readiness
        run: pnpm data-os:verify
      - name: Data OS local smoke
        run: |
          pnpm data-os:local-smoke
          pnpm data-os:validate-local-smoke
