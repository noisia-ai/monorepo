name: R16 listening small diagnostic
run-name: R16 diagnostic-only 4096 roots (${{ inputs.mode || 'legacy' }}, ${{ inputs.resource_profile || 'baseline_512m' }})

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [legacy, neutral_only]
        default: legacy
        description: Neutral timing disables CPU and all auto_explain captures
      resource_profile:
        type: choice
        options: [baseline_512m, bounded_2g]
        default: baseline_512m
        description: bounded_2g is available only for a manual neutral_only run
      target_ref:
        type: string
        required: false
        description: Exact 40-character product commit with Listening stream hook (neutral mode)
  pull_request:
    paths:
      - '.github/workflows/r16-listening-small-diagnostic.yml'
      - 'scripts/r16-diagnostics/listening-small/**'

permissions:
  contents: read

concurrency:
  group: r16-listening-small-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  listening-small:
    name: listening-small-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        label: ${{ inputs.mode == 'neutral_only' && fromJSON('["candidate"]') || fromJSON('["baseline-32f","candidate"]') }}
    steps:
      - name: Checkout benchmark target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.label == 'candidate' && (inputs.target_ref || github.sha) || '32f40ec89a21da90235c3589a4820ae05dedf6fc' }}
          path: target

      - name: Checkout diagnostic harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: probe
          sparse-checkout: |
            .github/workflows/r16-listening-small-diagnostic.yml
            scripts/r16-diagnostics/listening-small
          sparse-checkout-cone-mode: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Install target dependencies
        working-directory: target
        run: corepack pnpm install --frozen-lockfile

      - name: Run pure diagnostic guard tests
        working-directory: target
        env:
          R16_DIAGNOSTIC_TARGET_ROOT: ${{ github.workspace }}/target
        run: corepack pnpm exec tsx --test ../probe/scripts/r16-diagnostics/listening-small/run.test.mts

      - name: Validate neutral target binding
        if: inputs.mode == 'neutral_only'
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: test "${#TARGET_REF}" = 40 && [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Validate resource profile selection
        env:
          MODE: ${{ inputs.mode || 'legacy' }}
          RESOURCE_PROFILE: ${{ inputs.resource_profile || 'baseline_512m' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$RESOURCE_PROFILE" in
            baseline_512m) ;;
            bounded_2g)
              test "$MODE" = neutral_only
              test "$EVENT_NAME" = workflow_dispatch
              ;;
            *) echo '::error::unknown diagnostic resource profile'; exit 1 ;;
          esac

      - name: Allocate owned PG17 and Redis lab
        working-directory: target
        env:
          R16BENCH_RUN_ID: benchmark-pg17
          R16BENCH_SERVICES: postgres,redis
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::owned PG container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::owned PG volume already exists'
            exit 1
          fi
          scripts/r16/lab-up.sh

      - name: Apply migrations, focused oracle, and native diagnostic
        id: native_diagnostic
        working-directory: target
        env:
          R16BENCH_RUN_ID: benchmark-pg17
          NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_R16_SMALL_DIAGNOSTIC: 'true'
          NOISIA_R16_LISTENING_DML_PLAN_PG: ${{ inputs.mode == 'neutral_only' && 'false' || 'true' }}
          R16_DIAGNOSTIC_MODE: ${{ inputs.mode || 'legacy' }}
          NOISIA_DB_SMOKE_ALLOW_REMOTE: 'false'
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
          NOISIA_JEV_STREAM_MAX_IN_FLIGHT: ${{ inputs.resource_profile == 'bounded_2g' && inputs.mode == 'neutral_only' && '4096' || '1024' }}
          NOISIA_JEV_STREAM_BUFFER_BYTES: ${{ inputs.resource_profile == 'bounded_2g' && inputs.mode == 'neutral_only' && '2147483648' || '536870912' }}
          NOISIA_JEV_STREAM_FLUSH_SIZE: ${{ inputs.resource_profile == 'bounded_2g' && inputs.mode == 'neutral_only' && '4096' || '1024' }}
          NOISIA_JEV_STREAM_MAX_FLUSHES: '2'
          NOISIA_JEV_STREAM_FLUSH_INTERVAL_MS: ${{ inputs.resource_profile == 'bounded_2g' && inputs.mode == 'neutral_only' && '1000' || '250' }}
          NOISIA_JEV_STREAM_WINDOW_SIZE: '4096'
          R16_DIAGNOSTIC_RESOURCE_PROFILE: ${{ inputs.resource_profile || 'baseline_512m' }}
          NOISIA_MASS_LABELING_ENABLED: 'true'
          R16_DIAGNOSTIC_TARGET_ROOT: ${{ github.workspace }}/target
          R16_DIAGNOSTIC_PROBE_ROOT: ${{ github.workspace }}/probe
          R16_DIAGNOSTIC_ARTIFACT: ${{ github.workspace }}/artifacts/r16-listening-small/result.json
          R16_DIAGNOSTIC_CPU_PROFILE_DIR: ${{ github.workspace }}/artifacts/r16-listening-small/cpu-profile-${{ matrix.label }}
          R16_MONEY_ORACLE_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/money-validator-oracle.tap
          R16_ACTOR_RUNTIME_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/actor-query-runtime.tap
          R16_PAGE_FENCES_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-page-fences.tap
          R16_READER_SEMANTICS_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-reader-semantics.tap
          R16_INITIAL_RECOVERY_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-initial-recovery.tap
          R16_DIAGNOSTIC_TARGET_LABEL: ${{ matrix.label }}
          R16_DIAGNOSTIC_TARGET_REF_REQUESTED: ${{ matrix.label == 'candidate' && (inputs.target_ref || github.sha) || '32f40ec89a21da90235c3589a4820ae05dedf6fc' }}
          R16_DIAGNOSTIC_PROBE_REF_REQUESTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          lab_dir="$GITHUB_WORKSPACE/target/.data/piloto-masivo/r16/labs/benchmark-pg17"
          cleanup() {
            if [ -d "$GITHUB_WORKSPACE/target" ]; then
              (cd "$GITHUB_WORKSPACE/target" && R16BENCH_RUN_ID=benchmark-pg17 scripts/r16/lab-down.sh) >/dev/null 2>&1 || true
            fi
            if [ ! -f "$R16_DIAGNOSTIC_ARTIFACT" ]; then
              mkdir -p "$(dirname "$R16_DIAGNOSTIC_ARTIFACT")"
              printf '%s\n' '{"contract_version":"r16-listening-small-diagnostic-v1","diagnostic_only":true,"h1_accepted":false,"status":"failed_before_runner"}' > "$R16_DIAGNOSTIC_ARTIFACT"
            fi
          }
          trap cleanup EXIT
          set -a
          source "$lab_dir/connection.env"
          set +a
          export DATABASE_SSL=false
          corepack pnpm --filter @noisia/db db:smoke:migrations
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_MONEY_ORACLE_TAP")"
            set +e
            timeout 4m env NOISIA_R16_LISTENING_MONEY_BATCHES_PG=true corepack pnpm exec tsx --test \
              --test-name-pattern='^selected materialization and full join match old validators and atomically reject forged siblings$' \
              --test-concurrency=1 infrastructure/db/migrations/signal-listening-money-batches.postgres.test.ts \
              > "$R16_MONEY_ORACLE_TAP" 2>&1
            oracle_status=$?
            set -e
            if [ "$oracle_status" -ne 0 ]; then
              cat "$R16_MONEY_ORACLE_TAP"
              exit "$oracle_status"
            fi
            node - "$R16_MONEY_ORACLE_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const title = 'selected materialization and full join match old validators and atomically reject forged siblings';
          const selected = tap.split(/\r?\n/u).filter((line) => /^ok \d+ - /.test(line) && line.endsWith(title));
          if (selected.length !== 1 || /^ok \d+ - .*# SKIP/u.test(selected[0])) {
            throw new Error('focused native oracle did not report exactly one executed passing test');
          }
          if (!/^# pass 1$/mu.test(tap) || !/^# fail 0$/mu.test(tap)) {
            throw new Error('focused native oracle TAP must report pass 1 and fail 0');
          }
          process.stdout.write('focused native oracle: pass=1 fail=0 (other tests intentionally unselected)\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_ACTOR_RUNTIME_TAP")"
            set +e
            timeout 4m env NOISIA_R16_ACTOR_QUERY_RUNTIME_PG=true corepack pnpm exec tsx --test --test-concurrency=1 \
              infrastructure/db/migrations/signal-processing-actor-query-runtime.postgres.test.ts \
              > "$R16_ACTOR_RUNTIME_TAP" 2>&1
            actor_status=$?
            set -e
            if [ "$actor_status" -ne 0 ]; then
              cat "$R16_ACTOR_RUNTIME_TAP"
              exit "$actor_status"
            fi
            node - "$R16_ACTOR_RUNTIME_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          if (!/^# tests 3$/mu.test(tap) || !/^# pass 3$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('actor query runtime TAP must report tests=3 pass=3 fail=0 skipped=0');
          }
          process.stdout.write('actor query runtime: tests=3 pass=3 fail=0 skipped=0\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_PAGE_FENCES_TAP")"
            set +e
            timeout 4m env NOISIA_R16_LISTENING_MONEY_BATCHES_PG=true corepack pnpm exec tsx --test \
              --test-name-pattern='^native Listening page fence ' \
              --test-concurrency=1 infrastructure/db/migrations/signal-listening-money-batches.postgres.test.ts \
              > "$R16_PAGE_FENCES_TAP" 2>&1
            fence_status=$?
            set -e
            if [ "$fence_status" -ne 0 ]; then
              cat "$R16_PAGE_FENCES_TAP"
              exit "$fence_status"
            fi
            node - "$R16_PAGE_FENCES_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const selected = tap.split(/\r?\n/u).filter((line) => /^ok \d+ - native Listening page fence /u.test(line));
          if (selected.length !== 10 || selected.some((line) => /# SKIP/u.test(line))
              || !/^# pass 10$/mu.test(tap) || !/^# fail 0$/mu.test(tap)) {
            throw new Error('Listening page fence TAP must report exactly ten executed passing selected cases');
          }
          process.stdout.write('Listening page fences: pass=10 fail=0 (other tests intentionally unselected)\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_READER_SEMANTICS_TAP")"
            set +e
            timeout 4m env NOISIA_R16_LISTENING_BOUNDED_CUSTOM_PLAN_PG=true corepack pnpm exec tsx --test --test-concurrency=1 \
              infrastructure/db/migrations/signal-listening-bounded-custom-plan.postgres.test.ts \
              > "$R16_READER_SEMANTICS_TAP" 2>&1
            reader_status=$?
            set -e
            if [ "$reader_status" -ne 0 ]; then
              cat "$R16_READER_SEMANTICS_TAP"
              exit "$reader_status"
            fi
            node - "$R16_READER_SEMANTICS_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          if (!/^# tests 3$/mu.test(tap) || !/^# pass 3$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('Listening reader semantics TAP must report tests=3 pass=3 fail=0 skipped=0');
          }
          process.stdout.write('Listening reader semantics: tests=3 pass=3 fail=0 skipped=0\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_INITIAL_RECOVERY_TAP")"
            set +e
            timeout 4m env NOISIA_R16_DISCOVERY_INITIAL_PG=true corepack pnpm exec tsx --test \
              --test-name-pattern='^initial unknown ' --test-concurrency=1 \
              infrastructure/db/migrations/signal-listening-discovery-initial.postgres.test.ts \
              > "$R16_INITIAL_RECOVERY_TAP" 2>&1
            recovery_status=$?
            set -e
            if [ "$recovery_status" -ne 0 ]; then
              cat "$R16_INITIAL_RECOVERY_TAP"
              exit "$recovery_status"
            fi
            node - "$R16_INITIAL_RECOVERY_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const selected = tap.split(/\r?\n/u).filter((line) => /^ok \d+ - initial unknown /u.test(line));
          if (selected.length !== 2 || selected.some((line) => /# SKIP/u.test(line))
              || !/^# pass 2$/mu.test(tap) || !/^# fail 0$/mu.test(tap)) {
            throw new Error('Listening initial recovery TAP must report exactly two executed passing selected cases');
          }
          process.stdout.write('Listening initial recovery: pass=2 fail=0 (other tests intentionally unselected)\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_MODE" = neutral_only ]; then
            timeout 10m corepack pnpm exec node --import tsx \
              ../probe/scripts/r16-diagnostics/listening-small/run.mts --run
          else
          mkdir -p "$R16_DIAGNOSTIC_CPU_PROFILE_DIR"
          timeout 10m corepack pnpm exec node --cpu-prof --cpu-prof-interval=1000 \
            --cpu-prof-dir="$R16_DIAGNOSTIC_CPU_PROFILE_DIR" --import tsx \
            ../probe/scripts/r16-diagnostics/listening-small/run.mts --run
          corepack pnpm exec node --import tsx --input-type=module - \
            "$R16_DIAGNOSTIC_CPU_PROFILE_DIR" "$R16_DIAGNOSTIC_ARTIFACT" "$R16_DIAGNOSTIC_PROBE_ROOT" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          const dir = process.argv[2];
          const artifact = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const probe = process.argv[4];
          const {cpuProfileIdentityV1, cpuProfileRangeV1} = await import(pathToFileURL(
            path.join(probe, 'scripts/r16-diagnostics/listening-small/run.mts')).href);
          const entries = fs.readdirSync(dir);
          const names = entries.filter((name) => name.endsWith('.cpuprofile'));
          if (names.length !== entries.length) throw new Error('unexpected artifact type in CPU profile directory');
          const mainPid = artifact.cpu_profile?.main_process_pid;
          const samplerPid = artifact.cpu_profile?.sampler_process_pid;
          if (!Number.isSafeInteger(mainPid) || !Number.isSafeInteger(samplerPid) || mainPid === samplerPid) {
            throw new Error('CPU profile process identities missing');
          }
          if (!names.length || names.length > 16) throw new Error('CPU profile count outside bound');
          let total = 0;
          const profiles = names.map((name) => {
            const full = path.join(dir, name);
            const size = fs.statSync(full).size;
            total += size;
            if (size <= 0 || size > 32 * 1024 * 1024) throw new Error('CPU profile exceeds per-file size bound');
            const profile = JSON.parse(fs.readFileSync(full, 'utf8'));
            const identity = cpuProfileIdentityV1(name, mainPid, samplerPid);
            const range = cpuProfileRangeV1(profile);
            return {...identity, size_bytes: size, ...range};
          });
          if (total > 64 * 1024 * 1024) throw new Error('CPU profile aggregate size bound exceeded');
          const pairs = new Set(profiles.map((profile) => `${profile.pid}:${profile.tid}`));
          if (pairs.size !== profiles.length) throw new Error('duplicate CPU profile thread identity');
          for (const [pid, role] of [[mainPid, 'runner'], [samplerPid, 'sampler']]) {
            if (!profiles.some((profile) => profile.pid === pid && profile.tid === 0 && profile.role === role)) {
              throw new Error('main-thread CPU profile missing');
            }
          }
          fs.writeFileSync(path.join(dir, 'manifest.json'), JSON.stringify({
            diagnostic_only: true, h1_accepted: false, profiler: 'node_cpu_prof', interval_us: 1000,
            capacity_claim: false, overhead_measured: false, max_file_bytes: 32 * 1024 * 1024,
            max_total_bytes: 64 * 1024 * 1024, max_profile_count: 16, total_bytes: total,
            v8_clock_units: 'microseconds', classification_profile_overlap: 'unknown_clock_bridge', profiles,
          }, null, 2) + '\n', {mode: 0o600});
          process.stdout.write(`bounded CPU profiles: count=${profiles.length} total_bytes=${total}\n`);
          NODE
          fi

      - name: Upload CPU profiles
        if: always() && steps.native_diagnostic.outcome == 'success' && inputs.mode != 'neutral_only'
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-cpu-profile-${{ matrix.label }}-${{ github.run_id }}
          path: artifacts/r16-listening-small/cpu-profile-${{ matrix.label }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Ensure sanitized artifact exists
        if: always()
        env:
          R16_DIAGNOSTIC_ARTIFACT: ${{ github.workspace }}/artifacts/r16-listening-small/result.json
        run: |
          if [ ! -f "$R16_DIAGNOSTIC_ARTIFACT" ]; then
            mkdir -p "$(dirname "$R16_DIAGNOSTIC_ARTIFACT")"
            printf '%s\n' '{"contract_version":"r16-listening-small-diagnostic-v1","diagnostic_only":true,"h1_accepted":false,"status":"failed_before_runner"}' > "$R16_DIAGNOSTIC_ARTIFACT"
          fi

      - name: Upload synthetic aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-${{ matrix.label }}-${{ github.run_id }}
          path: artifacts/r16-listening-small/result.json
          if-no-files-found: error
          retention-days: 14

      - name: Ensure focused validator TAP artifact exists
        if: always() && matrix.label == 'candidate'
        env:
          R16_MONEY_ORACLE_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/money-validator-oracle.tap
        run: |
          if [ ! -f "$R16_MONEY_ORACLE_TAP" ]; then
            mkdir -p "$(dirname "$R16_MONEY_ORACLE_TAP")"
            printf '%s\n' 'focused native oracle was not reached' > "$R16_MONEY_ORACLE_TAP"
          fi

      - name: Upload focused validator TAP
        if: always() && matrix.label == 'candidate'
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-money-validator-${{ github.run_id }}
          path: artifacts/r16-listening-small/money-validator-oracle.tap
          if-no-files-found: error
          retention-days: 14

      - name: Ensure actor runtime TAP artifact exists
        if: always() && matrix.label == 'candidate'
        env:
          R16_ACTOR_RUNTIME_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/actor-query-runtime.tap
        run: |
          if [ ! -f "$R16_ACTOR_RUNTIME_TAP" ]; then
            mkdir -p "$(dirname "$R16_ACTOR_RUNTIME_TAP")"
            printf '%s\n' 'actor query runtime suite was not reached' > "$R16_ACTOR_RUNTIME_TAP"
          fi

      - name: Upload actor runtime TAP
        if: always() && matrix.label == 'candidate'
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-actor-query-runtime-${{ github.run_id }}
          path: artifacts/r16-listening-small/actor-query-runtime.tap
          if-no-files-found: error
          retention-days: 14

      - name: Ensure Listening page fences TAP artifact exists
        if: always() && matrix.label == 'candidate'
        env:
          R16_PAGE_FENCES_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-page-fences.tap
        run: |
          if [ ! -f "$R16_PAGE_FENCES_TAP" ]; then
            mkdir -p "$(dirname "$R16_PAGE_FENCES_TAP")"
            printf '%s\n' 'Listening page fences suite was not reached' > "$R16_PAGE_FENCES_TAP"
          fi

      - name: Upload Listening page fences TAP
        if: always() && matrix.label == 'candidate'
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-page-fences-${{ github.run_id }}
          path: artifacts/r16-listening-small/listening-page-fences.tap
          if-no-files-found: error
          retention-days: 14

      - name: Ensure Listening reader semantics TAP artifact exists
        if: always() && matrix.label == 'candidate'
        env:
          R16_READER_SEMANTICS_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-reader-semantics.tap
        run: |
          if [ ! -f "$R16_READER_SEMANTICS_TAP" ]; then
            mkdir -p "$(dirname "$R16_READER_SEMANTICS_TAP")"
            printf '%s\n' 'Listening reader semantics suite was not reached' > "$R16_READER_SEMANTICS_TAP"
          fi

      - name: Upload Listening reader semantics TAP
        if: always() && matrix.label == 'candidate'
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-reader-semantics-${{ github.run_id }}
          path: artifacts/r16-listening-small/listening-reader-semantics.tap
          if-no-files-found: error
          retention-days: 14

      - name: Ensure Listening initial recovery TAP artifact exists
        if: always() && matrix.label == 'candidate'
        env:
          R16_INITIAL_RECOVERY_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-initial-recovery.tap
        run: |
          if [ ! -f "$R16_INITIAL_RECOVERY_TAP" ]; then
            mkdir -p "$(dirname "$R16_INITIAL_RECOVERY_TAP")"
            printf '%s\n' 'Listening initial recovery suite was not reached' > "$R16_INITIAL_RECOVERY_TAP"
          fi

      - name: Upload Listening initial recovery TAP
        if: always() && matrix.label == 'candidate'
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-initial-recovery-${{ github.run_id }}
          path: artifacts/r16-listening-small/listening-initial-recovery.tap
          if-no-files-found: error
          retention-days: 14
