name: R16 listening small diagnostic
run-name: R16 diagnostic-only 4096 roots (${{ inputs.mode || 'legacy' }}, ${{ inputs.resource_profile || 'baseline_512m' }}, reserve smoke=${{ inputs.reserve_shared_smoke || false }})

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [legacy, neutral_only, sql_frontier_only]
        default: legacy
        description: SQL frontier captures bounded DML plans without CPU profiling
      resource_profile:
        type: choice
        options: [baseline_512m, bounded_2g]
        default: baseline_512m
        description: bounded_2g is available only for manual neutral_only or sql_frontier_only runs
      reserve_shared_smoke:
        type: boolean
        default: false
        description: Run native shared-reservation and cursor PostgreSQL smoke gates (neutral mode only)
      capture_projection_plan:
        type: boolean
        default: false
        description: Capture one bounded read-only input projection plan (requires SQL frontier mode and shared smoke)
      projection_linear_oracle:
        type: boolean
        default: false
        description: Run three exact native PostgreSQL projection linearity oracles in an isolated lab
      statement_shared_wire_oracle:
        type: boolean
        default: false
        description: Run five exact native PostgreSQL shared-wire oracles in a fresh isolated lab
      target_ref:
        type: string
        required: false
        description: Exact 40-character product commit with Listening stream hook (neutral and SQL frontier modes)
  pull_request:
    paths:
      - '.github/workflows/r16-listening-small-diagnostic.yml'
      - 'scripts/r16-diagnostics/listening-small/**'

permissions:
  contents: read

concurrency:
  group: r16-listening-small-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  raw-acceptance:
    name: R16 RAW page acceptance (fresh isolated lab)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selected_pass: ${{ steps.publish.outputs.selected_pass || steps.noop.outputs.selected_pass || '0' }}
      target_sha: ${{ steps.publish.outputs.target_sha || steps.noop.outputs.target_sha || '' }}
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
    steps:
      - name: Validate RAW acceptance target before lab allocation
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        env:
          MODE: ${{ inputs.mode }}
          RESOURCE_PROFILE: ${{ inputs.resource_profile || 'baseline_512m' }}
          RESERVE_SHARED_SMOKE: ${{ inputs.reserve_shared_smoke || false }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ inputs.target_ref }}
          CAPTURE_PROJECTION_PLAN: ${{ inputs.capture_projection_plan || false }}
          PROJECTION_LINEAR_ORACLE: ${{ inputs.projection_linear_oracle || false }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != workflow_dispatch ] \
              || { [ "$MODE" != neutral_only ] && [ "$MODE" != sql_frontier_only ]; } \
              || [ -z "$TARGET_REF" ] || [ "${#TARGET_REF}" -ne 40 ] || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::RAW acceptance requires a manual neutral or SQL diagnostic and an explicit 40-character target SHA'
            exit 1
          fi
          if [ "$CAPTURE_PROJECTION_PLAN" = true ] \
              && { [ "$MODE" != sql_frontier_only ] || [ "$RESERVE_SHARED_SMOKE" != true ]; }; then
            echo '::error::projection plan capture requires a manual SQL frontier run with reserve_shared_smoke'
            exit 1
          fi
          if [ "$PROJECTION_LINEAR_ORACLE" = true ] \
              && { { [ "$MODE" != neutral_only ] && [ "$MODE" != sql_frontier_only ]; } \
                || [ "$RESERVE_SHARED_SMOKE" != true ] || [ -z "$TARGET_REF" ] \
                || [ "${#TARGET_REF}" -ne 40 ] || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; }; then
            echo '::error::projection linearity oracle requires a manual neutral or SQL diagnostic, shared smoke and exact target SHA'
            exit 1
          fi
          case "$RESOURCE_PROFILE" in
            baseline_512m) ;;
            bounded_2g)
              test "$EVENT_NAME" = workflow_dispatch
              ;;
            *) echo '::error::unknown RAW acceptance resource profile'; exit 1 ;;
          esac
          for name in $(compgen -e); do
            case "$name" in
              *ANTHROPIC*API_KEY*|*ANTHROPIC*TOKEN*|*SONNET*API_KEY*|*SONNET*TOKEN*|*VOYAGE*API_KEY*|*VOYAGE*TOKEN*)
                echo '::error::provider credentials are forbidden in RAW acceptance'
                exit 1
                ;;
            esac
          done
          printf 'R16_RAW_ACCEPTANCE_TARGET_REF=%s\n' "$TARGET_REF" >> "$GITHUB_ENV"
      - name: Checkout the exact RAW acceptance target
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target
      - name: Seal the checked out target source
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        working-directory: target
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$TARGET_REF"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::RAW acceptance target checkout is not clean'
            exit 1
          fi
          printf 'R16_RAW_ACCEPTANCE_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
      - name: Set up pnpm
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Set up Node
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Install frozen target dependencies
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        working-directory: target
        run: corepack pnpm install --frozen-lockfile
      - name: Require the owned RAW acceptance container and volume to be absent
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        working-directory: target
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named RAW acceptance PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named RAW acceptance PostgreSQL volume already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" ]]; then
            echo '::error::Private files for the named RAW acceptance lab already exist'
            exit 1
          fi
      - name: Start the owned RAW acceptance PostgreSQL 17 and Redis lab
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        working-directory: target
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_RAW_ACCEPTANCE_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh RAW acceptance lab
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        working-directory: target
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          corepack pnpm --filter @noisia/db db:smoke:migrations
      - name: Run exact RAW recovery and conflict cases
        id: raw_faults
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        working-directory: target
        env:
          NOISIA_R16_RAW_PAGE_LOCKS_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
          RAW_FAULT_TAP: ${{ runner.temp }}/r16-raw-page-faults.tap
        run: |
          set -euo pipefail
          : > "$RAW_FAULT_TAP"
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          corepack pnpm exec node --test --test-concurrency=1 \
            --test-name-pattern='^(?:raw rollback recovery preserves exact bytes and existing budget|raw commit_ack recovery preserves exact bytes and existing budget|RAW page rejects a digest conflict without mutating a valid sibling|RAW page rejects a raw conflict without mutating a valid sibling)$' \
            --import tsx infrastructure/db/migrations/signal-labeling-raw-page-locks.postgres.test.ts | tee "$RAW_FAULT_TAP"
          test_status=${PIPESTATUS[0]}
          set -e
          node - "$RAW_FAULT_TAP" "$test_status" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const status = Number(process.argv[3]);
          const expected = [
            'raw rollback recovery preserves exact bytes and existing budget',
            'raw commit_ack recovery preserves exact bytes and existing budget',
            'RAW page rejects a digest conflict without mutating a valid sibling',
            'RAW page rejects a raw conflict without mutating a valid sibling',
          ];
          const lines = tap.split(/\r?\n/u);
          const selected = expected.map(title => lines.filter(line => /^ok \d+ - /u.test(line) && line.endsWith(` - ${title}`)));
          if (status !== 0 || selected.some(rows => rows.length !== 1)
              || !/^# pass 4$/mu.test(tap) || !/^# fail 0$/mu.test(tap)) {
            throw new Error('RAW fault TAP must report four exact selected passing cases');
          }
          process.stdout.write('RAW recovery and conflict cases: 4 exact selected cases passed\n');
          NODE
      - name: Run exact RAW attach layout cases
        id: raw_attach
        if: ${{ inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        working-directory: target
        env:
          NOISIA_R16_RAW_ATTACH_ORACLE_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
          RAW_ATTACH_TAP: ${{ runner.temp }}/r16-raw-page-attach.tap
        run: |
          set -euo pipefail
          : > "$RAW_ATTACH_TAP"
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          corepack pnpm exec node --test --test-concurrency=1 \
            --test-name-pattern='^(?:RAW attach layout720 original and page map preserve native rows among 4128 calls|RAW attach layout4096 original and page map preserve native rows among 4128 calls)$' \
            --import tsx infrastructure/db/migrations/signal-labeling-raw-attach.postgres.test.ts | tee "$RAW_ATTACH_TAP"
          test_status=${PIPESTATUS[0]}
          set -e
          node - "$RAW_ATTACH_TAP" "$test_status" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const status = Number(process.argv[3]);
          const expected = [
            'RAW attach layout720 original and page map preserve native rows among 4128 calls',
            'RAW attach layout4096 original and page map preserve native rows among 4128 calls',
          ];
          const lines = tap.split(/\r?\n/u);
          const selected = expected.map(title => lines.filter(line => /^ok \d+ - /u.test(line) && line.endsWith(` - ${title}`)));
          if (status !== 0 || selected.some(rows => rows.length !== 1)
              || !/^# tests 2$/mu.test(tap) || !/^# pass 2$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('RAW attach TAP must report two exact selected titles, pass=2, fail=0, skipped=0');
          }
          process.stdout.write('RAW attach layouts: 2 exact selected cases passed\n');
          NODE
      - name: Verify RAW acceptance source is unchanged
        id: source_end
        if: ${{ always() && inputs.reserve_shared_smoke == true && github.event_name == 'workflow_dispatch' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
        working-directory: target
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R16_RAW_ACCEPTANCE_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_REF"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::RAW acceptance changed the checked out target source tree'
            exit 1
          fi
      - name: Publish RAW acceptance cross-phase evidence
        id: publish
        if: ${{ success() && steps.raw_faults.outcome == 'success' && steps.raw_attach.outcome == 'success' && steps.source_end.outcome == 'success' && inputs.reserve_shared_smoke == true }}
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          printf 'selected_pass=6\n' >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$TARGET_REF" >> "$GITHUB_OUTPUT"
      - name: Leave RAW acceptance output empty when the smoke was not requested
        id: noop
        if: ${{ inputs.reserve_shared_smoke != true || github.event_name != 'workflow_dispatch' || (inputs.mode != 'neutral_only' && inputs.mode != 'sql_frontier_only') }}
        run: |
          printf 'selected_pass=0\n' >> "$GITHUB_OUTPUT"
          printf 'target_sha=\n' >> "$GITHUB_OUTPUT"
      - name: Ensure RAW acceptance receipts exist
        if: always()
        env:
          RAW_FAULT_TAP: ${{ runner.temp }}/r16-raw-page-faults.tap
          RAW_ATTACH_TAP: ${{ runner.temp }}/r16-raw-page-attach.tap
        run: |
          for tap in "$RAW_FAULT_TAP" "$RAW_ATTACH_TAP"; do
            if [ ! -f "$tap" ]; then printf '%s\n' 'RAW acceptance was not requested' > "$tap"; fi
          done
      - name: Upload RAW acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-raw-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r16-raw-page-faults.tap
            ${{ runner.temp }}/r16-raw-page-attach.tap
          if-no-files-found: error
          retention-days: 14
      - name: Stop and remove only the owned RAW acceptance lab
        if: ${{ always() && env.R16_RAW_ACCEPTANCE_LAB_OWNED == 'true' }}
        working-directory: target
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then scripts/r16/lab-down.sh; fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned RAW acceptance PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned RAW acceptance PostgreSQL volume survived cleanup'
            exit 1
          fi

  projection-linear-acceptance:
    name: R16 projection linear-joins acceptance (fresh isolated lab)
    if: ${{ inputs.projection_linear_oracle == true && github.event_name == 'workflow_dispatch' && inputs.reserve_shared_smoke == true && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') }}
    needs: raw-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selected_pass: ${{ steps.publish.outputs.selected_pass || '0' }}
      target_sha: ${{ steps.publish.outputs.target_sha || '' }}
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
    steps:
      - name: Validate projection linear-joins evidence request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          RESERVE_SHARED_SMOKE: ${{ inputs.reserve_shared_smoke || false }}
          TARGET_REF: ${{ inputs.target_ref }}
          RAW_ACCEPTANCE_SELECTED_PASS: ${{ needs.raw-acceptance.outputs.selected_pass || '0' }}
          RAW_ACCEPTANCE_TARGET_SHA: ${{ needs.raw-acceptance.outputs.target_sha || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != workflow_dispatch ] \
              || { [ "$MODE" != neutral_only ] && [ "$MODE" != sql_frontier_only ]; } \
              || [ "$RESERVE_SHARED_SMOKE" != true ] || [ -z "$TARGET_REF" ] \
              || [ "${#TARGET_REF}" -ne 40 ] || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::projection linear-joins acceptance requires manual neutral/SQL mode, shared smoke and exact target SHA'
            exit 1
          fi
          if [ "$RAW_ACCEPTANCE_SELECTED_PASS" != 6 ] || [ "$RAW_ACCEPTANCE_TARGET_SHA" != "$TARGET_REF" ]; then
            echo '::error::projection linear-joins acceptance requires six RAW passes from the exact target SHA'
            exit 1
          fi
          for name in $(compgen -e); do
            case "$name" in
              *ANTHROPIC*API_KEY*|*ANTHROPIC*TOKEN*|*SONNET*API_KEY*|*SONNET*TOKEN*|*VOYAGE*API_KEY*|*VOYAGE*TOKEN*)
                echo '::error::provider credentials are forbidden in projection linear-joins acceptance'
                exit 1
                ;;
            esac
          done
      - name: Checkout the exact projection linear-joins target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target
      - name: Seal the checked out target source
        working-directory: target
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$TARGET_REF"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::projection linear-joins target checkout is not clean'
            exit 1
          fi
          printf 'R16_PROJECTION_LINEAR_TARGET_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: target/services/workers/requirements-workspace-engine.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Install frozen target dependencies
        working-directory: target
        run: corepack pnpm install --frozen-lockfile
      - name: Install the offline workspace numerical runtime
        working-directory: target
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r services/workers/requirements-workspace-engine.txt
          python -m pip install pytest==8.3.5
      - name: Require the owned projection linear-joins container and volume to be absent
        working-directory: target
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named projection linear-joins PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named projection linear-joins PostgreSQL volume already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" ]]; then
            echo '::error::Private files for the projection linear-joins lab already exist'
            exit 1
          fi
      - name: Start the owned PostgreSQL 17 and Redis lab
        working-directory: target
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_PROJECTION_LINEAR_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh projection linear-joins lab
        working-directory: target
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          corepack pnpm --filter @noisia/db db:smoke:migrations
      - name: Run the exact projection linear-joins oracle cases
        id: oracle
        working-directory: target
        env:
          NOISIA_R16_PROJECTION_LINEAR_JOINS_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
          NOISIA_WORKSPACE_ENGINE_MODULE_ROOT: ${{ github.workspace }}/target/tools/signal-semantic-lab/src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          NUMBA_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          R16_PROJECTION_LINEAR_TAP: ${{ runner.temp }}/r16-projection-linear-joins.tap
        run: |
          set -euo pipefail
          export NOISIA_WORKSPACE_ENGINE_PYTHON="$(command -v python)"
          : > "$R16_PROJECTION_LINEAR_TAP"
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          corepack pnpm exec node --test --test-concurrency=1 \
            --test-name-pattern='^(?:projection linear joins native preserves256keys, Unicode microseconds, byte sentinels, reservations and rights|projection linear joins native preserves awaiting/excluded, H5 precedence and a global byte prefix across pages|projection linear joins native4096 paired RRRO preserves rows and removes both materialized CTE rescans)$' \
            --import tsx infrastructure/db/migrations/signal-listening-projection-linear-joins.postgres.test.ts | tee "$R16_PROJECTION_LINEAR_TAP"
          test_status=${PIPESTATUS[0]}
          set -e
          node - "$R16_PROJECTION_LINEAR_TAP" "$test_status" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const status = Number(process.argv[3]);
          const expected = [
            'projection linear joins native preserves256keys, Unicode microseconds, byte sentinels, reservations and rights',
            'projection linear joins native preserves awaiting/excluded, H5 precedence and a global byte prefix across pages',
            'projection linear joins native4096 paired RRRO preserves rows and removes both materialized CTE rescans',
          ];
          const lines = tap.split(/\r?\n/u);
          const selected = expected.map(title => lines.filter(line => /^ok \d+ - /u.test(line) && line.endsWith(` - ${title}`)));
          if (status !== 0 || selected.some(rows => rows.length !== 1)
              || !/^# tests 3$/mu.test(tap) || !/^# pass 3$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('projection linear-joins TAP must report three exact selected titles, pass=3, fail=0, skipped=0');
          }
          process.stdout.write('projection linear-joins oracle: 3 exact selected cases passed\n');
          NODE
      - name: Ensure projection linear-joins TAP receipt exists
        if: always()
        env:
          R16_PROJECTION_LINEAR_TAP: ${{ runner.temp }}/r16-projection-linear-joins.tap
        run: |
          if [ ! -f "$R16_PROJECTION_LINEAR_TAP" ]; then
            printf '%s\n' 'projection linear-joins oracle gate was not reached' > "$R16_PROJECTION_LINEAR_TAP"
          fi
      - name: Verify projection linear-joins source is unchanged
        id: source_end
        if: always()
        working-directory: target
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R16_PROJECTION_LINEAR_TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_REF"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::projection linear-joins oracle changed the checked out target source tree'
            exit 1
          fi
      - name: Publish exact projection linear-joins evidence
        id: publish
        if: ${{ success() && steps.oracle.outcome == 'success' && steps.source_end.outcome == 'success' }}
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          printf 'selected_pass=3\n' >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$TARGET_REF" >> "$GITHUB_OUTPUT"
      - name: Ensure projection linear-joins receipt exists
        if: always()
        env:
          R16_PROJECTION_LINEAR_TAP: ${{ runner.temp }}/r16-projection-linear-joins.tap
        run: |
          if [ ! -f "$R16_PROJECTION_LINEAR_TAP" ]; then
            printf '%s\n' 'projection linear-joins acceptance was not reached' > "$R16_PROJECTION_LINEAR_TAP"
          fi
      - name: Upload projection linear-joins receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-projection-linear-joins-${{ github.run_id }}
          path: ${{ runner.temp }}/r16-projection-linear-joins.tap
          if-no-files-found: error
          retention-days: 14
      - name: Stop and remove only the owned projection linear-joins lab
        if: ${{ always() && env.R16_PROJECTION_LINEAR_LAB_OWNED == 'true' }}
        working-directory: target
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then scripts/r16/lab-down.sh; fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned projection linear-joins PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned projection linear-joins PostgreSQL volume survived cleanup'
            exit 1
          fi

  statement-shared-wire-acceptance:
    name: R16 statement shared-wire acceptance (fresh isolated lab)
    needs: [raw-acceptance, projection-linear-acceptance]
    if: ${{ always() && inputs.statement_shared_wire_oracle == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      selected_pass: ${{ steps.publish.outputs.selected_pass || '0' }}
      target_sha: ${{ steps.publish.outputs.target_sha || '' }}
    env:
      R16BENCH_RUN_ID: benchmark-pg17
      R16BENCH_SERVICES: postgres,redis
      NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
      DATABASE_SSL: 'false'
    steps:
      - name: Validate statement shared-wire evidence request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          RESERVE_SHARED_SMOKE: ${{ inputs.reserve_shared_smoke || false }}
          PROJECTION_LINEAR_ORACLE: ${{ inputs.projection_linear_oracle || false }}
          TARGET_REF: ${{ inputs.target_ref }}
          RAW_ACCEPTANCE_SELECTED_PASS: ${{ needs.raw-acceptance.outputs.selected_pass || '0' }}
          RAW_ACCEPTANCE_TARGET_SHA: ${{ needs.raw-acceptance.outputs.target_sha || '' }}
          LINEAR_ACCEPTANCE_SELECTED_PASS: ${{ needs.projection-linear-acceptance.outputs.selected_pass || '0' }}
          LINEAR_ACCEPTANCE_TARGET_SHA: ${{ needs.projection-linear-acceptance.outputs.target_sha || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != workflow_dispatch ] \
              || { [ "$MODE" != neutral_only ] && [ "$MODE" != sql_frontier_only ]; } \
              || [ "$RESERVE_SHARED_SMOKE" != true ] || [ "$PROJECTION_LINEAR_ORACLE" != true ] \
              || [ -z "$TARGET_REF" ] || [ "${#TARGET_REF}" -ne 40 ] || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::statement shared-wire acceptance requires manual neutral/SQL mode, RAW and linear opt-ins, and exact target SHA'
            exit 1
          fi
          if [ "$RAW_ACCEPTANCE_SELECTED_PASS" != 6 ] || [ "$RAW_ACCEPTANCE_TARGET_SHA" != "$TARGET_REF" ] \
              || [ "$LINEAR_ACCEPTANCE_SELECTED_PASS" != 3 ] || [ "$LINEAR_ACCEPTANCE_TARGET_SHA" != "$TARGET_REF" ]; then
            echo '::error::statement shared-wire acceptance requires six RAW and three linear passes from the exact target SHA'
            exit 1
          fi
          for name in $(compgen -e); do
            case "$name" in
              *ANTHROPIC*API_KEY*|*ANTHROPIC*TOKEN*|*SONNET*API_KEY*|*SONNET*TOKEN*|*VOYAGE*API_KEY*|*VOYAGE*TOKEN*)
                echo '::error::provider credentials are forbidden in statement shared-wire acceptance'
                exit 1
                ;;
            esac
          done
      - name: Checkout the exact statement shared-wire target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target
      - name: Seal the checked out statement shared-wire source
        id: source_start
        working-directory: target
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$TARGET_REF"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::statement shared-wire target checkout is not clean'
            exit 1
          fi
          if [ ! -f infrastructure/db/migrations/signal-listening-statement-shared-wire.postgres.test.ts ]; then
            echo '::error::statement shared-wire target source is absent'
            exit 1
          fi
          for source_file in \
              infrastructure/db/migrations/0330_signal_listening_statement_shared_wire.sql \
              infrastructure/db/migrations/signal-listening-statement-shared-wire.oracle.ts \
              infrastructure/db/migrations/signal-listening-statement-shared-wire.fixture.ts \
              infrastructure/db/migrations/signal-listening-statement-shared-wire.test.ts; do
            if [ ! -f "$source_file" ]; then
              echo '::error::statement shared-wire target source set is incomplete'
              exit 1
            fi
          done
          printf 'R16_STATEMENT_SHARED_WIRE_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Install frozen target dependencies
        working-directory: target
        run: corepack pnpm install --frozen-lockfile
      - name: Require the owned statement shared-wire container and volume to be absent
        working-directory: target
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::The named statement shared-wire PostgreSQL container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::The named statement shared-wire PostgreSQL volume already exists'
            exit 1
          fi
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -e "$lab_dir/private.env" || -e "$lab_dir/connection.env" ]]; then
            echo '::error::Private files for the statement shared-wire lab already exist'
            exit 1
          fi
      - name: Start the owned PostgreSQL 17 and Redis lab
        working-directory: target
        run: |
          set -euo pipefail
          printf '%s\n' 'R16_STATEMENT_SHARED_WIRE_LAB_OWNED=true' >> "$GITHUB_ENV"
          scripts/r16/lab-up.sh
      - name: Apply migrations to the fresh statement shared-wire lab
        working-directory: target
        env:
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_MFP_PG_CI: 'true'
        run: |
          set -euo pipefail
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          corepack pnpm --filter @noisia/db db:smoke:migrations
      - name: Run exact statement shared-wire oracle cases
        id: oracle
        working-directory: target
        env:
          NOISIA_R16_STATEMENT_SHARED_WIRE_PG: 'true'
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_MASS_LABELING_ENABLED: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
          R16_STATEMENT_SHARED_WIRE_TAP: ${{ runner.temp }}/r16-statement-shared-wire.tap
        run: |
          set -euo pipefail
          : > "$R16_STATEMENT_SHARED_WIRE_TAP"
          connection_file=.data/piloto-masivo/r16/labs/benchmark-pg17/connection.env
          test -f "$connection_file"
          set -a
          source "$connection_file"
          set +a
          export DATABASE_SSL=false
          export NOISIA_R16_LOCAL_PG_LAB=r16-benchmark-pg17
          set +e
          corepack pnpm exec node --test --test-concurrency=1 \
            --test-name-pattern='^(?:0330 native same-snapshot validators preserve32shapes256keys UTF8 precision and mixed-wire fallback|0330 native reserve Mark bad-mixed rollback and deferred pre-owner forged hash stay enforced|0330 native real prior unknown is true and target ownership never becomes a cached authority|0330 preserves answer BEFORE attempts including conflict-suppressed bad tuples and native source bytes|0330 native DML ABBA keeps full guards and fresh transactions and rejects expiry with atomic rollback)$' \
            --import tsx infrastructure/db/migrations/signal-listening-statement-shared-wire.postgres.test.ts | tee "$R16_STATEMENT_SHARED_WIRE_TAP"
          test_status=${PIPESTATUS[0]}
          set -e
          node - "$R16_STATEMENT_SHARED_WIRE_TAP" "$test_status" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const status = Number(process.argv[3]);
          const expected = [
            '0330 native same-snapshot validators preserve32shapes256keys UTF8 precision and mixed-wire fallback',
            '0330 native reserve Mark bad-mixed rollback and deferred pre-owner forged hash stay enforced',
            '0330 native real prior unknown is true and target ownership never becomes a cached authority',
            '0330 preserves answer BEFORE attempts including conflict-suppressed bad tuples and native source bytes',
            '0330 native DML ABBA keeps full guards and fresh transactions and rejects expiry with atomic rollback',
          ];
          const lines = tap.split(/\r?\n/u);
          const selected = expected.map(title => lines.filter(line => /^ok \d+ - /u.test(line) && line.endsWith(` - ${title}`)));
          if (status !== 0 || selected.some(rows => rows.length !== 1)
              || !/^# tests 5$/mu.test(tap) || !/^# pass 5$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('statement shared-wire TAP must report five exact selected titles, pass=5, fail=0, skipped=0');
          }
          process.stdout.write('statement shared-wire oracle: five exact selected cases passed\n');
          NODE
          printf 'selected_pass=5\n' >> "$GITHUB_OUTPUT"
      - name: Ensure statement shared-wire TAP receipt exists
        if: always()
        env:
          R16_STATEMENT_SHARED_WIRE_TAP: ${{ runner.temp }}/r16-statement-shared-wire.tap
        run: |
          if [ ! -f "$R16_STATEMENT_SHARED_WIRE_TAP" ]; then
            printf '%s\n' 'statement shared-wire gate was not reached' > "$R16_STATEMENT_SHARED_WIRE_TAP"
          fi
      - name: Verify statement shared-wire source remained unchanged
        id: source_end
        if: always()
        working-directory: target
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R16_STATEMENT_SHARED_WIRE_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_REF"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::statement shared-wire oracle changed the checked out target source'
            exit 1
          fi
      - name: Publish exact statement shared-wire evidence
        id: publish
        if: ${{ success() && steps.oracle.outcome == 'success' && steps.source_end.outcome == 'success' }}
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          printf 'selected_pass=5\n' >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$TARGET_REF" >> "$GITHUB_OUTPUT"
      - name: Upload statement shared-wire TAP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-statement-shared-wire-${{ github.run_id }}
          path: ${{ runner.temp }}/r16-statement-shared-wire.tap
          if-no-files-found: error
          retention-days: 14
      - name: Stop and remove only the owned statement shared-wire lab
        if: ${{ always() && env.R16_STATEMENT_SHARED_WIRE_LAB_OWNED == 'true' }}
        working-directory: target
        run: |
          set -euo pipefail
          lab_dir=.data/piloto-masivo/r16/labs/benchmark-pg17
          if [[ -f "$lab_dir/private.env" ]]; then
            scripts/r16/lab-down.sh
          fi
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::Owned statement shared-wire PostgreSQL container survived cleanup'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::Owned statement shared-wire PostgreSQL volume survived cleanup'
            exit 1
          fi

  listening-small:
    name: listening-small-${{ matrix.label }}
    needs: [raw-acceptance, projection-linear-acceptance, statement-shared-wire-acceptance]
    if: ${{ always() && needs.raw-acceptance.result == 'success' && (inputs.projection_linear_oracle != true || needs.projection-linear-acceptance.result == 'success' || needs.projection-linear-acceptance.result == 'skipped') && (inputs.statement_shared_wire_oracle != true || needs.statement-shared-wire-acceptance.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        label: ${{ (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') && fromJSON('["candidate"]') || fromJSON('["baseline-32f","candidate"]') }}
    steps:
      - name: Checkout benchmark target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.label == 'candidate' && (inputs.target_ref || github.sha) || '32f40ec89a21da90235c3589a4820ae05dedf6fc' }}
          path: target

      - name: Checkout diagnostic harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: probe
          sparse-checkout: |
            .github/workflows/r16-listening-small-diagnostic.yml
            .github/workflows/mfp-postgres.yml
            scripts/r16-diagnostics/listening-small
          sparse-checkout-cone-mode: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Install target dependencies
        working-directory: target
        run: corepack pnpm install --frozen-lockfile

      - name: Run pure diagnostic guard tests
        working-directory: target
        env:
          R16_DIAGNOSTIC_TARGET_ROOT: ${{ github.workspace }}/target
        run: corepack pnpm exec tsx --test ../probe/scripts/r16-diagnostics/listening-small/run.test.mts

      - name: Validate neutral target binding
        if: inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only'
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: test "${#TARGET_REF}" = 40 && [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Validate resource profile selection
        env:
          MODE: ${{ inputs.mode || 'legacy' }}
          RESOURCE_PROFILE: ${{ inputs.resource_profile || 'baseline_512m' }}
          RESERVE_SHARED_SMOKE: ${{ inputs.reserve_shared_smoke || false }}
          CAPTURE_PROJECTION_PLAN: ${{ inputs.capture_projection_plan || false }}
          PROJECTION_LINEAR_ORACLE: ${{ inputs.projection_linear_oracle || false }}
          STATEMENT_SHARED_WIRE_ORACLE: ${{ inputs.statement_shared_wire_oracle || false }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_ROOT: ${{ github.workspace }}/target
          RAW_ACCEPTANCE_SELECTED_PASS: ${{ needs.raw-acceptance.outputs.selected_pass || '0' }}
          RAW_ACCEPTANCE_TARGET_SHA: ${{ needs.raw-acceptance.outputs.target_sha || '' }}
          LINEAR_ACCEPTANCE_SELECTED_PASS: ${{ needs.projection-linear-acceptance.outputs.selected_pass || '0' }}
          LINEAR_ACCEPTANCE_TARGET_SHA: ${{ needs.projection-linear-acceptance.outputs.target_sha || '' }}
          STATEMENT_SHARED_WIRE_SELECTED_PASS: ${{ needs.statement-shared-wire-acceptance.outputs.selected_pass || '0' }}
          STATEMENT_SHARED_WIRE_TARGET_SHA: ${{ needs.statement-shared-wire-acceptance.outputs.target_sha || '' }}
        run: |
          set -euo pipefail
          case "$RESOURCE_PROFILE" in
            baseline_512m) ;;
            bounded_2g)
              test "$MODE" = neutral_only -o "$MODE" = sql_frontier_only
              test "$EVENT_NAME" = workflow_dispatch
              ;;
            *) echo '::error::unknown diagnostic resource profile'; exit 1 ;;
          esac
          if [ "$MODE" = sql_frontier_only ] && {
            [ "$EVENT_NAME" != workflow_dispatch ] || [ -z "$TARGET_REF" ] || [ "${#TARGET_REF}" -ne 40 ] || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]];
          }; then
            echo '::error::sql_frontier_only requires a manual dispatch and an explicit 40-character target SHA'
            exit 1
          fi
          if [ "$CAPTURE_PROJECTION_PLAN" = true ] \
              && { [ "$MODE" != sql_frontier_only ] || [ "$EVENT_NAME" != workflow_dispatch ] \
                || [ "$RESERVE_SHARED_SMOKE" != true ] || [ -z "$TARGET_REF" ] \
                || [ "${#TARGET_REF}" -ne 40 ] || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; }; then
            echo '::error::projection plan capture requires manual SQL frontier mode, exact target SHA and reserve_shared_smoke'
            exit 1
          fi
          if [ "$PROJECTION_LINEAR_ORACLE" = true ]; then
            if { [ "$MODE" != neutral_only ] && [ "$MODE" != sql_frontier_only ]; } \
                || [ "$EVENT_NAME" != workflow_dispatch ] || [ "$RESERVE_SHARED_SMOKE" != true ] \
                || [ -z "$TARGET_REF" ] || [ "${#TARGET_REF}" -ne 40 ] \
                || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::projection linearity oracle requires a manual neutral or SQL diagnostic, shared smoke and exact target SHA'
              exit 1
            fi
            if [ "$LINEAR_ACCEPTANCE_SELECTED_PASS" != 3 ] || [ "$LINEAR_ACCEPTANCE_TARGET_SHA" != "$TARGET_REF" ]; then
              echo '::error::projection linearity oracle requires three passing cases from the exact target SHA'
              exit 1
            fi
          fi
          if [ "$RESERVE_SHARED_SMOKE" = true ]; then
            if { [ "$MODE" != neutral_only ] && [ "$MODE" != sql_frontier_only ]; } || [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo '::error::reserve_shared_smoke requires a manual neutral_only or sql_frontier_only run'
              exit 1
            fi
            if [ "$RAW_ACCEPTANCE_SELECTED_PASS" != 6 ] || [ -z "$TARGET_REF" ] \
                || [ "$RAW_ACCEPTANCE_TARGET_SHA" != "$TARGET_REF" ] \
                || [ "${#TARGET_REF}" -ne 40 ] || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::reserve_shared_smoke requires six passing RAW acceptance cases from the exact target SHA'
              exit 1
            fi
          fi
          case "$STATEMENT_SHARED_WIRE_ORACLE" in
            true|false) ;;
            *) echo '::error::statement shared-wire oracle flag must be true or false'; exit 1 ;;
          esac
          statement_sources=(
            "$TARGET_ROOT/infrastructure/db/migrations/0330_signal_listening_statement_shared_wire.sql"
            "$TARGET_ROOT/infrastructure/db/migrations/signal-listening-statement-shared-wire.oracle.ts"
            "$TARGET_ROOT/infrastructure/db/migrations/signal-listening-statement-shared-wire.fixture.ts"
            "$TARGET_ROOT/infrastructure/db/migrations/signal-listening-statement-shared-wire.postgres.test.ts"
            "$TARGET_ROOT/infrastructure/db/migrations/signal-listening-statement-shared-wire.test.ts"
          )
          statement_source_count=0
          for source_file in "${statement_sources[@]}"; do
            if [ -f "$source_file" ]; then statement_source_count=$((statement_source_count + 1)); fi
          done
          if [ "$statement_source_count" -gt 0 ] || [ "$STATEMENT_SHARED_WIRE_ORACLE" = true ]; then
            if { [ "$STATEMENT_SHARED_WIRE_ORACLE" != true ] \
                || { [ "$MODE" != neutral_only ] && [ "$MODE" != sql_frontier_only ]; } \
                || [ "$EVENT_NAME" != workflow_dispatch ] || [ "$RESERVE_SHARED_SMOKE" != true ] \
                || [ "$PROJECTION_LINEAR_ORACLE" != true ] || [ "$STATEMENT_SHARED_WIRE_SELECTED_PASS" != 5 ] \
                || [ "$statement_source_count" -ne "${#statement_sources[@]}" ] \
                || [ -z "$TARGET_REF" ] || [ "${#TARGET_REF}" -ne 40 ] \
                || [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]] \
                || [ "$STATEMENT_SHARED_WIRE_TARGET_SHA" != "$TARGET_REF" ] \
                || [ "$RAW_ACCEPTANCE_SELECTED_PASS" != 6 ] || [ "$RAW_ACCEPTANCE_TARGET_SHA" != "$TARGET_REF" ] \
                || [ "$LINEAR_ACCEPTANCE_SELECTED_PASS" != 3 ] || [ "$LINEAR_ACCEPTANCE_TARGET_SHA" != "$TARGET_REF" ]; }; then
              echo '::error::0330 source requires five statement shared-wire passes plus RAW and projection gates on the exact target SHA'
              exit 1
            fi
          fi

      - name: Allocate owned PG17 and Redis lab
        working-directory: target
        env:
          R16BENCH_RUN_ID: benchmark-pg17
          R16BENCH_SERVICES: postgres,redis
        run: |
          set -euo pipefail
          if docker inspect r16-benchmark-pg17 >/dev/null 2>&1; then
            echo '::error::owned PG container already exists'
            exit 1
          fi
          if docker volume inspect r16bench-benchmark-pg17_postgres-data >/dev/null 2>&1; then
            echo '::error::owned PG volume already exists'
            exit 1
          fi
          scripts/r16/lab-up.sh

      - name: Apply migrations, focused oracle, and native diagnostic
        id: native_diagnostic
        working-directory: target
        env:
          R16BENCH_RUN_ID: benchmark-pg17
          NOISIA_R16_LOCAL_PG_LAB: r16-benchmark-pg17
          NOISIA_R16_NATIVE_FIXTURE_PG: 'true'
          NOISIA_R16_SMALL_DIAGNOSTIC: 'true'
          NOISIA_R16_LISTENING_DML_PLAN_PG: ${{ inputs.mode == 'neutral_only' && 'false' || 'true' }}
          R16_DIAGNOSTIC_MODE: ${{ inputs.mode || 'legacy' }}
          R16_DIAGNOSTIC_CAPTURE_PROJECTION_PLAN: ${{ inputs.capture_projection_plan && 'true' || 'false' }}
          R16_DIAGNOSTIC_PROJECTION_LINEAR_ORACLE: ${{ inputs.projection_linear_oracle && 'true' || 'false' }}
          R16_DIAGNOSTIC_STATEMENT_SHARED_WIRE_ORACLE: ${{ inputs.statement_shared_wire_oracle && 'true' || 'false' }}
          RESERVE_SHARED_SMOKE: ${{ inputs.reserve_shared_smoke || false }}
          RAW_ACCEPTANCE_SELECTED_PASS: ${{ needs.raw-acceptance.outputs.selected_pass || '0' }}
          RAW_ACCEPTANCE_TARGET_SHA: ${{ needs.raw-acceptance.outputs.target_sha || '' }}
          LINEAR_ACCEPTANCE_SELECTED_PASS: ${{ needs.projection-linear-acceptance.outputs.selected_pass || '0' }}
          LINEAR_ACCEPTANCE_TARGET_SHA: ${{ needs.projection-linear-acceptance.outputs.target_sha || '' }}
          STATEMENT_SHARED_WIRE_SELECTED_PASS: ${{ needs.statement-shared-wire-acceptance.outputs.selected_pass || '0' }}
          STATEMENT_SHARED_WIRE_TARGET_SHA: ${{ needs.statement-shared-wire-acceptance.outputs.target_sha || '' }}
          NOISIA_DB_SMOKE_ALLOW_REMOTE: 'false'
          NOISIA_DB_SMOKE_RESET_SCHEMA: 'true'
          NOISIA_DB_SMOKE_EMULATE_SUPABASE_ROLES: 'true'
          NOISIA_SIGNAL_LISTENING_ENABLED: 'true'
          NOISIA_JEV_PROVIDER_ENABLED: 'true'
          NOISIA_JEV_STREAMING_V2_ENABLED: 'true'
          NOISIA_R16_LISTENING_MONEY_BATCHES_PG: ${{ inputs.reserve_shared_smoke && 'true' || 'false' }}
          NOISIA_R16_RAW_PAGE_LOCKS_PG: ${{ inputs.reserve_shared_smoke && 'true' || 'false' }}
          NOISIA_R16_INPUT_BOUNDS_PG: ${{ inputs.reserve_shared_smoke && 'true' || 'false' }}
          NOISIA_R16_LISTENING_SECOND_SHAPE_PG: ${{ inputs.reserve_shared_smoke && 'true' || 'false' }}
          NOISIA_JEV_STREAM_MAX_IN_FLIGHT: ${{ inputs.resource_profile == 'bounded_2g' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') && '4096' || '1024' }}
          NOISIA_JEV_STREAM_BUFFER_BYTES: ${{ inputs.resource_profile == 'bounded_2g' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') && '2147483648' || '536870912' }}
          NOISIA_JEV_STREAM_FLUSH_SIZE: ${{ inputs.resource_profile == 'bounded_2g' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') && '4096' || '1024' }}
          NOISIA_JEV_STREAM_MAX_FLUSHES: '2'
          NOISIA_JEV_STREAM_FLUSH_INTERVAL_MS: ${{ inputs.resource_profile == 'bounded_2g' && (inputs.mode == 'neutral_only' || inputs.mode == 'sql_frontier_only') && '1000' || '250' }}
          NOISIA_JEV_STREAM_WINDOW_SIZE: '4096'
          R16_DIAGNOSTIC_RESOURCE_PROFILE: ${{ inputs.resource_profile || 'baseline_512m' }}
          NOISIA_MASS_LABELING_ENABLED: 'true'
          R16_DIAGNOSTIC_TARGET_ROOT: ${{ github.workspace }}/target
          R16_DIAGNOSTIC_PROBE_ROOT: ${{ github.workspace }}/probe
          R16_DIAGNOSTIC_ARTIFACT: ${{ github.workspace }}/artifacts/r16-listening-small/result.json
          R16_DIAGNOSTIC_CPU_PROFILE_DIR: ${{ github.workspace }}/artifacts/r16-listening-small/cpu-profile-${{ matrix.label }}
          R16_MONEY_ORACLE_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/money-validator-oracle.tap
          R16_ACTOR_RUNTIME_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/actor-query-runtime.tap
          R16_PAGE_FENCES_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-page-fences.tap
          R16_READER_SEMANTICS_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-reader-semantics.tap
          R16_INITIAL_RECOVERY_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/listening-initial-recovery.tap
          R16_RESERVE_MONEY_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/reserve-shared-money.tap
          R16_RESERVE_RAW_PAGE_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/reserve-shared-raw-page.tap
          R16_RESERVE_INPUT_CONTRACTS_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/reserve-shared-input-contracts.tap
          R16_DIAGNOSTIC_TARGET_LABEL: ${{ matrix.label }}
          R16_DIAGNOSTIC_TARGET_REF_REQUESTED: ${{ matrix.label == 'candidate' && (inputs.target_ref || github.sha) || '32f40ec89a21da90235c3589a4820ae05dedf6fc' }}
          R16_DIAGNOSTIC_PROBE_REF_REQUESTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          lab_dir="$GITHUB_WORKSPACE/target/.data/piloto-masivo/r16/labs/benchmark-pg17"
          cleanup() {
            if [ -d "$GITHUB_WORKSPACE/target" ]; then
              (cd "$GITHUB_WORKSPACE/target" && R16BENCH_RUN_ID=benchmark-pg17 scripts/r16/lab-down.sh) >/dev/null 2>&1 || true
            fi
            if [ ! -f "$R16_DIAGNOSTIC_ARTIFACT" ]; then
              mkdir -p "$(dirname "$R16_DIAGNOSTIC_ARTIFACT")"
              printf '%s\n' '{"contract_version":"r16-listening-small-diagnostic-v1","diagnostic_only":true,"h1_accepted":false,"status":"failed_before_runner"}' > "$R16_DIAGNOSTIC_ARTIFACT"
            fi
          }
          trap cleanup EXIT
          set -a
          source "$lab_dir/connection.env"
          set +a
          export DATABASE_SSL=false
          corepack pnpm --filter @noisia/db db:smoke:migrations
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_MONEY_ORACLE_TAP")"
            set +e
            timeout 4m env NOISIA_R16_LISTENING_MONEY_BATCHES_PG=true corepack pnpm exec tsx --test \
              --test-name-pattern='^selected materialization and full join match old validators and atomically reject forged siblings$' \
              --test-concurrency=1 infrastructure/db/migrations/signal-listening-money-batches.postgres.test.ts \
              > "$R16_MONEY_ORACLE_TAP" 2>&1
            oracle_status=$?
            set -e
            if [ "$oracle_status" -ne 0 ]; then
              cat "$R16_MONEY_ORACLE_TAP"
              exit "$oracle_status"
            fi
            node - "$R16_MONEY_ORACLE_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const title = 'selected materialization and full join match old validators and atomically reject forged siblings';
          const selected = tap.split(/\r?\n/u).filter((line) => /^ok \d+ - /.test(line) && line.endsWith(title));
          if (selected.length !== 1 || /^ok \d+ - .*# SKIP/u.test(selected[0])) {
            throw new Error('focused native oracle did not report exactly one executed passing test');
          }
          if (!/^# pass 1$/mu.test(tap) || !/^# fail 0$/mu.test(tap)) {
            throw new Error('focused native oracle TAP must report pass 1 and fail 0');
          }
          process.stdout.write('focused native oracle: pass=1 fail=0 (other tests intentionally unselected)\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_ACTOR_RUNTIME_TAP")"
            set +e
            timeout 4m env NOISIA_R16_ACTOR_QUERY_RUNTIME_PG=true corepack pnpm exec tsx --test --test-concurrency=1 \
              infrastructure/db/migrations/signal-processing-actor-query-runtime.postgres.test.ts \
              > "$R16_ACTOR_RUNTIME_TAP" 2>&1
            actor_status=$?
            set -e
            if [ "$actor_status" -ne 0 ]; then
              cat "$R16_ACTOR_RUNTIME_TAP"
              exit "$actor_status"
            fi
            node - "$R16_ACTOR_RUNTIME_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          if (!/^# tests 3$/mu.test(tap) || !/^# pass 3$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('actor query runtime TAP must report tests=3 pass=3 fail=0 skipped=0');
          }
          process.stdout.write('actor query runtime: tests=3 pass=3 fail=0 skipped=0\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_PAGE_FENCES_TAP")"
            set +e
            timeout 4m env NOISIA_R16_LISTENING_MONEY_BATCHES_PG=true corepack pnpm exec tsx --test \
              --test-name-pattern='^native Listening page fence ' \
              --test-concurrency=1 infrastructure/db/migrations/signal-listening-money-batches.postgres.test.ts \
              > "$R16_PAGE_FENCES_TAP" 2>&1
            fence_status=$?
            set -e
            if [ "$fence_status" -ne 0 ]; then
              cat "$R16_PAGE_FENCES_TAP"
              exit "$fence_status"
            fi
            node - "$R16_PAGE_FENCES_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const selected = tap.split(/\r?\n/u).filter((line) => /^ok \d+ - native Listening page fence /u.test(line));
          if (selected.length !== 10 || selected.some((line) => /# SKIP/u.test(line))
              || !/^# pass 10$/mu.test(tap) || !/^# fail 0$/mu.test(tap)) {
            throw new Error('Listening page fence TAP must report exactly ten executed passing selected cases');
          }
          process.stdout.write('Listening page fences: pass=10 fail=0 (other tests intentionally unselected)\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_READER_SEMANTICS_TAP")"
            set +e
            timeout 4m env NOISIA_R16_LISTENING_BOUNDED_CUSTOM_PLAN_PG=true corepack pnpm exec tsx --test --test-concurrency=1 \
              infrastructure/db/migrations/signal-listening-bounded-custom-plan.postgres.test.ts \
              > "$R16_READER_SEMANTICS_TAP" 2>&1
            reader_status=$?
            set -e
            if [ "$reader_status" -ne 0 ]; then
              cat "$R16_READER_SEMANTICS_TAP"
              exit "$reader_status"
            fi
            node - "$R16_READER_SEMANTICS_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          if (!/^# tests 3$/mu.test(tap) || !/^# pass 3$/mu.test(tap)
              || !/^# fail 0$/mu.test(tap) || !/^# skipped 0$/mu.test(tap)) {
            throw new Error('Listening reader semantics TAP must report tests=3 pass=3 fail=0 skipped=0');
          }
          process.stdout.write('Listening reader semantics: tests=3 pass=3 fail=0 skipped=0\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_TARGET_LABEL" = candidate ]; then
            mkdir -p "$(dirname "$R16_INITIAL_RECOVERY_TAP")"
            set +e
            timeout 4m env NOISIA_R16_DISCOVERY_INITIAL_PG=true corepack pnpm exec tsx --test \
              --test-name-pattern='^initial unknown ' --test-concurrency=1 \
              infrastructure/db/migrations/signal-listening-discovery-initial.postgres.test.ts \
              > "$R16_INITIAL_RECOVERY_TAP" 2>&1
            recovery_status=$?
            set -e
            if [ "$recovery_status" -ne 0 ]; then
              cat "$R16_INITIAL_RECOVERY_TAP"
              exit "$recovery_status"
            fi
            node - "$R16_INITIAL_RECOVERY_TAP" <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.argv[2], 'utf8');
          const selected = tap.split(/\r?\n/u).filter((line) => /^ok \d+ - initial unknown /u.test(line));
          if (selected.length !== 2 || selected.some((line) => /# SKIP/u.test(line))
              || !/^# pass 2$/mu.test(tap) || !/^# fail 0$/mu.test(tap)) {
            throw new Error('Listening initial recovery TAP must report exactly two executed passing selected cases');
          }
          process.stdout.write('Listening initial recovery: pass=2 fail=0 (other tests intentionally unselected)\n');
          NODE
          fi
          if { [ "$R16_DIAGNOSTIC_MODE" = neutral_only ] || [ "$R16_DIAGNOSTIC_MODE" = sql_frontier_only ]; } \
              && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
              && [ "${{ inputs.reserve_shared_smoke }}" = true ]; then
            mkdir -p "$(dirname "$R16_RESERVE_MONEY_TAP")" "$(dirname "$R16_RESERVE_RAW_PAGE_TAP")" \
              "$(dirname "$R16_RESERVE_INPUT_CONTRACTS_TAP")"
            set +e
            timeout 12m corepack pnpm exec node --test --test-name-pattern='^(?:native Listening reserve commits while disjoint (?:raw|apply) retains its real run SHARE fence|native Listening concurrent reserve cap one call (?:replays the same identity once|rejects a different identity atomically)|native Listening reserve replay preserves unknown custody and prior uncertainty blocks a new run|native Listening without RAW pages retains the default reservation cursor and exclusive run fence)$' \
              --test-concurrency=1 --import tsx infrastructure/db/migrations/signal-listening-money-batches.postgres.test.ts \
              > "$R16_RESERVE_MONEY_TAP" 2>&1
            reserve_money_status=$?
            timeout 12m corepack pnpm exec node --test --test-name-pattern='^(?:generic mass labeling with RAW pages retains its default reservation cursor|RAW attachment locks UUID order before a blocked last member and leaves disjoint calls compatible)$' \
              --test-concurrency=1 --import tsx infrastructure/db/migrations/signal-labeling-raw-page-locks.postgres.test.ts \
              > "$R16_RESERVE_RAW_PAGE_TAP" 2>&1
            reserve_raw_status=$?
            set -e
            node - "$R16_RESERVE_MONEY_TAP" "$reserve_money_status" "$R16_RESERVE_RAW_PAGE_TAP" "$reserve_raw_status" <<'NODE'
          const fs = require('node:fs');
          const groups = [
            {file: process.argv[2], status: Number(process.argv[3]), expected: [
              'native Listening reserve commits while disjoint raw retains its real run SHARE fence',
              'native Listening reserve commits while disjoint apply retains its real run SHARE fence',
              'native Listening concurrent reserve cap one call replays the same identity once',
              'native Listening concurrent reserve cap one call rejects a different identity atomically',
              'native Listening reserve replay preserves unknown custody and prior uncertainty blocks a new run',
              'native Listening without RAW pages retains the default reservation cursor and exclusive run fence',
            ]},
            {file: process.argv[4], status: Number(process.argv[5]), expected: [
              'generic mass labeling with RAW pages retains its default reservation cursor',
              'RAW attachment locks UUID order before a blocked last member and leaves disjoint calls compatible',
            ]},
          ];
          for (const group of groups) {
            if (group.status !== 0) throw new Error('reserve shared smoke test command failed');
            const lines = fs.readFileSync(group.file, 'utf8').split(/\r?\n/u);
            const selected = new Map();
            for (const line of lines) {
              const match = /^ok \d+ - (.*)$/u.exec(line);
              if (!match) continue;
              const title = match[1].replace(/ # SKIP(?: .*)?$/u, '');
              if (group.expected.includes(title)) selected.set(title, [...(selected.get(title) ?? []), line]);
            }
            if (selected.size !== group.expected.length || group.expected.some(title => {
              const rows = selected.get(title) ?? [];
              return rows.length !== 1 || !rows[0].endsWith(` - ${title}`);
            })) throw new Error('reserve shared smoke TAP did not report each exact selected title once as passing');
          }
          process.stdout.write('reserve shared smoke: 8 exact selected PostgreSQL cases passed\n');
          NODE

            set +e
            timeout 12m corepack pnpm exec node --test --test-name-pattern='^(native Listening reader bounds questions and text before hydrating an input|bounded Listening projection preserves 256 native keys, Unicode wire bytes and source timestamp microseconds|lazy native selector matches full oracle across empty slices, base reclassification, exact reservations, rights and byte prefixes|lazy native selector preserves frozen human topic decisions and cached source privacy|native existing consumer profile extends an absent base-plan Map with exact verified32 source identities and no provider attempt)$' \
              --test-concurrency=1 --import tsx infrastructure/db/migrations/signal-listening-input-bounds.postgres.test.ts \
              infrastructure/db/migrations/signal-listening-input-lazy-equivalence.postgres.test.ts \
              services/workers/src/workers/signal-listening-calibration-second-shape.postgres.test.ts \
              > "$R16_RESERVE_INPUT_CONTRACTS_TAP" 2>&1
            reserve_input_status=$?
            set -e
            node - "$R16_RESERVE_INPUT_CONTRACTS_TAP" "$reserve_input_status" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2], status = Number(process.argv[3]);
          const expected = [
            'native Listening reader bounds questions and text before hydrating an input',
            'bounded Listening projection preserves 256 native keys, Unicode wire bytes and source timestamp microseconds',
            'lazy native selector matches full oracle across empty slices, base reclassification, exact reservations, rights and byte prefixes',
            'lazy native selector preserves frozen human topic decisions and cached source privacy',
            'native existing consumer profile extends an absent base-plan Map with exact verified32 source identities and no provider attempt',
          ];
          const selected = new Map();
          for (const line of fs.readFileSync(file, 'utf8').split(/\r?\n/u)) {
            const match = /^ok \d+ - (.*)$/u.exec(line);
            if (!match) continue;
            const title = match[1].replace(/ # SKIP(?: .*)?$/u, '');
            if (expected.includes(title)) selected.set(title, [...(selected.get(title) ?? []), line]);
          }
          if (status !== 0 || selected.size !== expected.length || expected.some(title => {
            const rows = selected.get(title) ?? [];
            return rows.length !== 1 || !rows[0].endsWith(` - ${title}`) || /# SKIP/u.test(rows[0]);
          }) || !/^# tests 5$/mu.test(fs.readFileSync(file, 'utf8'))
              || !/^# pass 5$/mu.test(fs.readFileSync(file, 'utf8'))
              || !/^# fail 0$/mu.test(fs.readFileSync(file, 'utf8'))
              || !/^# skipped 0$/mu.test(fs.readFileSync(file, 'utf8'))) {
            throw new Error('Listening input contract TAP must report five exact selected titles, pass=5, fail=0, skipped=0');
          }
          process.stdout.write('Listening input contracts: 5 exact selected PostgreSQL cases passed\n');
          NODE
          fi
          if [ "$R16_DIAGNOSTIC_MODE" != legacy ]; then
            timeout 10m corepack pnpm exec node --import tsx \
              ../probe/scripts/r16-diagnostics/listening-small/run.mts --run
          else
          mkdir -p "$R16_DIAGNOSTIC_CPU_PROFILE_DIR"
          timeout 10m corepack pnpm exec node --cpu-prof --cpu-prof-interval=1000 \
            --cpu-prof-dir="$R16_DIAGNOSTIC_CPU_PROFILE_DIR" --import tsx \
            ../probe/scripts/r16-diagnostics/listening-small/run.mts --run
          corepack pnpm exec node --import tsx --input-type=module - \
            "$R16_DIAGNOSTIC_CPU_PROFILE_DIR" "$R16_DIAGNOSTIC_ARTIFACT" "$R16_DIAGNOSTIC_PROBE_ROOT" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          const dir = process.argv[2];
          const artifact = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const probe = process.argv[4];
          const {cpuProfileIdentityV1, cpuProfileRangeV1} = await import(pathToFileURL(
            path.join(probe, 'scripts/r16-diagnostics/listening-small/run.mts')).href);
          const entries = fs.readdirSync(dir);
          const names = entries.filter((name) => name.endsWith('.cpuprofile'));
          if (names.length !== entries.length) throw new Error('unexpected artifact type in CPU profile directory');
          const mainPid = artifact.cpu_profile?.main_process_pid;
          const samplerPid = artifact.cpu_profile?.sampler_process_pid;
          if (!Number.isSafeInteger(mainPid) || !Number.isSafeInteger(samplerPid) || mainPid === samplerPid) {
            throw new Error('CPU profile process identities missing');
          }
          if (!names.length || names.length > 16) throw new Error('CPU profile count outside bound');
          let total = 0;
          const profiles = names.map((name) => {
            const full = path.join(dir, name);
            const size = fs.statSync(full).size;
            total += size;
            if (size <= 0 || size > 32 * 1024 * 1024) throw new Error('CPU profile exceeds per-file size bound');
            const profile = JSON.parse(fs.readFileSync(full, 'utf8'));
            const identity = cpuProfileIdentityV1(name, mainPid, samplerPid);
            const range = cpuProfileRangeV1(profile);
            return {...identity, size_bytes: size, ...range};
          });
          if (total > 64 * 1024 * 1024) throw new Error('CPU profile aggregate size bound exceeded');
          const pairs = new Set(profiles.map((profile) => `${profile.pid}:${profile.tid}`));
          if (pairs.size !== profiles.length) throw new Error('duplicate CPU profile thread identity');
          for (const [pid, role] of [[mainPid, 'runner'], [samplerPid, 'sampler']]) {
            if (!profiles.some((profile) => profile.pid === pid && profile.tid === 0 && profile.role === role)) {
              throw new Error('main-thread CPU profile missing');
            }
          }
          fs.writeFileSync(path.join(dir, 'manifest.json'), JSON.stringify({
            diagnostic_only: true, h1_accepted: false, profiler: 'node_cpu_prof', interval_us: 1000,
            capacity_claim: false, overhead_measured: false, max_file_bytes: 32 * 1024 * 1024,
            max_total_bytes: 64 * 1024 * 1024, max_profile_count: 16, total_bytes: total,
            v8_clock_units: 'microseconds', classification_profile_overlap: 'unknown_clock_bridge', profiles,
          }, null, 2) + '\n', {mode: 0o600});
          process.stdout.write(`bounded CPU profiles: count=${profiles.length} total_bytes=${total}\n`);
          NODE
          fi

      - name: Upload CPU profiles
        if: always() && steps.native_diagnostic.outcome == 'success' && (inputs.mode == '' || inputs.mode == 'legacy')
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-cpu-profile-${{ matrix.label }}-${{ github.run_id }}
          path: artifacts/r16-listening-small/cpu-profile-${{ matrix.label }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Ensure sanitized artifact exists
        if: always()
        env:
          R16_DIAGNOSTIC_ARTIFACT: ${{ github.workspace }}/artifacts/r16-listening-small/result.json
        run: |
          if [ ! -f "$R16_DIAGNOSTIC_ARTIFACT" ]; then
            mkdir -p "$(dirname "$R16_DIAGNOSTIC_ARTIFACT")"
            printf '%s\n' '{"contract_version":"r16-listening-small-diagnostic-v1","diagnostic_only":true,"h1_accepted":false,"status":"failed_before_runner"}' > "$R16_DIAGNOSTIC_ARTIFACT"
          fi

      - name: Upload synthetic aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-${{ matrix.label }}-${{ github.run_id }}
          path: artifacts/r16-listening-small/result.json
          if-no-files-found: error
          retention-days: 14

      - name: Ensure reserve shared smoke TAP artifacts exist
        if: always() && inputs.reserve_shared_smoke == true
        env:
          R16_RESERVE_MONEY_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/reserve-shared-money.tap
          R16_RESERVE_RAW_PAGE_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/reserve-shared-raw-page.tap
          R16_RESERVE_INPUT_CONTRACTS_TAP: ${{ github.workspace }}/artifacts/r16-listening-small/reserve-shared-input-contracts.tap
        run: |
          for tap in "$R16_RESERVE_MONEY_TAP" "$R16_RESERVE_RAW_PAGE_TAP" "$R16_RESERVE_INPUT_CONTRACTS_TAP"; do
            if [ ! -f "$tap" ]; then
              mkdir -p "$(dirname "$tap")"
              printf '%s\n' 'native PostgreSQL smoke gate was not reached' > "$tap"
            fi
          done

      - name: Upload reserve shared smoke TAP artifacts
        if: always() && inputs.reserve_shared_smoke == true
        uses: actions/upload-artifact@v4
        with:
          name: r16-listening-small-reserve-shared-${{ github.run_id }}
          path: |
            artifacts/r16-listening-small/reserve-shared-money.tap
            artifacts/r16-listening-small/reserve-shared-raw-page.tap
            artifacts/r16-listening-small/reserve-shared-input-contracts.tap
          if-no-files-found: error
          retention-days: 14

      - name: Ensure focused validator TAP artifact exists
