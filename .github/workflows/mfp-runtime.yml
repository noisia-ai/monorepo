name: MFP runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-hex product commit to build and verify
        required: true
        type: string
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/mfp-runtime.yml'
      - 'scripts/dev-corpus/Dockerfile*'
      - 'scripts/dev-corpus/runtime.mjs'
      - 'services/workers/requirements-workspace-engine.txt'
      - 'tools/signal-semantic-lab/src/**'
      - 'tools/signal-semantic-lab/tests/test_workspace_incremental_engine.py'
      - 'tools/signal-semantic-lab/tests/test_workspace_engine.py'

permissions:
  contents: read

concurrency:
  group: mfp-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
    steps:
      - name: Validate requested source SHA before checkout
        env:
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MANUAL_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha must be exactly 40 hex characters' >&2; exit 1; }
          fi
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Expected source SHA is invalid' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify clean exact source and attest Git identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          expected_sha="${EXPECTED_SOURCE_SHA,,}"
          [[ "$actual_sha" == "$expected_sha" ]] || { echo 'Checked-out HEAD does not match expected source SHA' >&2; exit 1; }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || { echo 'Source checkout is not clean' >&2; exit 1; }
          tree_sha="$(git rev-parse --verify 'HEAD^{tree}')"
          echo "Git source attestation: commit=$actual_sha tree=$tree_sha"

      - name: Build dedicated remote runtime
        run: docker build --tag noisia-mfp:ci --file scripts/dev-corpus/Dockerfile .
      - name: Verify Python modules without providers
        run: >-
          docker run --rm --entrypoint /opt/noisia-engine/bin/python
          --env PYTHONPATH=/app/tools/signal-semantic-lab/src noisia-mfp:ci
          -c "from bertopic import BERTopic; from signal_semantic_lab import workspace_engine, workspace_incremental_engine"
      - name: Verify frozen-model incremental contract without providers
        run: >-
          docker run --rm --entrypoint sh
          --volume "$PWD/tools/signal-semantic-lab/tests:/tests:ro"
          --env PYTHONPATH=/app/tools/signal-semantic-lab/src noisia-mfp:ci
          -c "/opt/noisia-engine/bin/pip install --no-cache-dir pytest==8.3.5 &&
          /opt/noisia-engine/bin/python -m pytest -q -p no:cacheprovider /tests/test_workspace_incremental_engine.py"
      - name: Verify idle startup and target rejection
        run: docker run --rm --entrypoint node noisia-mfp:ci --test scripts/dev-corpus/harness.test.mjs
