services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ${R16BENCH_POSTGRES_CONTAINER_NAME:?R16BENCH_POSTGRES_CONTAINER_NAME is required}
    environment:
      POSTGRES_DB: ${R16BENCH_DB_NAME:?R16BENCH_DB_NAME is required}
      POSTGRES_PASSWORD: ${R16BENCH_POSTGRES_PASSWORD:?R16BENCH_POSTGRES_PASSWORD is required}
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
