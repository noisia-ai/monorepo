            dataset:
              const: reports
            row_count:
              type: integer
    V2SectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          description: Full Signal report or a single structured Signal section.
          oneOf:
            - $ref: "#/components/schemas/V2FullReport"
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: "null"
        meta:
          type: object
          required: [api_version, output_id, section, report_version, schema_version, published_at]
          properties:
            api_version:
              const: 2
            output_id:
              type: string
            section:
              $ref: "#/components/schemas/V2Section"
            report_version:
              type: integer
            schema_version:
              type: integer
            published_at:
              type: [string, "null"]
              format: date-time
    V2FullReport:
      type: object
      required: [metadata, report, manifest, metrics, sections]
      properties:
        metadata:
          type: object
          additionalProperties: true
        report:
          $ref: "#/components/schemas/SignalReportHeader"
        manifest:
          type: object
          additionalProperties:
            type: boolean
        metrics:
          $ref: "#/components/schemas/SignalMetrics"
        sections:
          type: object
          additionalProperties: true
          properties:
            overview:
              type: object
              additionalProperties: true
            findings:
              type: array
              items:
                $ref: "#/components/schemas/PublicFinding"
            decision_field:
              type: object
              additionalProperties: true
            action_cards:
              type: array
              items:
                type: object
                additionalProperties: true
            strategic_opportunities:
              type: array
              items:
                type: object
                additionalProperties: true
            competitive_intelligence:
              type: object
              additionalProperties: true
            emerging_patterns:
              type: array
              items:
                type: object
                additionalProperties: true
            future_signals:
              type: array
              items:
                type: object
                additionalProperties: true
            market_analysis:
              type: [object, "null"]
              additionalProperties: true
            knowledge_impact:
              type: [object, "null"]
              additionalProperties: true
            evidence_deep_dives:
              type: array
              items:
                type: object
                additionalProperties: true
            aggregates:
              type: object
              additionalProperties: true
            evidence_sample:
              type: array
              items:
                type: object
                additionalProperties: true
            manifest:
              type: object
              additionalProperties:
                type: boolean
    SignalReportHeader:
      type: object
      required: [brand_name, methodology_name, methodology_slug, headline, summary]
      properties:
        brand_name:
          type: string
          description: Backward-compatible report subject label. For industry/theme reports this is the theme name.
        methodology_name:
          type: string
        methodology_slug:
          type: string
        business_question:
          type: [string, "null"]
        headline:
          type: string
        summary:
          type: string
    SignalMetrics:
      type: object
      required: [findings_total, barriers_total, triggers_total, movable_total]
      properties:
        findings_total:
          type: number
        barriers_total:
          type: number
        triggers_total:
          type: number
        movable_total:
          type: number
    PublicFinding:
      type: object
      required:
        - finding_id
        - finding_name
        - polarity
        - layer
        - confidence
        - frequency_mentions
        - intensity_score
        - composite_score
        - evidence_count
      properties:
        finding_id:
          type: string
        finding_name:
          type: string
        polarity:
          type: string
          enum: [trigger, barrier, mixed]
        layer:
          type: string
          enum: [psicologico, personal, social, cultural]
        mobility:
          type: [string, "null"]
          enum: [movible_por_marca, parcialmente_movible, estructural, null]
        confidence:
          type: string
          enum: [alta, media, baja_direccional]
        frequency_mentions:
          type: number
        intensity_score:
          type: number
        predictive_capacity:
          type: [number, "null"]
        composite_score:
          type: number
        share_of_findings_pct:
          type: number
        evidence_count:
          type: number
        period_start:
          type: [string, "null"]
        period_end:
          type: [string, "null"]
        public_quote:
          type: [string, "null"]
