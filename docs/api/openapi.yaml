openapi: 3.1.0
info:
  title: Noisia Public Reporting API
  version: "2.0.0"
  summary: Public reporting endpoints for customers and external integrations.
  description: |
    Public API for published Noisia Signal reports.

    V1 exposes flat tabular datasets and CSV exports for BI tools.
    V2 exposes the structured client-ready Signal output for external integrations.
servers:
  - url: https://studio.noisia.ai
    description: Production
security:
  - bearerAuth: []
  - noisiaApiKey: []
tags:
  - name: Public V1
    description: Flat datasets and CSV exports.
  - name: Public V2
    description: Structured Signal output for customers and external integrations.
  - name: Signal Workspace V1
    description: Protected workspace-centric live Social Listening APIs. Disabled by default.
  - name: Data OS Review
    description: Protected internal artifact review APIs. Disabled by default.
  - name: Signal Semantic Review
    description: Protected internal semantic mention Review APIs. Never exposed to Signal clients.
  - name: Signal Acquisition Plan
    description: Protected internal workspace-owned acquisition control-plane APIs.
  - name: Topic Discovery Review
    description: Protected internal operator review of pending discovery proposals; never Signal serving or semantic assignment authority.
  - name: Semantic Context Pack
    description: Protected management-only authority for structured Brand OS/Knowledge context; never serving or classification authority.
paths:
  /api/public/v1/reports:
    get:
      tags: [Public V1]
      operationId: listPublicV1Reports
      summary: List published reports visible to the API key.
      responses:
        "200":
          description: Visible published reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1ReportsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/public/v1/reports/{outputId}/{dataset}:
    get:
      tags: [Public V1]
      operationId: getPublicV1ReportDataset
      summary: Get a flat JSON dataset for one report.
      parameters:
        - $ref: "#/components/parameters/OutputId"
        - name: dataset
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/V1Dataset"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
          description: Use `csv` to download the dataset as CSV.
      responses:
        "200":
          description: Dataset rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1DatasetResponse"
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/public/v1/reports/{outputId}/time-series/monthly:
    get:
      tags: [Public V1]
      operationId: getPublicV1MonthlyTimeSeries
      summary: Get monthly mention volume.
      parameters:
        - $ref: "#/components/parameters/OutputId"
      responses:
        "200":
          description: Monthly time-series rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1DatasetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/public/v1/reports/{outputId}/distributions/{distribution}:
    get:
      tags: [Public V1]
      operationId: getPublicV1Distribution
      summary: Get a flat distribution dataset.
      parameters:
        - $ref: "#/components/parameters/OutputId"
        - name: distribution
          in: path
          required: true
          schema:
            type: string
            enum: [platform, content-type, layer, mobility, polarity]
      responses:
        "200":
          description: Distribution rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1DatasetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/public/v1/reports/{outputId}/datasets/{datasetFile}:
    get:
      tags: [Public V1]
      operationId: downloadPublicV1DatasetCsv
      summary: Download a V1 dataset as CSV.
      parameters:
        - $ref: "#/components/parameters/OutputId"
        - name: datasetFile
          in: path
          required: true
          schema:
            type: string
            examples:
              - findings.csv
              - recommendations.csv
              - time-series-monthly.csv
      responses:
        "200":
          description: CSV dataset.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/public/v2/reports:
    get:
      tags: [Public V2]
      operationId: listPublicV2Reports
      summary: List published reports visible to the API key.
      responses:
        "200":
          description: Visible published reports with available sections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ReportsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/public/v2/reports/{outputId}:
    get:
      tags: [Public V2]
      operationId: getPublicV2Report
      summary: Get the full structured Signal report.
      parameters:
        - $ref: "#/components/parameters/OutputId"
      responses:
        "200":
          description: Full structured report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2SectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/public/v2/reports/{outputId}/sections/{section}:
    get:
      tags: [Public V2]
      operationId: getPublicV2ReportSection
      summary: Get one structured Signal section.
      parameters:
        - $ref: "#/components/parameters/OutputId"
        - name: section
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/V2Section"
      responses:
        "200":
          description: Structured section response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2SectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/data-os/signal/{workspaceId}:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceHome
      summary: Get the front-ready Signal workspace facade.
      description: Consolidates workspace/subject, server-resolved operational read scope, canonical coverage and filter, capabilities, facets, freshness, metric groups, reviewed interpretations, strategic release history, visibility, lineage, partial states and explicit legacy fallback. In governed mode it does not require a study corpus. It never reads published_outputs.payload as source of truth.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/SignalView" }
      responses:
        "200":
          description: Frozen Signal V2 backend facade.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalWorkspaceHomeV1" }
        "304": { description: ETag still current. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/bootstrap:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceBootstrap
      summary: Get workspace identity, operational read scope, optional corpus context, coverage and freshness.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/SignalView" }
      responses:
        "200": { $ref: "#/components/responses/SignalWorkspaceSuccess" }
        "304": { description: ETag still current. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/brand-monitoring:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceBrandMonitoring
      summary: Get the complete Brand Monitoring view under one operational read scope.
      description: The server resolves legacy, shadow or governed mode. Shadow returns the legacy payload and durably schedules governed module checks after the response. Governed resolves the closed server-owned view binding and exact derived population; a non-brand view without a current compatible binding fails closed and never falls back to the brand bridge.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/SignalView" }
        - { $ref: "#/components/parameters/SignalStart" }
        - { $ref: "#/components/parameters/SignalEnd" }
        - { $ref: "#/components/parameters/SignalTimezone" }
        - { $ref: "#/components/parameters/SignalGranularity" }
        - { $ref: "#/components/parameters/SignalComparisonStart" }
        - { $ref: "#/components/parameters/SignalComparisonEnd" }
      responses:
        "200": { description: Compact Brand Monitoring payload with read scope, coverage, comparison, series, breakdowns and freshness. }
        "304": { description: ETag still current. }
        "400": { $ref: "#/components/responses/SignalBackendError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/facets:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceFacets
      summary: List permission-aware facets under the current SignalFilterV1.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/SignalView" }
        - { $ref: "#/components/parameters/SignalStart" }
        - { $ref: "#/components/parameters/SignalEnd" }
        - { $ref: "#/components/parameters/SignalTimezone" }
        - { $ref: "#/components/parameters/SignalGranularity" }
      responses:
        "200": { $ref: "#/components/responses/SignalWorkspaceSuccess" }
        "304": { description: ETag still current. }
        "400": { $ref: "#/components/responses/SignalBackendError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/metric-groups:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceMetricGroups
      summary: Get visible metric groups, versions, capabilities and freshness.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/SignalView" }
        - { $ref: "#/components/parameters/SignalStart" }
        - { $ref: "#/components/parameters/SignalEnd" }
        - { $ref: "#/components/parameters/SignalTimezone" }
        - { $ref: "#/components/parameters/SignalGranularity" }
      responses:
        "200": { $ref: "#/components/responses/SignalWorkspaceSuccess" }
        "304": { description: ETag still current. }
        "400": { $ref: "#/components/responses/SignalBackendError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/interpretations:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceInterpretations
      summary: Get versioned metric-group interpretations for the exact filter and watermark scope.
      description: Claude never calculates metrics; every cited number and evidence ref is validated against canonical SB-05 materializations. Pending, stale, partial and unavailable are explicit states.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/SignalView" }
        - { $ref: "#/components/parameters/SignalStart" }
        - { $ref: "#/components/parameters/SignalEnd" }
        - { $ref: "#/components/parameters/SignalTimezone" }
        - { $ref: "#/components/parameters/SignalGranularity" }
      responses:
        "200": { $ref: "#/components/responses/SignalWorkspaceSuccess" }
        "304": { description: ETag still current. }
        "400": { $ref: "#/components/responses/SignalBackendError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/releases:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceStrategicReleases
      summary: Get current and immutable T&B strategic release history.
      description: Clients receive only human-approved published/client releases. Internal users may also inspect drafts and review states. No payload source is read.
      security: [{ kindeSession: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Current strategic release and ordered immutable history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalStrategicReleasesV1" }
        "304": { description: ETag still current. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
    post:
      tags: [Signal Workspace V1]
      operationId: reviewSignalWorkspaceStrategicRelease
      summary: Create a review draft or human-promote a strategic release.
      description: Internal corpus managers only. Governed V2 promotion is idempotent and fail-closed on analysis approval, quality gates, exact artifact revisions, workspace scope and current evidence authority.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, tb_analysis_id]
                  properties:
                    action: { const: create_draft }
                    tb_analysis_id: { type: string, format: uuid }
                    title: { type: string, maxLength: 300 }
                - type: object
                  additionalProperties: false
                  required: [action, release_id]
                  properties:
                    action: { const: promote }
                    release_id: { type: string, format: uuid }
      responses:
        "200": { description: Release draft result, or an idempotently promoted release result for action=promote. }
        "400": { $ref: "#/components/responses/SignalBackendError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "409": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/reports/triggers-barriers/runs:
    get:
      tags: [Signal Workspace V1]
      operationId: preflightSignalWorkspaceTriggersBarriersRun
      summary: Evaluate the governed T&B launch contract without writes or paid calls.
      description: Resolves the strategic binding, policy, exact derived population, governance provenance, coverage, deterministic sample, provider identity, closed execution plan, runtime readiness and worst-case budget inside one REPEATABLE READ READ ONLY transaction. It performs no writes, enqueues zero jobs and makes zero provider calls. The browser never supplies authority IDs.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - name: period_start
          in: query
          required: true
          schema: { type: string, format: date }
        - name: period_end
          in: query
          required: true
          schema: { type: string, format: date }
        - name: timezone
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: study_size
          in: query
          required: false
          schema: { type: string, enum: [small, medium, large, full_power] }
        - name: hard_cap_usd
          in: query
          required: true
          schema: { type: number, exclusiveMinimum: 0 }
      responses:
        "200":
          description: Read-only preflight. A blocked result remains a successful inspection with ready=false and typed blocking reasons.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalTbStrategicPreflightV1" }
        "400": { $ref: "#/components/responses/SignalBackendError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "409": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
    post:
      tags: [Signal Workspace V1]
      operationId: startSignalWorkspaceTriggersBarriersRun
      summary: Atomically freeze the server-owned strategic population and request an idempotent T&B run.
      description: Recomputes the exact free preflight, rejects stale digests or hard caps, and resolves every binding, policy, compilation, evaluation, population and execution-corpus identity server-side. One transaction freezes the relational snapshot and deterministic sample, creates the governed run control and durable outboxes, and reserves no provider spend until a Worker validates runtime authority. A server-side paid-run flag remains mandatory.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalTbStrategicRunRequestV2" }
      responses:
        "200":
          description: Existing compatible governed run returned by the idempotency key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalTbStrategicLaunchV2" }
        "202":
          description: New governed run, immutable snapshot/sample and durable outboxes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalTbStrategicLaunchV2" }
        "400": { $ref: "#/components/responses/SignalBackendError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "409": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/reports/triggers-barriers/runs/{analysisId}:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceTriggersBarriersRunStatus
      summary: Poll one governed T&B run without side effects.
      description: Returns sanitized lifecycle, step, provider-version, budget and Review/release readiness state. Polling never enqueues, resumes or invokes a provider.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - name: analysisId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current governed run status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalTbStrategicRunStatusV1" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
    delete:
      tags: [Signal Workspace V1]
      operationId: cancelSignalWorkspaceTriggersBarriersRun
      summary: Request cancellation of one governed T&B run.
      description: Records a server-authorized cancellation request. Workers observe the durable state between steps; the operation neither deletes the run nor rewrites its frozen authority.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - name: analysisId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: Cancellation accepted or already requested. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/reports/triggers-barriers/runs/{analysisId}/review:
    post:
      tags: [Signal Workspace V1]
      operationId: reviewSignalWorkspaceTriggersBarriersRun
      summary: Review one workspace T&B run and create its candidate release revision.
      description: Requires a governed V2 run with green quality and snapshot-containment gates. One idempotent database operation records selected reusable assertion decisions and creates the release draft atomically. Accepting findings or artifacts never approves all generated tags.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - name: analysisId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalTbStrategicReviewRequestV2" }
      responses:
        "200":
          description: Atomic Review result and idempotent release draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalTbStrategicReviewResultV2" }
        "400": { $ref: "#/components/responses/SignalBackendError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "409": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/triggers-barriers:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceTriggersBarriersOverview
      summary: Read the current T&B report revision by workspace and report key.
      description: Reads relational findings, artifacts and snapshot identity. It never serves published_outputs.payload and does not require a study query parameter.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/SignalStart" }
        - { $ref: "#/components/parameters/SignalEnd" }
      responses:
        "200": { $ref: "#/components/responses/SignalWorkspaceSuccess" }
        "304": { description: ETag still current. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
        "503": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/triggers-barriers/series:
    get:
      tags: [Signal Workspace V1]
      operationId: getSignalWorkspaceTriggersBarriersSeries
      summary: Read current-release T&B series under its frozen snapshot.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/SignalStart" }
        - { $ref: "#/components/parameters/SignalEnd" }
        - name: finding
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/SignalWorkspaceSuccess" }
        "304": { description: ETag still current. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SignalBackendError" }
  /api/data-os/signal/{workspaceId}/triggers-barriers/findings/{findingId}:
    get:
