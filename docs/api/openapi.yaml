        "422": { description: Closed V2 command or digest rejected. }
  /api/data-os/signal/{workspaceId}/semantic-context/merge:
    post:
      tags: [Semantic Context Pack]
      operationId: mergeSemanticContextElementsV2
      summary: Resolve one to 100 same-kind current elements into one pending target append-only.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalSemanticContextMergeCommandV2" }
      responses:
        "200":
          description: N source successors are terminal merged; the single target successor is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalSemanticContextMergeResultV2" }
        "409": { description: Generation, current-leaf, annotation, graph, evidence or replay precondition rejected. }
        "422": { description: Closed merge command rejected. }
  /api/data-os/signal/{workspaceId}/semantic-context/corrections:
    post:
      tags: [Semantic Context Pack]
      operationId: correctSemanticContextElementV2
      summary: Append an operator correction that always reopens the current element as pending.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalSemanticContextCorrectionCommandV2" }
      responses:
        "200":
          description: Pending correction successor and re-bound annotation lineage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalSemanticContextCorrectionResultV2" }
        "409": { description: Published, stale, merged-terminal, active-run or replay state rejected. }
        "422": { description: Closed correction command rejected. }
  /api/data-os/signal/{workspaceId}/semantic-context/annotations:
    post:
      tags: [Semantic Context Pack]
      operationId: annotateSemanticContextElementV2
      summary: Append or resolve one closed review annotation without changing semantic disposition.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalSemanticContextAnnotationCommandV2" }
      responses:
        "200": { description: Append-only annotation version. }
        "409": { description: Subject, generation, resolution or replay state rejected. }
        "422": { description: Closed annotation command rejected. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: "Preferred auth header: `Authorization: Bearer <NOISIA_REPORTING_API_KEY>`."
    noisiaApiKey:
      type: apiKey
      in: header
      name: x-noisia-api-key
      description: Fallback API key header.
    kindeSession:
      type: apiKey
      in: cookie
      name: noisia_studio_session
      description: Logical Studio session; Kinde authenticates and Noisia DB authorizes workspace and brand access.
  parameters:
    OutputId:
      name: outputId
      in: path
      required: true
      schema:
        type: string
      description: Published output id.
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Stable Signal workspace id, never an output id.
    AcquisitionSlotKey:
      name: slotKey
      in: path
      required: true
      schema: { $ref: "#/components/schemas/SignalAcquisitionSlotKeyV1" }
    AcquisitionImportBatchId:
      name: importBatchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SignalView:
      name: view
      in: query
      required: false
      description: Closed client-safe governed view. Defaults to brand. The server resolves all policy, entity, population, compilation and binding identities; clients cannot supply those authorities.
      schema:
        type: string
        enum: [brand, competition, category, all-governed]
        default: brand
    SemanticAssertionId:
      name: assertionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 500 }
    SignalStart:
      name: start
      in: query
      required: true
      schema: { type: string, format: date }
    SignalEnd:
      name: end
      in: query
      required: true
      schema: { type: string, format: date }
    SignalTimezone:
      name: timezone
      in: query
      required: false
      schema: { type: string, default: workspace timezone }
    SignalGranularity:
      name: granularity
      in: query
      required: false
      schema: { type: string, enum: [day, week, month], default: day }
    SignalTextSearch:
      name: text_search
      in: query
      required: false
      description: Canonical case-insensitive full-text search, maximum 200 characters. Aliases search, query and q are accepted.
      schema: { type: string, maxLength: 200 }
    SignalTaxonomyKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [topic, narrative] }
    SignalTaxonomyTermKey:
      name: termKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$'
    SignalComparisonStart:
      name: comparison_start
      in: query
      required: false
      description: Inclusive comparison start; must be paired with comparison_end.
      schema: { type: string, format: date }
    SignalComparisonEnd:
      name: comparison_end
      in: query
      required: false
      description: Inclusive comparison end; must be paired with comparison_start.
      schema: { type: string, format: date }
    SignalMetricKey:
      name: metric_key
      in: query
      required: true
      schema: { type: string }
    SignalMetricVersion:
      name: metric_version
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    SignalRequireFresh:
      name: require_fresh
      in: query
      required: false
      description: Fail with a typed stale or partial response instead of serving degraded materialization state.
      schema: { type: boolean, default: false }
  responses:
    SignalWorkspaceSuccess:
      description: signal-backend-v1 response. Concrete shape depends on the route.
      content:
        application/json:
          schema:
            type: object
            required: [contract_version]
            properties:
              contract_version: { const: signal-backend-v1 }
            additionalProperties: true
    SignalWorkspacePending:
      description: A bounded ad hoc materialization was deduplicated and queued.
      content:
        application/json:
          schema:
            type: object
            required: [contract_version, state, filters_hash, retry_after_seconds]
            properties:
              contract_version: { const: signal-backend-v1 }
              state: { const: pending }
              filters_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              retry_after_seconds: { type: integer }
    SignalBackendError:
      description: Typed signal-backend-v1 contract error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SignalBackendErrorV1" }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: API key cannot access this report.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Report, dataset or section not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SignalSemanticContextReviewSummaryV1:
      type: object
      additionalProperties: false
      required: [contract_version, readiness, generation, latest_proposal_run, authority]
      properties:
        contract_version: { const: signal-semantic-context-review-summary-v1 }
        readiness: { type: object, additionalProperties: true }
        generation: { type: [object, "null"], additionalProperties: true }
        latest_proposal_run:
          oneOf:
            - type: object
              additionalProperties: true
              description: Operator allowlist only; no refs, digests, raw request/response or provider request identity.
            - { type: "null" }
        authority:
          type: object
          additionalProperties: false
          required: [source, private_fields_withheld]
          properties:
            source: { const: server_owned }
            private_fields_withheld: { const: true }
    SignalSemanticContextReviewElementV1:
      type: object
      additionalProperties: false
      required: [element_key, element_version, element_kind, canonical_key, display_text, scope,
        entity_type, locale, relation_kind, relation_target_key, disposition, origin, provenance,
        applicability, evidence_summary, attention]
      properties:
        element_key: { type: string }
        element_version: { type: integer, minimum: 1 }
        element_kind: { type: string }
        canonical_key: { type: string }
        display_text: { type: string }
        scope: { type: [string, "null"] }
        entity_type: { type: [string, "null"] }
        locale: { type: [string, "null"] }
        relation_kind: { type: [string, "null"] }
        relation_target_key: { type: [string, "null"] }
        disposition: { type: string, enum: [pending, approved, rejected, merged] }
        origin: { type: string }
        provenance: { type: object, additionalProperties: false, required: [proposed_at, decided_at], properties: { proposed_at: { type: string, format: date-time }, decided_at: { type: [string, "null"], format: date-time } } }
        applicability: { type: object, additionalProperties: true }
        evidence_summary: { type: object, additionalProperties: true }
        attention:
          type: object
          additionalProperties: true
          description: Deterministic review-priority hints. authoritative is always false.
          required: [authoritative]
          properties: { authoritative: { const: false } }
    SignalSemanticContextReviewPageV1:
      type: object
      additionalProperties: false
      required: [contract_version, generation, total, page_size, next_cursor, elements, facets, authority]
      properties:
        contract_version: { const: signal-semantic-context-review-page-v1 }
        generation: { type: object, additionalProperties: true }
        total: { type: integer, minimum: 0 }
        page_size: { type: integer, enum: [20, 40] }
        next_cursor: { type: [string, "null"] }
        elements: { type: array, items: { $ref: "#/components/schemas/SignalSemanticContextReviewElementV1" } }
        facets: { type: object, additionalProperties: true }
        authority:
          type: object
          additionalProperties: false
          required: [source, attention_signals_authoritative]
          properties:
            source: { const: server_owned }
            attention_signals_authoritative: { const: false }
    SignalSemanticContextReviewEvidenceV1:
      type: object
      additionalProperties: false
      required: [relation, source_type, source_kind, source_title, section_label, source_context,
        applicability, generation_state, current_state, unavailable_reason]
      properties:
        relation: { type: string, enum: [supports, limits, contradicts] }
        source_type: { type: string }
        source_kind: { type: string }
        source_title: { type: string }
        section_label: { type: string }
        source_context:
          type: object
          additionalProperties: false
          required: [label, preview, truncated, redacted, pinpoint_citation]
          properties:
            label: { const: context_supplied_to_model }
            preview: { type: [string, "null"], maxLength: 720 }
            truncated: { type: boolean }
            redacted: { type: boolean }
            pinpoint_citation: { const: false }
        applicability: { type: object, additionalProperties: true }
        generation_state: { const: validated_at_generation }
        current_state: { type: string, enum: [current, inactive, unavailable] }
        unavailable_reason: { type: [string, "null"], enum: [source_unavailable, context_not_available, null] }
    SignalSemanticContextReviewDetailV1:
      type: object
      additionalProperties: false
      required: [contract_version, generation, element, evidence, review_annotations, merge_lineage,
        lineage, evidence_notice, authority]
      properties:
        contract_version: { const: signal-semantic-context-review-detail-v1 }
        generation: { type: object, additionalProperties: true }
        element: { $ref: "#/components/schemas/SignalSemanticContextReviewElementV1" }
        evidence: { type: array, items: { $ref: "#/components/schemas/SignalSemanticContextReviewEvidenceV1" } }
        review_annotations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [annotation_key, annotation_version, annotation_type, state, resolution,
              subject_element_key, reason, rationale, related_elements, created_at]
            properties:
              annotation_key: { type: string, maxLength: 200 }
              annotation_version: { type: integer, minimum: 1 }
              annotation_type: { type: string, enum: [uncertain, needs_more_context, near_duplicate, locale_unresolved, competitive_unit_unresolved] }
              state: { type: string, enum: [open, resolved] }
              resolution: { type: [string, "null"], enum: [merged, kept_distinct, context_sufficient, not_supported, governed_locale, global, canonical_unit, not_applicable, null] }
              subject_element_key: { type: string, maxLength: 200 }
              reason: { type: string }
              rationale: { type: string, maxLength: 1000 }
              related_elements:
                type: array
                maxItems: 100
                items:
                  type: object
                  additionalProperties: false
                  required: [element_key, element_kind, display_text]
                  properties:
                    element_key: { type: string }
                    element_kind: { type: string }
                    display_text: { type: string, maxLength: 500 }
              created_at: { type: string, format: date-time }
        merge_lineage:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, source_element_key, target_element_key, reason, rationale, created_at]
            properties:
              role: { type: string, enum: [source, target] }
              source_element_key: { type: string }
              target_element_key: { type: string }
              reason: { type: string }
              rationale: { type: string, maxLength: 1000 }
              created_at: { type: string, format: date-time }
        lineage:
          type: object
          additionalProperties: false
          required: [element_version, origin, append_only]
          properties:
            element_version: { type: integer, minimum: 1 }
            origin: { type: string }
            append_only: { const: true }
        evidence_notice: { type: object, additionalProperties: true }
        authority: { type: object, additionalProperties: true }
    SignalSemanticContextGenerationDetailV1:
      type: object
      additionalProperties: false
      required: [contract_version, generation, elements, latest_proposal_run, source_authority]
      properties:
        contract_version: { const: signal-semantic-context-pack-v1 }
        generation: { type: object, additionalProperties: true }
        elements:
          type: array
          items: { type: object, additionalProperties: true }
        latest_proposal_run:
          oneOf:
            - { $ref: "#/components/schemas/SignalSemanticContextProposalRunV1" }
            - { type: "null" }
        source_authority:
          type: object
          additionalProperties: false
          required: [brand_os_digest, knowledge_digest, locale_context_digest]
          properties:
            brand_os_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            knowledge_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            locale_context_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    SignalSemanticContextReadinessV1:
      type: object
      additionalProperties: false
      required: [contract_version, brand_os_digest, knowledge_digest,
        semantic_context_pack_digest, lifecycle_state, counts, locale_market_coverage,
        drift_state, drift_reasons, ready_for_context_aware_discovery, limitations]
      properties:
        contract_version: { const: signal-semantic-context-pack-v1 }
        brand_os_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        knowledge_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        semantic_context_pack_digest: { type: [string, "null"], pattern: '^sha256:[0-9a-f]{64}$' }
        lifecycle_state: { type: string, enum: [not_available, draft, published] }
        generation: { type: [object, "null"], additionalProperties: true }
        open_draft: { type: [object, "null"], additionalProperties: true }
        counts:
          type: object
          additionalProperties: false
          required: [pending, approved, rejected, merged]
          properties:
            pending: { type: integer, minimum: 0 }
            approved: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            merged: { type: integer, minimum: 0 }
        locale_market_coverage: { type: object, additionalProperties: true }
        drift_state: { type: string, enum: [not_available, current, stale] }
        drift_reasons: { type: array, items: { type: string } }
        ready_for_context_aware_discovery: { type: boolean }
        limitations: { type: array, items: { type: string } }
    SignalSemanticContextDecisionV2:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, generation_key, element_key, reason, rationale, confirmation]
          properties:
            action: { const: approve }
            generation_key: { type: string }
            element_key: { type: string }
            reason: { type: string, enum: [duplicate_same_concept, alias_or_variant, canonicalization, semantic_boundary, locale_resolution, competitive_unit_resolution, insufficient_context, operator_correction] }
            rationale: { type: string, minLength: 1, maxLength: 1000 }
            confirmation: { const: approve_selected_semantic_context_element }
        - type: object
          additionalProperties: false
          required: [action, generation_key, element_key, reason, rationale]
          properties:
            action: { const: reject }
            generation_key: { type: string }
            element_key: { type: string }
            reason: { type: string, enum: [duplicate_same_concept, alias_or_variant, canonicalization, semantic_boundary, locale_resolution, competitive_unit_resolution, insufficient_context, operator_correction] }
            rationale: { type: string, minLength: 1, maxLength: 1000 }
        - type: object
          additionalProperties: false
          required: [action, generation_key, element_keys, reason, rationale, confirmation]
          properties:
            action: { const: bulk_approve }
            generation_key: { type: string }
            element_keys: { type: array, minItems: 2, maxItems: 15, uniqueItems: true, items: { type: string } }
            reason: { type: string, enum: [duplicate_same_concept, alias_or_variant, canonicalization, semantic_boundary, locale_resolution, competitive_unit_resolution, insufficient_context, operator_correction] }
            rationale: { type: string, minLength: 1, maxLength: 1000 }
            confirmation: { const: apply_shared_decision_basis_to_all_selected_elements }
    SignalSemanticContextCorrectionFieldsV2:
      type: object
      additionalProperties: false
      required: [canonical_key, display_text, scope, locale, relation_kind, relation_target_key]
      properties:
        canonical_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        display_text: { type: string, minLength: 1, maxLength: 500 }
        scope: { type: [string, "null"], maxLength: 200 }
        locale: { type: [string, "null"], pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$' }
        relation_kind: { type: [string, "null"], enum: [is_a, part_of, surface_of, competes_with, associated_with, null] }
        relation_target_key: { type: [string, "null"], pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
    SignalSemanticContextAnnotationResolutionV2:
      type: object
      additionalProperties: false
      required: [annotation_key, resolution]
      properties:
        annotation_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        resolution: { type: string, enum: [merged, kept_distinct, context_sufficient, not_supported, governed_locale, global, canonical_unit, not_applicable] }
    SignalSemanticContextMergeCommandV2:
      type: object
      additionalProperties: false
      required: [generation_key, target_element_key, source_element_keys, reason, rationale, target_correction]
      properties:
        generation_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        target_element_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        source_element_keys:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        reason: { type: string, enum: [duplicate_same_concept, alias_or_variant, canonicalization, semantic_boundary, locale_resolution, competitive_unit_resolution, insufficient_context, operator_correction] }
        rationale: { type: string, minLength: 1, maxLength: 1000 }
        target_correction: { $ref: "#/components/schemas/SignalSemanticContextCorrectionFieldsV2" }
        target_annotation_resolutions:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Each annotation_key is unique; contradictory or repeated resolutions are rejected atomically.
          x-unique-by: annotation_key
          items: { $ref: "#/components/schemas/SignalSemanticContextAnnotationResolutionV2" }
    SignalSemanticContextCorrectionCommandV2:
      type: object
      additionalProperties: false
      required: [generation_key, element_key, reason, rationale, correction]
      properties:
        generation_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        element_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        reason: { type: string, enum: [duplicate_same_concept, alias_or_variant, canonicalization, semantic_boundary, locale_resolution, competitive_unit_resolution, insufficient_context, operator_correction] }
        rationale: { type: string, minLength: 1, maxLength: 1000 }
        correction: { $ref: "#/components/schemas/SignalSemanticContextCorrectionFieldsV2" }
        annotation_resolutions:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Each annotation_key is unique; contradictory or repeated resolutions are rejected atomically.
          x-unique-by: annotation_key
          items: { $ref: "#/components/schemas/SignalSemanticContextAnnotationResolutionV2" }
    SignalSemanticContextCorrectionResultV2:
      type: object
      additionalProperties: false
      required: [generation_key, element_key, element_version, disposition, draft_digest_ref]
      properties:
        generation_key: { type: string }
        element_key: { type: string }
        element_version: { type: integer, minimum: 1 }
        disposition: { const: pending }
        draft_digest_ref:
          type: string
          description: Abbreviated operator-safe reference; never the full private draft digest.
          pattern: '^sha256:[0-9a-f]{8}\u2026[0-9a-f]{8}$'
    SignalSemanticContextMergeResultV2:
      type: object
      additionalProperties: false
      required: [generation_key, target_element_key, source_element_keys, merged,
        target_disposition, draft_digest_ref, annotation_reconciliation]
      properties:
        generation_key: { type: string }
        target_element_key: { type: string }
        source_element_keys:
          type: array
          uniqueItems: true
          items: { type: string }
        merged: { type: integer, minimum: 1, maximum: 100 }
        target_disposition: { const: pending }
        draft_digest_ref:
          type: string
          description: Abbreviated operator-safe reference; never the full private draft digest.
          pattern: '^sha256:[0-9a-f]{8}\u2026[0-9a-f]{8}$'
        annotation_reconciliation:
          type: object
          additionalProperties: false
          required: [source_count, source_matching_near_duplicate_resolved,
            source_other_open_annotations, target_open_annotations_before,
            target_annotations_rebound_open, target_annotations_resolved_in_merge,
            merged_successor_open_annotations, open_annotations_before, open_annotations_after]
          properties:
            source_count: { type: integer, minimum: 1 }
            source_matching_near_duplicate_resolved: { type: integer, minimum: 0 }
            source_other_open_annotations: { type: integer, minimum: 0 }
            target_open_annotations_before: { type: integer, minimum: 0 }
            target_annotations_rebound_open: { type: integer, minimum: 0 }
            target_annotations_resolved_in_merge: { type: integer, minimum: 0 }
            merged_successor_open_annotations: { type: integer, minimum: 0 }
            open_annotations_before: { type: integer, minimum: 0 }
            open_annotations_after: { type: integer, minimum: 0 }
    SignalSemanticContextAnnotationCommandV2:
      type: object
      additionalProperties: false
      required: [generation_key, element_key, annotation_key, annotation_type, reason, rationale, related_element_keys]
      properties:
        generation_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        element_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        annotation_key: { type: string, pattern: '^[a-z0-9]+(?:[._:-][a-z0-9]+)*$', maxLength: 200 }
        annotation_type: { type: string, enum: [uncertain, needs_more_context, near_duplicate, locale_unresolved, competitive_unit_unresolved] }
        reason: { type: string, enum: [duplicate_same_concept, alias_or_variant, canonicalization, semantic_boundary, locale_resolution, competitive_unit_resolution, insufficient_context, operator_correction] }
        rationale: { type: string, minLength: 1, maxLength: 1000 }
        related_element_keys:
          type: array
          maxItems: 100
          uniqueItems: true
