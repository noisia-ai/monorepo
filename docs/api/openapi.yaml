      responses:
        "200": { description: Upload failure recorded without erasing the sealed batch. }
        "202": { description: Upload finalized/queued or storage recovery created/replayed. }
        "400": { description: Idempotency-Key is missing or malformed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Import not found in the authorized workspace. }
        "409": { description: Seal, storage ownership or replay is incompatible. }
