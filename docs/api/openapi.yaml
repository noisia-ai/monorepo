        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, correct, limit, reject] }
                notes: { type: string, maxLength: 2000 }
                patch:
                  type: object
                  additionalProperties: false
                  properties:
                    title: { type: [string, "null"] }
                    summary: { type: [string, "null"] }
                    content: {}
                    confidence: { type: [string, "null"] }
                    metadata: { type: object }
