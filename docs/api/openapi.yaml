        "404": { description: Import not found in the authorized workspace. }
    post:
      tags: [Signal Acquisition Plan]
      operationId: transitionSignalAcquisitionImport
      summary: Finalize upload, record upload failure, or retry a failed batch from sealed storage.
      description: Recovery copies the original seal and preserves the failed attempt. It never re-resolves against a newer plan.
