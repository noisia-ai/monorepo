      tags: [Signal Semantic Review]
      operationId: prepareSignalSemanticResolution
      summary: Prepare a confirmed, budget-capped semantic resolution parent and durable child batches.
      description: The only resolver method permitted to create durable work. It requires the exact free-preflight digest and an operator-selected hard cap; it never truncates the eligible selection and does not treat the USD 40 confirmation threshold as a budget ceiling.
      security: [{ kindeSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
