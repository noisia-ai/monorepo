        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Cursor-paginated canonical Review queue and complete-set reconciliation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalSemanticReviewQueueV1" }
