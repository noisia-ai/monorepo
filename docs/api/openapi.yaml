      operationId: getSignalSemanticResolutionStatus
      summary: Poll resolver status without side effects.
      description: Strictly read-only. GET never prepares, resumes or enqueues a resolver run.
      security: [{ kindeSession: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200": { description: Latest resolver status, or run null. }
